WORLDS.silabario.push(

{ id:"espejo-labios", label:"El espejo: que el niño se vea cerrar los labios", level:2, lon:6, tier:"point", ab:2,
  view:"Un espejo de mano, dos minutos. El adulto y el niño se sientan lado a lado frente al espejo y dicen mmmmm largo, mirándose. Después el niño lo hace solo y se mira.\n\nLo que se está enseñando no es el sonido, que el niño ya sabe hacer, sino la conciencia de qué hace su cuerpo para producirlo. Esa conciencia es el ancla a la que va a volver cada vez que dude entre m y n, entre m y p, o cada vez que no le salga la unión con la vocal. Un niño que sabe que la m se hace con los labios cerrados tiene un método propio para verificar; uno que solo la reconoce de vista, no.\n\nVariantes que funcionan: hacerlo con el vidrio empañado del baño, hacerlo con la cámara del teléfono en modo selfie, hacerlo con los ojos cerrados tocándose los labios. Todas duran menos de un minuto y ninguna se siente como una lección." },

{ id:"m-en-el-aire", label:"Dibujar la m en el aire con el brazo entero", level:2, lon:21, tier:"point", ab:2,
  view:"Antes del lápiz, el brazo. El adulto se pone de pie junto al niño, ambos mirando la misma dirección —no de frente, porque de frente la letra sale volteada— y trazan la m gigante en el aire: baja, sube-baja, sube-baja. Se dice «mmm» mientras se traza.\n\nEl movimiento grande usa la musculatura del hombro y no la de los dedos, que a los cuatro años todavía es imprecisa. Eso permite que el niño memorice la forma como un gesto completo antes de tener que controlarla en pequeño. La secuencia después es: aire, superficie con textura, crayón grueso, lápiz.\n\nLa superficie con textura merece insistencia porque es la que más gusta y la que más deja: harina o azúcar esparcida en una charola, arena, espuma de afeitar sobre la mesa, el vidrio empañado. El dedo deja huella sin ninguna fuerza, el error se borra pasando la mano, y la sensación táctil agrega un canal de memoria que el lápiz no da." },

{ id:"bostezo-abrir", label:"Abrir grande para la /a/: el juego del bostezo", level:2, lon:46, tier:"point", ab:2,
  view:"La /a/ se enseña exagerando. El adulto abre la boca todo lo que puede, como en un bostezo, y suelta una a larga; el niño imita, y se compara quién la abrió más. Con un espejo funciona mejor.\n\nEl objetivo es que el niño asocie la vocal con una sensación corporal grande y clara, no con un signo en un papel. Después, cuando vea la letra a, va a tener a qué asociarla. El mismo juego se repite con las otras cuatro vocales, pero la a es la que se hace primero porque es la más exagerable.\n\nUn detalle de pronunciación que conviene cuidar: en español la a es siempre la misma, abierta y central, sin las variantes del inglés. Dígala limpia, sin arrastrarla hacia la e ni hacia la o. Si el niño la produce ligeramente distinta no importa; lo que importa es que sea reconociblemente una a." },

{ id:"cara-de-cada-vocal", label:"La cara que hace cada vocal, una por una", level:2, lon:65, tier:"point", ab:2,
  view:"Cinco vocales, cinco caras. El juego consiste en decirlas despacio frente a un espejo y notar qué cambia: a, la boca muy abierta; e, media y estirada; i, casi cerrada y sonriendo; o, redonda; u, redonda y adelantada como para dar un beso.\n\nUna vez que las cinco caras están reconocidas, el juego se invierte y ahí empieza a servir de verdad: el adulto hace la cara sin sonido, y el niño adivina cuál es. Después al revés. Adivinar una vocal por la forma de la boca obliga a atender a una diferencia articulatoria fina, y esa atención es exactamente la que después se necesita para distinguir ma de mo en un papel.\n\nEl juego funciona bien en cualquier momento muerto: en el coche, en la fila del súper, esperando la comida. No necesita material y dura lo que dure la paciencia." },

{ id:"alargar-la-vocal", label:"Alargar la vocal: maaaa, y por qué eso ayuda a oír la unión", level:2, lon:78, tier:"point", ab:1,
  view:"La sílaba abierta se deja estirar por el final. «maaaaaa» es la misma sílaba que «ma», solo que con la vocal sostenida, y esa posibilidad es una herramienta de enseñanza y no un juego.\n\nEstirar la vocal hace dos cosas. Separa perceptivamente las dos partes de la sílaba sin cortarlas: el niño oye que hay algo al principio y algo que continúa, y esa es la primera intuición de que la sílaba tiene piezas. Y da tiempo: mientras la vocal se sostiene, el ojo del niño puede recorrer las dos letras del papel y asociarlas con lo que la boca está haciendo.\n\nLa versión completa combina las dos elongaciones: mmmmmaaaaa, primero la consonante larga, después la vocal larga, sin cortar el aire en medio. Se hace tres o cuatro veces por sesión, con la tarjeta a la vista, y se va acortando en los días siguientes hasta que la sílaba salga a velocidad normal." },

{ id:"mmm-mas-a", label:"El deslizamiento mmmaaa dicho sin cortar el aire", level:2, lon:96, tier:"point", ab:0,
  view:"Esta es la técnica central de todo el método y cabe en una frase: no cortar el aire entre la consonante y la vocal.\n\nEl adulto cierra los labios, empieza a zumbar —mmmmm—, y sin dejar de sonar abre la boca; el zumbido se convierte en aaaa por sí solo. No hay dos sonidos pegados: hay uno que cambia. El niño imita, y en general lo consigue a la primera porque su boca ya hace eso todos los días al hablar.\n\nLo que hay que evitar activamente es la versión con nombres de letras: «eme... a... ema». Esa ruta lleva a un callejón sin salida, porque el nombre de la letra —«eme»— contiene una vocal que no está en la sílaba, y el niño termina fabricando sonidos que no existen. Durante las primeras semanas conviene no nombrar las letras en absoluto: la m no se llama eme, la m suena mmm.\n\nCon la tarjeta a la vista, el dedo del adulto recorre las dos letras de izquierda a derecha mientras el sonido se desliza. Sonido y dedo van a la misma velocidad." },

{ id:"cambiar-solo-la-vocal", label:"Cambiar solo la vocal y dejar la m quieta", level:2, lon:111, tier:"point", ab:0,
  view:"El ejercicio que consolida la serie completa consiste en poner las cinco tarjetas en fila —ma, me, mi, mo, mu— y leerlas seguidas, señalando. La consonante no se mueve; lo único que cambia es la segunda letra.\n\nDicho así parece trivial, y no lo es: es la primera vez que el niño ve que las sílabas comparten partes. Un niño que nota que ma y mo tienen algo igual y algo distinto acaba de descubrir por su cuenta que la sílaba está hecha de piezas, que es el descubrimiento que el método persigue sin poder enseñarlo directamente.\n\nLas variantes que lo aprovechan: leer la fila al revés, de mu a ma; barajar y leer en desorden, que es lo que de verdad prueba dominio; señalar la que el adulto dice; y encontrar la intrusa cuando se cuela una tarjeta de otra consonante.\n\nLa fila en orden se aprende de memoria en pocos días, y ahí está la trampa. El desorden es la prueba real." },

{ id:"la-m-antes-que-la-p", label:"Por qué la m va antes que la p, la s y la l", level:2, lon:136, tier:"point", ab:1,
  view:"La p es bilabial y visible, igual que la m, y sin embargo va después. La razón es que es oclusiva: se produce cerrando los labios y soltando el aire de golpe, en un instante. No se puede alargar. Y si no se puede alargar, no se puede deslizar hacia la vocal, así que la técnica central del método no se le aplica.\n\nLa s sí es continua y se puede sostener —ssssa—, y por eso suele ir segunda o tercera. Su desventaja es que no es visible: pasa dentro de la boca. La l también es continua y visible en parte, porque se ve la lengua tocar arriba.\n\nLa n es continua, visible y fácil, y aun así se pospone varias posiciones. La razón no es su dificultad sino su parecido con la m, en forma y en sonido a la vez.\n\nUn orden razonable para el primer año: m, p, s, l, t, d, n, y después las demás. La regla que gobierna todo: ninguna consonante nueva antes de que la anterior salga sin pensar." },

{ id:"paginas-del-silabario", label:"Cómo se ve una página de silabario y qué hace cada renglón", level:2, lon:156, tier:"point", ab:2,
  view:"La página típica tiene cuatro renglones y cada uno hace un trabajo distinto.\n\nEl primero presenta la sílaba nueva con las cinco vocales: ma me mi mo mu, en fila, grandes. El segundo las repite en desorden, para impedir que se memoricen como secuencia. El tercero arma palabras con lo ya visto, sin usar nunca una letra que no se haya enseñado antes —esa regla es lo que hace que el niño pueda leer la página él solo—. El cuarto ofrece una oración corta.\n\nSuele haber además una ilustración, y conviene saber que es un arma de doble filo. Ayuda al principio, dando sentido y motivación; después se convierte en la muleta que permite adivinar. La regla práctica: la ilustración se mira antes de leer o después de leer, nunca durante. Tápela con la mano mientras el niño descifra.\n\nSi el silabario que tiene a mano trae ejercicios de escritura, hágalos: escribir refuerza el reconocimiento. Si trae nombres de letras —«eme»—, sáltelos por ahora." },

{ id:"dos-tarjetas-mama", label:"Formar «mamá» juntando dos tarjetas iguales", level:2, lon:186, tier:"point", ab:1,
  view:"Dos tarjetas, las dos con «ma», separadas unos veinte centímetros sobre la mesa. El niño lee la primera: ma. Lee la segunda: ma. Entonces el adulto las va acercando despacio mientras el niño repite, y cuando se tocan el niño dice mamá.\n\nEl gesto de juntar las tarjetas y el gesto de juntar los sonidos son el mismo gesto, y el niño lo entiende sin que nadie se lo explique. Esa correspondencia entre lo que pasa en la mesa y lo que pasa en la boca es la razón de usar tarjetas móviles en lugar de una página impresa.\n\nDespués se hace al revés: se parte «mamá» en dos y se separan las tarjetas. Componer y descomponer, varias veces, hasta que sea juego.\n\nLo que suele pasar la primera vez que el niño oye salir «mamá» de su propia boca leyendo es que se sorprenda. Deje que se sorprenda. Es el momento en que descifrar se convierte en leer, y no vuelve a ocurrir." },

{ id:"ama-empieza-con-vocal", label:"«ama» empieza con vocal: la primera palabra que no lleva m adelante", level:2, lon:201, tier:"point", ab:1,
  view:"Toda palabra que el niño ha leído hasta aquí empieza con m. «Ama» no, y eso lo detiene la primera vez. La detención es útil: enseña que hay que leer lo que está escrito y no lo que se espera.\n\nSe arma con dos tarjetas: una con «a» sola y otra con «ma». Se leen por separado —a, ma— y se juntan: a-ma. El niño ve que la primera pieza es una sola letra y no una sílaba de dos, que es información nueva sobre cómo funciona el sistema.\n\nHay un juego útil aquí: comparar «ama» con «mama» puestos uno debajo del otro. Se parecen mucho y dicen cosas distintas; la diferencia está solo al principio. Un niño que puede distinguirlos está mirando la palabra entera y no solo su silueta.\n\nSi cuesta, no insista más de dos minutos. «Ama» puede esperar unos días; lo que no puede esperar es que el niño mantenga la confianza en que esto le sale." },

{ id:"mi-mama-dos-palabras", label:"«mi mamá»: dos palabras separadas por un espacio", level:2, lon:226, tier:"point", ab:1,
  view:"El espacio entre palabras es una convención que hay que enseñar, porque en el habla no existe: nadie hace una pausa entre «mi» y «mamá». Un niño que no ha entendido el espacio lee la línea entera como un chorro, o se detiene en lugares arbitrarios.\n\nLa manera de hacerlo visible es física. Escriba «mi mamá» con un espacio exagerado, del ancho de un dedo, y ponga literalmente el dedo del niño en el hueco. Ese es el espacio: ahí termina una palabra y empieza otra. Después señale cada palabra completa mientras el niño la lee, con una pausa marcada en medio.\n\nOtra versión, con tarjetas: una tarjeta con «mi», un espacio de un dedo, dos tarjetas de «ma». Tres piezas, dos palabras. Se cuentan las palabras señalando.\n\nY un ejercicio que suele gustar: pedirle al niño que aplauda una vez por cada palabra de la oración completa. Cuatro aplausos para «mi mamá me ama». Contar palabras es distinto de contar sílabas, y a esta edad conviene separar bien las dos cosas." },

{ id:"me-ama-que-hace", label:"«me ama»: la parte que dice lo que ella hace", level:2, lon:245, tier:"point", ab:2,
  view:"«Mi mamá» nombra a alguien. «Me ama» dice qué hace, y a quién. Sin esa segunda mitad no hay oración, solo un nombre.\n\nA los cuatro años esto no se explica con gramática sino con preguntas concretas. Se lee la oración completa, se tapa con la mano la segunda mitad y se pregunta: ¿y qué? El niño nota que falta algo. Se destapa y se lee: me ama. Ahora sí dice algo.\n\nEl juego que lo consolida es sustituir: «mi mamá me mima», «mi mamá me ama», y —cuando haya más consonantes— cualquier otro verbo. Cambiar la segunda mitad cambia lo que pasa; cambiar la primera cambia quién lo hace. Manipular las dos mitades por separado es la forma de descubrir que la oración tiene una estructura.\n\nEl «me» es la pieza más abstracta de toda la frase y no vale la pena analizarla. Basta con que el niño la lea bien y con que la oración entera signifique lo que él ya sabe que significa." },

{ id:"dibujo-en-el-refri", label:"El dibujo pegado en el refrigerador", level:2, lon:258, tier:"point", ab:3,
  view:"El dibujo del niño con la oración escrita debajo, pegado en un lugar donde toda la casa lo vea. Suena a decoración y es una intervención pedagógica con dos efectos.\n\nEl primero es de exposición: el texto queda a la vista y el niño lo lee de pasada, muchas veces al día, sin que nadie se lo pida. Esa repetición incidental y espaciada es exactamente la que fija asociaciones, y es gratis.\n\nEl segundo es de estatus. A los cuatro años, que algo que uno hizo esté colgado donde las visitas lo ven cambia la relación del niño con la actividad. Leer deja de ser una tarea que el adulto pide y pasa a ser algo que uno sabe hacer y que se muestra. Esa diferencia sostiene semanas de práctica.\n\nCámbielo cada vez que haya algo nuevo. El dibujo viejo se guarda; conviene guardarlos todos en una carpeta, porque ver en marzo lo que se leía en enero es la única forma que tiene un niño de percibir su propio avance." },

{ id:"cinco-tarjetas", label:"Las cinco tarjetas hermanas y el juego de señalar", level:2, lon:276, tier:"point", ab:2,
  view:"Las cinco tarjetas de la serie —ma, me, mi, mo, mu— sobre la mesa, boca arriba, en desorden. El adulto dice una sílaba y el niño señala. Dos minutos, no más.\n\nEste juego se llama de reconocimiento y es más fácil que leer, porque el niño elige entre cinco opciones visibles en lugar de producir la respuesta desde cero. Por eso va antes: es el escalón intermedio entre ver la tarjeta mientras el adulto la dice y tener que decirla solo.\n\nEl orden de dificultad completo, y conviene respetarlo: primero el adulto dice y muestra; después el adulto dice y el niño señala; después el adulto muestra y el niño dice; y al final el niño lee solo, sin apoyo.\n\nVariantes que mantienen vivo el juego: esconder una tarjeta y que adivine cuál falta; ponerlas boca abajo y jugar memoria con dos juegos iguales; que el niño sea quien dice y el adulto quien señala, equivocándose a propósito para que lo corrija. Corregir al adulto es, a esta edad, la actividad más motivadora que existe." },

{ id:"diez-minutos-dos-veces", label:"Diez minutos en la mañana y cinco en la tarde", level:2, lon:294, tier:"point", ab:3,
  view:"Dos sesiones cortas separadas por varias horas rinden más que una sola del doble de duración. El motivo es el efecto de espaciamiento: cada vez que una asociación se recupera después de haberse enfriado un poco, se refuerza más que si se repite en caliente.\n\nUn esquema realista para una familia con horarios: diez minutos por la mañana, antes de salir, cuando la atención está entera; cinco por la tarde, después de merendar, en formato de juego y no de lección —señalar tarjetas, leer lo que está pegado en el refrigerador, formar una palabra—. La segunda sesión no debe parecer una segunda sesión.\n\nSi solo hay tiempo para una, que sea la de la mañana y que sea todos los días. La regularidad importa más que la duración: cinco minutos diarios superan a veinte minutos tres veces por semana.\n\nY los días malos existen. Un día perdido no rompe nada; una semana perdida cuesta unos días de recuperar. No convierta la constancia en una fuente de culpa, porque el que abandona por culpa pierde mucho más que el que se saltó un martes." },

{ id:"dedo-en-la-nariz", label:"El dedo en la nariz para separar la m de la n", level:2, lon:316, tier:"point", ab:2,
  view:"Las dos son nasales, así que las dos vibran en la nariz y la prueba del dedo en la nariz no las distingue. Lo que sí las distingue son los labios: en la m están cerrados, en la n están abiertos y la lengua toca el paladar.\n\nEl procedimiento de contraste toma treinta segundos. El adulto dice mmmmm exagerando el cierre de labios, y el niño le toca los labios: cerrados. Después nnnnn, y el niño toca: abiertos, y si mete el dedo con cuidado se ve la lengua arriba. Después el niño lo hace consigo mismo, con un espejo.\n\nLa versión con palabras es «mamá» y «nana», dichas despacio, una tras otra, mirando la boca. La diferencia se ve en cuatro segundos y se recuerda mucho mejor que cualquier explicación.\n\nY la prevención sigue siendo mejor que el remedio: si todavía no ha enseñado la n, no la enseñe pronto. Meta la p, la s y la l en medio. La mayoría de las confusiones de esta etapa se evitan simplemente separando en el calendario las cosas que se parecen." },

{ id:"tapar-el-dibujo", label:"Tapar el dibujo y pedir que lea otra vez", level:2, lon:336, tier:"point", ab:3,
  view:"La mano sobre la ilustración, y la misma pregunta. Es la prueba más barata que existe y conviene hacerla a menudo, sin anunciarla y sin solemnidad.\n\nSi el niño lee igual de bien con el dibujo tapado, está descifrando. Si con el dibujo acierta y sin él se traba o inventa, estaba adivinando, y lo que parecía progreso no lo era. Descubrir eso a tiempo ahorra meses.\n\nLa versión más exigente de la misma prueba es escribir la palabra a mano en un papel en blanco, con otra letra, en otro color. Sin dibujo, sin contexto, sin la tarjeta conocida. Y la más exigente de todas es la sílaba inventada: «mu-me», «mi-mo». No significan nada, así que no se pueden adivinar; solo se pueden leer.\n\nSi la prueba sale mal, no pasa nada y no se le dice al niño que salió mal. Se vuelve unos pasos atrás: más deslizamiento, más tarjetas sin dibujo, menos ilustración durante el descifrado. El que ajusta el método es el adulto." }

);

WORLDS.silabario.push(

{ id:"dedo-en-su-nariz", label:"Poner el dedo del niño en su propia nariz mientras dice mmm", level:1, lon:9, tier:"point", ab:2, edge:["down"],
  view:"Treinta segundos. El niño se pone el dedo índice en el puente de la nariz, cierra los labios y zumba: mmmmmm. Siente la vibración.\n\nDespués, el adulto le tapa suavemente la nariz con dos dedos mientras el niño sigue zumbando. El sonido se corta de golpe, porque el aire no tiene por dónde salir. Casi todos los niños se ríen y quieren repetirlo.\n\nLo que queda de esos treinta segundos es una prueba física de que la m se hace de una manera concreta y verificable. Cuando dentro de tres semanas el niño dude entre m y n, tiene algo a lo que volver que no es la memoria de una forma en un papel.\n\nHágalo el primer día, y vuélvalo a hacer cada vez que aparezca una confusión." },

{ id:"boca-de-sorpresa", label:"La boca de sorpresa: ¡aaah!", level:1, lon:49, tier:"point", ab:2, edge:["down"],
  view:"Un minuto. El adulto pone cara de sorpresa exagerada —boca muy abierta, cejas arriba— y suelta una a larga. El niño imita. Se comparan quién la abrió más, se hace frente al espejo si hay uno cerca.\n\nEl objetivo es asociar la vocal con una sensación corporal grande antes de asociarla con un signo. Cuando aparezca la letra a en la tarjeta, ya hay una cara guardada a la que engancharla.\n\nSe puede hacer en cualquier momento muerto y no necesita nada. Es el ejercicio más fácil de todo este orbe y uno de los que más rinde, porque se repite sin costo diez veces al día." },

{ id:"foto-de-cinco-caras", label:"Cinco fotos de su propia cara, una por vocal", level:1, lon:69, tier:"point", ab:2, edge:["down"],
  view:"Con el teléfono: cinco fotos del niño diciendo a, e, i, o, u. Se ven juntas en la pantalla y se comparan.\n\nEl niño se reconoce, se ríe, y de paso ve las cinco formas de boca puestas una junto a otra, que es exactamente la comparación que hay que hacer. Después el juego es al revés: se le muestra una foto sin decirle cuál es y él adivina qué vocal estaba diciendo.\n\nSi quiere darle un uso más largo, imprima las cinco o guárdelas en un álbum aparte y escriba la letra debajo de cada una. Queda un material de referencia hecho por él, con su cara, que es infinitamente más interesante para un niño de cuatro años que cualquier lámina comprada." },

{ id:"maaa-diez-veces", label:"Decir maaa diez veces contando con los dedos", level:1, lon:99, tier:"point", ab:0, edge:["down"],
  view:"Con la tarjeta de «ma» a la vista, el niño dice mmmaaa alargando, y levanta un dedo cada vez. Diez veces, hasta la segunda mano. Se puede hacer rápido, lento, en voz baja, gritando, cantando: la variación mantiene el interés y no cambia lo que se está entrenando.\n\nEl punto es la repetición con la marca a la vista. Cada una de esas diez repeticiones es una asociación más entre lo que el ojo ve y lo que la boca hace, y las asociaciones se construyen por cantidad. Diez repeticiones diarias durante una semana son setenta; eso es lo que hace que una sílaba pase de costar a salir sola.\n\nContar con los dedos añade algo: el niño ve cuánto lleva y cuánto falta, lo que convierte un ejercicio en una tarea con final visible. Eso importa mucho a esta edad." },

{ id:"mula-mono-muela", label:"Mula, mono, muela: palabras que ya se pueden leer", level:1, lon:139, tier:"point", ab:1, edge:["down"],
  view:"Cuando la m está dominada y aparece la segunda consonante, la lista de palabras leíbles se abre de golpe. Con m y n: mano, mono, mina, luna si ya hay l. Con m y l: mula, mal, mole, malo. Con m y s: mesa, misa, mismo.\n\nLa regla que gobierna esta lista es estricta y vale la pena respetarla: solo palabras formadas exclusivamente con letras ya enseñadas. Una palabra con una letra desconocida obliga al niño a adivinar, y adivinar es el hábito que se está tratando de evitar. Los silabarios respetan esta regla página por página y por eso funcionan.\n\nUna advertencia práctica: elija palabras cuyo significado el niño conozca. «Mula» es descifrable y para un niño urbano de la Ciudad de México puede no significar nada. Prefiera mesa, mano, mamá, mío, luna. La recompensa de descifrar es el sentido; sin sentido, es un ejercicio vacío." },

{ id:"tilde-de-mama", label:"La tilde de mamá: una palmada en la sílaba fuerte", level:1, lon:189, tier:"point", ab:1, edge:["down"],
  view:"«Mama» y «mamá» se escriben casi igual y no se dicen igual: el golpe de voz cae en un lugar distinto. Ese golpe es lo único que la tilde marca.\n\nLa forma de enseñarlo a los cuatro años es con el cuerpo, no con la regla. Se dice ma-MÁ dando una palmada fuerte en la segunda sílaba y una suave en la primera. Después MA-ma, al revés, y se compara. El niño oye la diferencia inmediatamente porque es rítmica, y el ritmo es algo que ya domina.\n\nDespués se muestra el papel: esta rayita indica dónde va la palmada fuerte. Nada más. No se explica qué es una palabra aguda ni cuándo llevan tilde; eso llega años después y en la escuela.\n\nSi el niño escribe «mama» sin tilde, no lo corrija todavía. A esta edad lo que importa es que lea, y la ortografía de la tilde es un asunto de escritura que puede esperar." },

{ id:"mi-mano-mi-mesa", label:"«Mi» pegado a las cosas del niño: mi mano, mi mamá, mi mesa", level:1, lon:229, tier:"point", ab:1, edge:["down"],
  view:"Dos minutos recorriendo la casa. El niño señala cosas suyas y dice: mi mano, mi mamá, mi cama, mi mesa, mi mochila. El adulto escribe «mi» en una tarjeta y la va poniendo junto a cada cosa.\n\nLo que enseña este juego es que «mi» es una palabra completa aunque tenga una sola sílaba, y que dice de quién es algo. El niño ya usa la palabra cien veces al día; lo nuevo es verla escrita y notar que siempre se escribe igual.\n\nLa versión con papelitos funciona muy bien: escriba «mi» en cinco papelitos y péguelos con cinta en cinco cosas del niño. Durante unos días, cada vez que las use, la palabra está ahí.\n\nY es una de las poquísimas palabras que a esta altura el niño puede leer entera, en cualquier lado, sin ayuda. Aprovéchelo: señálela cuando aparezca en un letrero o en un libro." },

{ id:"pegar-en-la-puerta", label:"Pegar el dibujo y la oración en la puerta de su cuarto", level:1, lon:261, tier:"point", ab:3, edge:["down"],
  view:"El dibujo que hizo el niño, con la oración escrita debajo en letra grande y clara, pegado con cinta en la puerta de su cuarto o en el refrigerador.\n\nDos efectos, los dos reales. Lo lee de pasada muchas veces al día sin que nadie se lo pida, y esa repetición incidental es la más barata que existe. Y lo ve colgado donde la familia y las visitas lo ven, lo cual cambia lo que la actividad significa para él: leer pasa de ser algo que el adulto pide a ser algo que uno sabe hacer.\n\nCámbielo cuando haya algo nuevo, y guarde los anteriores en una carpeta. En dos meses, mostrarle lo que leía en la primera hoja es la única manera de que un niño de cuatro años perciba que avanzó." },

{ id:"senala-la-que-oyes", label:"«Señala la que oyes»: el juego de dos minutos", level:1, lon:279, tier:"point", ab:2, edge:["down"],
  view:"Las cinco tarjetas boca arriba y en desorden. El adulto dice una sílaba; el niño señala. Se repite quince o veinte veces en dos minutos, rápido, con ritmo de juego y no de examen.\n\nEs el escalón intermedio entre reconocer y producir: el niño elige entre opciones visibles, lo cual es más fácil que decir la sílaba desde cero, y por eso viene antes. Cuando acierte casi siempre y sin dudar, invierta el juego —el adulto señala y el niño dice— y estará en el escalón siguiente.\n\nDos variantes que lo mantienen vivo: quitar una tarjeta a escondidas y preguntar cuál falta; y dejar que el niño sea el que dicta mientras el adulto señala, equivocándose de vez en cuando a propósito. Corregir al adulto es la actividad más motivadora que hay a esta edad, y de paso obliga al niño a verificar." },

{ id:"una-palabra-al-dia", label:"Una palabra nueva al día, y ninguna más", level:1, lon:297, tier:"point", ab:3, edge:["down"],
  view:"El límite es el consejo, y cuesta seguirlo porque el avance visible tienta a acelerar. Una cosa nueva por sesión: una sílaba, o una palabra, no cinco.\n\nLa razón es que lo nuevo compite con lo viejo por el tiempo de repaso, y lo viejo todavía no está firme. Un niño al que se le enseñan las cinco sílabas de la serie en tres días las reconoce las cinco de manera insegura, y esa inseguridad se arrastra durante meses; uno al que se le enseña una cada tres días llega más tarde a «mu» y llega firme.\n\nLa señal para avanzar no es que el niño reconozca la sílaba: es que la diga sin pausa, en desorden, escrita a mano, en papel nuevo, en dos días distintos. Hasta que eso ocurra, no entra nada nuevo.\n\nIr despacio al principio es lo que permite ir rápido después. Casi todos los estancamientos de esta etapa vienen de haber avanzado antes de tiempo." },

{ id:"mama-nana", label:"El par «mamá / nana» dicho despacio, uno tras otro", level:1, lon:319, tier:"point", ab:2, edge:["down"],
  view:"Cuatro segundos y resuelve la confusión más común de la etapa. El adulto dice mamá, despacio, exagerando el cierre de labios. Después nana, despacio, con los labios abiertos y la lengua visible arriba. Otra vez las dos, seguidas.\n\nEl niño mira la boca. En una los labios se juntan y en la otra no; eso es todo lo que hay que notar, y se nota mirando, sin explicación.\n\nDespués lo hace él frente al espejo, tocándose los labios con el dedo: cerrados en mamá, abiertos en nana. Y al final, la versión con papel: las dos palabras escritas una debajo de otra, y el niño señala cuál es cuál.\n\nSi todavía no ha enseñado la n, no hace falta escribirla: basta con el contraste hablado. La prevención real sigue siendo separar las dos letras varias semanas en el calendario." },

{ id:"leer-a-mama", label:"Que el niño le lea la oración a su mamá, sin dibujo y sin ayuda", level:1, lon:339, tier:"point", ab:1, edge:["down"],
  view:"El día en que la oración completa sale de corrido, organice la lectura para alguien. La mamá, el papá, la abuela, un hermano, quien sea, pero alguien que no haya estado en las sesiones.\n\nLa condición es que sea sin apoyos: papel liso, sin dibujo, sin la tarjeta conocida, sin que nadie sople la primera sílaba. Si en esas condiciones el niño lee «mi mamá me ama», leyó de verdad.\n\nLo que hace este momento importante no es la prueba, que ya se hizo de otras maneras, sino el público. A los cuatro años la lectura es una habilidad privada hasta que alguien la ve, y cuando alguien la ve se convierte en identidad: el niño sale de ahí siendo alguien que sabe leer.\n\nCelébrelo de forma desproporcionada respecto del tamaño del logro. Cuatro palabras no son mucho para un adulto; para él son la primera vez que un papel le dijo algo." }

);
/* ============ MUNDO ANTERIOR: antes de la letra ============ */
WORLDS.oral = [

{ id:"conciencia-fonologica", label:"La conciencia fonológica: darse cuenta de que las palabras están hechas de trozos", level:3, lon:30, tier:"city", ab:3, edge:["up"],
  view:"Antes de que un niño pueda aprender qué sonido representa una letra, tiene que darse cuenta de que las palabras tienen sonidos separables. Eso no es obvio: para un niño pequeño «mariposa» es una cosa que vuela, no una cadena de cuatro trozos.\n\nLa conciencia fonológica se desarrolla en un orden bastante estable. Primero la rima —notar que sol y col terminan igual—. Después la sílaba: palmear ma-ri-po-sa en cuatro golpes. Después el sonido inicial: darse cuenta de que mesa y mano empiezan igual. Y al final el fonema aislado, que es la parte más difícil y la que en general se termina de desarrollar junto con la lectura, no antes.\n\nUn niño con buena conciencia silábica aprende a leer con el método silábico casi sin fricción. Uno que no puede palmear sílabas después de varias semanas de práctica necesita quedarse aquí más tiempo, y ese tiempo no es tiempo perdido: es la base." },

{ id:"hablar-en-casa", label:"El habla de la casa como el vocabulario del que la lectura se alimenta", level:3, lon:150, tier:"city", ab:3, edge:["up"],
  view:"Descifrar una palabra que uno no conoce no devuelve nada. Por eso el vocabulario oral previo es el techo de la comprensión lectora durante los primeros años: el niño solo entiende lo que lee si ya lo entendía al oírlo.\n\nEso convierte la conversación diaria en trabajo de alfabetización, aunque no lo parezca. Nombrar cosas, explicar por qué, contar lo que pasó ayer, cantar, leerle cuentos en voz alta —sobre todo leerle cuentos en voz alta— alimenta el depósito del que la lectura va a sacar.\n\nLos primeros materiales de lectura aprovechan esto usando exclusivamente palabras que todo niño hispanohablante ya tiene: mamá, mano, mesa, mío. Cuando el niño descifra «mamá» y el significado aparece solo, el esfuerzo se paga en el acto. Con una palabra desconocida, no se paga, y el niño aprende que descifrar no sirve de nada." },

{ id:"escuchar-y-distinguir", label:"Escuchar y distinguir: el oído que hay que afinar antes del papel", level:3, lon:270, tier:"city", ab:3, edge:["up"],
  view:"La discriminación auditiva es la capacidad de oír que dos sonidos parecidos son distintos. Sin ella, m y n son lo mismo, y ninguna cantidad de tarjetas lo arregla.\n\nSe entrena con juegos que no parecen ejercicios. Adivinar qué sonó en la casa con los ojos cerrados. Decidir si dos palabras son iguales o distintas —mesa/mesa, mesa/pesa—. Notar quién habló. Distinguir un ruido fuerte de uno suave, uno largo de uno corto.\n\nEl paso siguiente y más específico es distinguir sonidos del habla parecidos entre sí: pares como mamá y nana, o mesa y pesa, dichos despacio y mirando la boca. Ese es el ejercicio que previene la confusión más común de la etapa siguiente, y hacerlo antes de mostrar una sola letra ahorra semanas después." },

{ id:"rimas-y-canciones", label:"Rimas, canciones y juegos de palabras como el primer trabajo fonológico", level:2, lon:20, tier:"town", ab:3,
  view:"La rima es la primera unidad sonora que un niño percibe conscientemente, y llega jugando. Las rondas, las canciones infantiles, los versos de la lotería, los trabalenguas fáciles: todo eso es entrenamiento fonológico sin que nadie lo llame así.\n\nLo que hace la rima es obligar al niño a atender al sonido de la palabra en lugar de a su significado, que es un cambio de foco genuinamente difícil y que la lectura va a exigir todo el tiempo.\n\nJuegos concretos: completar el verso que falta de una canción conocida; decir palabras que rimen con «pan»; decidir si dos palabras riman o no. Cinco minutos, en el coche o antes de dormir. Un niño que rima con soltura a los cuatro años tiene una ventaja medible al aprender a leer." },

{ id:"palmear-silabas", label:"Palmear las sílabas de una palabra como el ejercicio central de esta etapa", level:2, lon:40, tier:"town", ab:2,
  view:"Se dice una palabra y se da una palmada por cada golpe de voz: ma-má, dos. Ma-ri-po-sa, cuatro. Sol, una.\n\nEs el ejercicio más directo y más útil de toda la preparación, porque la sílaba es exactamente la unidad sobre la que va a trabajar el método silábico. Un niño que palmea bien está listo; uno que no, todavía no.\n\nEmpiece con palabras largas, que son más fáciles de segmentar que las cortas, y con el nombre del niño, que siempre es la palabra más interesante del mundo. Después los nombres de la familia. Después objetos de la casa.\n\nVariantes: dar un paso por sílaba, golpear la mesa, saltar. Y la versión difícil, para cuando lo anterior ya sale: decir cuántas sílabas tiene sin palmear, solo contando en la cabeza." },

{ id:"nombres-de-la-familia", label:"Los nombres de la familia como el primer material fonológico", level:2, lon:140, tier:"town", ab:3,
  view:"El nombre propio es la palabra más cargada de significado que existe para un niño, y por eso es el mejor material para trabajar.\n\nSe palmean los nombres de todos los de la casa: ma-má, pa-pá, a-bue-la, y el del niño. Se compara quién tiene el nombre más largo. Se busca quién empieza igual que quién. Se nota que mamá y Manuel empiezan con el mismo sonido.\n\nEste juego hace algo que ningún material impreso hace: convierte el análisis de sonidos en una conversación sobre la propia familia. El niño se involucra porque el contenido le importa, no porque le pidieron un ejercicio.\n\nMás adelante, cuando aparezca el papel, el nombre propio es también la primera palabra que casi todos los niños reconocen escrita, aunque todavía no sepan descifrarla." },

{ id:"mama-primera-palabra", label:"«Mamá» como la primera palabra de casi todos los niños del mundo", level:2, lon:160, tier:"town", ab:1,
  view:"En idiomas sin ningún parentesco entre sí, la palabra para madre se parece: mamá, mama, mãe, mama, māma. La explicación más aceptada es que la sílaba ma es la más fácil de producir para un aparato fonador humano en desarrollo, así que aparece primero en el balbuceo de cualquier bebé, y los adultos interpretan ese balbuceo como el nombre de quien está más cerca.\n\nEso significa que ma no es una elección pedagógica arbitraria: es el sonido que el niño lleva produciendo desde antes de hablar. Cuando el silabario lo pone en la primera página, no está enseñando algo nuevo; está poniendo por escrito algo que el niño hace desde los seis meses.\n\nDecirle esto al niño —que mamá fue probablemente su primera palabra— convierte la primera lección en una historia sobre él mismo." },

{ id:"primer-sonido", label:"Con qué empieza: el sonido inicial como el escalón hacia el fonema", level:2, lon:260, tier:"town", ab:2,
  view:"Después de la sílaba viene el sonido suelto, y el más fácil de aislar es el primero de la palabra. «¿Con qué empieza mamá?» — con mmm.\n\nEste es el escalón donde muchos niños se detienen un tiempo, y es normal: aislar un fonema es una abstracción real, porque en el habla ese sonido nunca aparece solo. La /m/ es de las más accesibles justamente porque se puede sostener; con la /p/ el mismo ejercicio es mucho más difícil.\n\nJuegos que lo entrenan: buscar cosas de la casa que empiecen con mmm; decidir si dos palabras empiezan igual; el veo-veo con sonido en lugar de con letra —«veo una cosita que empieza con mmm»—.\n\nUse el sonido, nunca el nombre de la letra. «Empieza con mmm», no «empieza con eme»." },

{ id:"juegos-de-boca", label:"Juegos de boca: soplar, vibrar, sacar la lengua", level:2, lon:280, tier:"town", ab:3,
  view:"Antes y durante el trabajo fonológico conviene jugar con el aparato que produce los sonidos. Soplar velas, soplar burbujas, soplar un papelito por la mesa. Sacar la lengua, tocarse la nariz con ella, moverla de lado a lado. Inflar los cachetes. Vibrar los labios como un motor.\n\nDos beneficios. El niño gana control voluntario de una musculatura que hasta ahora usaba de forma automática, lo cual le permite después hacer a propósito lo que se le pide —cerrar los labios, abrir grande—. Y desarrolla la idea de que los sonidos se fabrican con partes del cuerpo, que es el fundamento de todo lo demás.\n\nDos minutos al día, en formato de tontería. No hace falta que parezca serio; funciona mejor si no lo parece." },

{ id:"palmadas-ma-ma", label:"Dos palmadas para mamá", level:1, lon:24, tier:"point", ab:2, edge:["down"],
  view:"El ejercicio más pequeño de todos: decir mamá y dar dos palmadas, una por sílaba. Después el nombre del niño. Después el de todos los de la casa, y el del perro si lo hay.\n\nSe hace en cualquier momento, sin material, en menos de un minuto: en el coche, en la fila del súper, subiendo las escaleras. La versión que más gusta es hacerlo caminando, dando un paso por sílaba, porque el cuerpo entero marca la separación y no solo las manos.\n\nEmpiece por palabras largas, que son más fáciles de segmentar que las cortas —ma-ri-po-sa se parte sola, sol no se parte—. Y por el nombre del niño, que siempre es la palabra más interesante del mundo.\n\nSeñal de que está listo para seguir: palmea correctamente palabras que no ha practicado antes, incluso largas, sin dudar y sin que nadie se las marque primero." },

{ id:"decir-los-nombres", label:"Decir los nombres de todos y contar las palmadas", level:1, lon:144, tier:"point", ab:3, edge:["down"],
  view:"Se hace una ronda: cada quien dice su nombre y todos lo palmean juntos. Se cuenta cuántas palmadas salieron y se anota, si se quiere, en una hoja.\n\nQueda una lista de la familia con un número al lado, que el niño puede consultar y que le da algo concreto que mostrar. Y se puede volver a hacer semanas después para ver que ahora acierta más rápido.\n\nEs, además, la manera más fácil de involucrar a hermanos mayores, que en general disfrutan mucho el papel de examinadores." },

{ id:"con-que-empieza", label:"El veo-veo con sonidos en vez de letras", level:1, lon:264, tier:"point", ab:2, edge:["down"],
  view:"«Veo, veo una cosita que empieza con mmm.» El niño mira alrededor y busca: mesa, mano, mochila, muñeco.\n\nEl juego clásico usa nombres de letras, y aquí conviene cambiarlo: se dice el sonido, no el nombre. Esa diferencia importa, porque el nombre de la letra —eme— contiene una vocal que estorba justamente en el momento de unir sonidos.\n\nFunciona en el coche, en la fila, en la sala de espera. Dura lo que dure el interés y no necesita nada." },

{ id:"soplar-y-vibrar", label:"Soplar una vela y sentir la vibración con la mano", level:1, lon:284, tier:"point", ab:3, edge:["down"],
  view:"Dos gestos de treinta segundos cada uno. Soplar una vela, o una burbuja, o un papelito: control del aire. Y poner la mano en la garganta mientras se dice mmmmm y mientras se dice sssss: en una vibra, en la otra no.\n\nLa segunda es la que más rinde a mediano plazo, porque instala la idea de que los sonidos se distinguen por lo que hace el cuerpo, y no solo por cómo suenan. Es la misma prueba que servirá después para separar la m de la p, o la s de la z.\n\nA los niños de cuatro años esto les parece magia. Aprovéchelo." }
];

/* ============ MUNDO SIGUIENTE: de la sílaba a la palabra ============ */
WORLDS.palabras = [

{ id:"palabra-completa", label:"La palabra completa como una unidad que se reconoce de un golpe", level:3, lon:30, tier:"city", ab:2, edge:["up"],
  view:"Leer sílaba por sílaba es un paso, no la meta. El objetivo es que la palabra se reconozca entera, de un vistazo, sin recorrerla por partes, porque solo entonces queda atención libre para entender lo que dice.\n\nEse cambio ocurre por frecuencia: una palabra descifrada muchas veces deja de descifrarse y pasa a reconocerse directamente. No se enseña, se acumula. Lo que sí se puede hacer es facilitarlo: repetir las mismas palabras muchas veces en lugar de perseguir palabras nuevas, y dejarlas a la vista en la casa.\n\nEl error frecuente de esta etapa es aceptar como buena la lectura silabeada permanente: «ma-má» dicho siempre en dos golpes separados, meses después. Cuando eso pasa, hay que volver a la palabra y trabajarla como unidad —tarjeta con la palabra completa, no con las sílabas—." },

{ id:"familia-de-la-m", label:"La familia de palabras que la m desbloquea", level:3, lon:150, tier:"city", ab:1, edge:["up"],
  view:"Con la serie completa y ninguna otra consonante, el inventario de palabras leíbles es pequeño pero real: mamá, mimo, memo, mima, ama, amo, mío, mía, mí, mi, me. Casi todas de dos sílabas, casi todas conocidas por el niño.\n\nEn cuanto entra la segunda consonante, el inventario se multiplica. Con la p: mapa, papá, pomo, puma. Con la s: mesa, misa, mismo, sumo. Con la l: mula, mole, malo, lima, luna.\n\nLa regla que gobierna la selección es una sola: solo palabras formadas exclusivamente con letras ya enseñadas. Una sola letra desconocida obliga a adivinar. Los silabarios respetan esta regla página por página, y es la razón por la que un niño puede leer sus páginas solo.\n\nSegunda regla, menos formal: prefiera palabras cuyo significado el niño ya tenga." },

{ id:"leer-de-corrido", label:"Leer de corrido: cuando la palabra deja de armarse y empieza a reconocerse", level:3, lon:270, tier:"city", ab:2, edge:["up"],
  view:"Hay un momento perceptible en que el niño deja de armar la palabra y simplemente la dice. Suele llegar primero con las palabras más frecuentes —mamá, su propio nombre— y después se extiende.\n\nLo que hay detrás es automatización: la asociación entre la forma escrita y la palabra hablada se hizo tan rápida que ya no requiere atención consciente. Y eso libera recursos: el niño que no gasta atención en descifrar puede gastarla en entender.\n\nCómo favorecerlo: repetición de las mismas palabras, no persecución de palabras nuevas; lectura en voz alta de textos muy fáciles, muy por debajo del límite del niño; y nada de prisa. La velocidad llega sola con la frecuencia y no se puede apurar pidiéndola.\n\nCómo comprobarlo: cronometre suavemente, en secreto, la misma lista con dos semanas de diferencia." },

{ id:"mama-de-un-vistazo", label:"«Mamá» leída de un vistazo, sin volver a armarla", level:2, lon:20, tier:"town", ab:1,
  view:"La primera palabra que un niño reconoce entera casi siempre es mamá, y es un buen indicador de que la automatización empezó.\n\nSe favorece dejándola a la vista: escrita en la puerta, en el refrigerador, en la portada de su carpeta. Se lee de pasada docenas de veces sin que nadie lo pida, y esa exposición incidental es la que convierte el descifrado en reconocimiento.\n\nUna prueba fácil: muéstrele la palabra medio segundo y tápela. Si la dijo, la reconoció; si necesita mirarla un rato, todavía la está armando. No es una prueba que haya que pasar, solo una manera de saber dónde está." },

{ id:"partir-y-juntar", label:"Partir la palabra y volverla a juntar con las manos", level:2, lon:40, tier:"town", ab:1,
  view:"Con tarjetas de sílabas: se arma mamá con dos «ma», se separan, se vuelven a juntar. Después con tres sílabas, cuando haya material: pa-le-ta si ya hay p, l y t.\n\nLo que enseña es que la palabra tiene partes y que las partes se pueden mover. El niño que puede descomponer y recomponer entiende la estructura; el que solo reconoce la palabra entera memorizó una forma.\n\nEl mejor ejercicio del grupo es el de la sílaba escondida: se arma la palabra, el niño cierra los ojos, el adulto quita una sílaba, y el niño adivina cuál falta. Exige tener la palabra completa en la cabeza y compararla con lo que ve." },

{ id:"dos-silabas-justo", label:"Las palabras de dos sílabas como el tamaño justo para empezar", level:2, lon:140, tier:"town", ab:2,
  view:"Dos sílabas es el tamaño con el que conviene trabajar durante bastante tiempo. Una sílaba sola no obliga a unir nada; tres o más sobrecargan la memoria de trabajo de un niño de cuatro años, que tiene que sostener las primeras mientras descifra las últimas.\n\nCon dos sílabas el niño puede mantener la primera en la cabeza sin esfuerzo mientras resuelve la segunda, y esa es exactamente la operación que hay que automatizar.\n\nCuando dos sílabas salen sin dudar, pase a tres —pero de las fáciles, con sílabas abiertas todas: pa-le-ta, mo-ne-da—. Las de cuatro pueden esperar, y las que llevan sílabas trabadas mucho más." },

{ id:"palabras-con-sentido", label:"Elegir palabras que el niño ya conoce", level:2, lon:160, tier:"town", ab:2,
  view:"La recompensa de descifrar es el significado. Si la palabra no está en el vocabulario oral del niño, descifrarla no devuelve nada y el ejercicio se vuelve vacío.\n\nPor eso conviene revisar las listas de los silabarios antes de usarlas. Muchas incluyen palabras que en 1890 eran cotidianas y hoy no lo son para un niño de la Ciudad de México: mula, ame, uva puede pasar, pero no todas pasan. Sustitúyalas sin culpa por otras del mismo nivel de dificultad: mesa, mano, mío, mamá, moto.\n\nY si aparece una palabra desconocida que vale la pena, explíquela antes de que la lea, no después. Descifrar una palabra que uno acaba de aprender oralmente sí funciona; descifrar una que sigue sin significar nada, no." },

{ id:"del-deletreo-al-golpe", label:"Del deletreo silábico a la palabra dicha de un golpe", level:2, lon:260, tier:"town", ab:2,
  view:"El niño que dice «ma... má... ¡mamá!» está en el camino correcto. El que seis meses después sigue diciendo «ma... má» y nunca junta, se estancó, y ese estancamiento es el problema más común del método silábico mal aplicado.\n\nLa técnica para desatascarlo: que el niño lea las sílabas en voz baja o en la cabeza y diga solo la palabra completa en voz alta. Al principio le costará; ayuda que el adulto haga el gesto de juntar con las manos, y que la palabra se repita muchas veces seguidas hasta que salga de un golpe.\n\nOtra ayuda: escribir la palabra sin separar las sílabas ni marcarlas con guiones. Los guiones son una muleta útil los primeros días y un estorbo después." },

{ id:"reconocer-sin-sonar", label:"Reconocer la palabra sin volver a sonarla", level:2, lon:280, tier:"town", ab:2,
  view:"El destino de este tramo es que un conjunto creciente de palabras se reconozca directamente, sin pasar por el sonido. Ocurre por frecuencia y no se puede enseñar, pero se puede alimentar.\n\nCómo alimentarlo: las mismas pocas palabras, muchas veces, en muchos lugares distintos —tarjeta, refrigerador, letrero hecho a mano, hoja escrita por el niño—. Variar el soporte y repetir el contenido es la fórmula.\n\nLo que no funciona: aumentar la lista de palabras. Veinte palabras vistas dos veces cada una producen mucho menos que cinco palabras vistas veinte veces.\n\nY una advertencia: reconocer de vista no debe reemplazar al descifrado, solo acompañarlo. El niño tiene que seguir pudiendo leer palabras nuevas que nunca vio." },

{ id:"mama-en-todas-partes", label:"Escribir «mamá» en cinco lugares de la casa", level:1, lon:24, tier:"point", ab:1, edge:["down"],
  view:"Cinco papelitos con la palabra escrita a mano, grande y clara, pegados con cinta en cinco lugares: la puerta del cuarto, el refrigerador, el espejo del baño, la mesa, la mochila.\n\nDurante una semana el niño se topa con la palabra sin que nadie se la ponga enfrente. Esa exposición incidental y repetida es la que convierte el descifrado en reconocimiento inmediato, y no cuesta nada.\n\nDespués de una semana se cambian por otra palabra. Los papelitos viejos se guardan en la carpeta." },

{ id:"lista-de-diez", label:"La lista de diez palabras que ya puede leer", level:1, lon:144, tier:"point", ab:1, edge:["down"],
  view:"Una hoja con las diez palabras que el niño ya lee, escritas por el adulto en letra grande, colgada donde él la vea.\n\nSirve para tres cosas. Es material de repaso rápido: dos minutos leyéndola completa. Es un registro visible del avance, que es difícil de percibir de otra manera a esta edad. Y es un objeto que el niño puede mostrarle a quien llegue de visita.\n\nCada vez que una palabra nueva queda dominada, se agrega a la lista con ceremonia. La lista solo crece." },

{ id:"cronometro-suave", label:"Cronometrar la misma lista dos semanas después", level:1, lon:264, tier:"point", ab:2, edge:["down"],
  view:"Sin decirle al niño que se está midiendo nada: se lee la lista de diez palabras y el adulto anota mentalmente cuánto tardó. Dos semanas después, la misma lista, y se compara.\n\nLa velocidad es el mejor indicador de automatización que hay a esta edad, mejor que la exactitud, porque la exactitud llega pronto en español y después se estanca aparentemente mientras la fluidez sigue mejorando.\n\nNo convierta esto en carrera ni le pida al niño que lea rápido. Pedir velocidad produce lectura atropellada y adivinada. La velocidad llega sola cuando el reconocimiento se automatiza, y la medición es para el adulto." }
];

/* ============ MUNDO SIGUIENTE: de la palabra a la oración ============ */
WORLDS.oracion = [

{ id:"oracion-completa", label:"«Mi mamá me ama» leída de corrido por primera vez", level:3, lon:30, tier:"city", ab:1, edge:["up"],
  view:"Cuatro palabras, ocho sílabas, una sola consonante. Es el destino de todo este tramo y el momento en que el niño descubre para qué servía lo anterior.\n\nSe llega por partes. Primero cada palabra por separado, en tarjetas: mi / mamá / me / ama. Después de dos en dos: «mi mamá», «me ama». Después la oración completa, señalando con el dedo de izquierda a derecha, con pausas. Y finalmente de corrido, sin pausas, con la entonación de una frase de verdad.\n\nEse último paso —de leer palabras seguidas a decir una oración— no es automático y merece trabajarse: el adulto la lee entonada, el niño imita, se hace varias veces.\n\nCuando salga de corrido, pare la sesión ahí. Es un buen lugar para terminar." },

{ id:"quien-hace-que", label:"Quién hace qué: la oración dice algo del mundo", level:3, lon:150, tier:"city", ab:2, edge:["up"],
  view:"Una oración no es una fila de palabras: afirma algo. Que el niño lo note es el comienzo de la comprensión lectora y se puede provocar con tres preguntas: ¿de quién habla? ¿qué hace? ¿a quién?\n\nCon eso el niño desarma la oración en sus partes sin oír una sola palabra técnica. No hace falta nombrar sujeto ni verbo; a esta edad los nombres estorban y la operación es lo que importa.\n\nEl ejercicio que consolida es manipular: cambiar «mamá» por otro nombre y ver que cambia quién; cambiar «ama» por otro verbo y ver que cambia qué pasa; quitar una palabra y notar que la frase queda coja. Manipular es la manera de descubrir que hay estructura.\n\nUna pregunta por lectura, en tono de conversación. Tres seguidas apagan a cualquier niño." },

{ id:"leer-con-voz", label:"Leer con voz: entonación, pausas y punto final", level:3, lon:270, tier:"city", ab:3, edge:["up"],
  view:"La entonación no es adorno: es una señal de que el niño entendió. Quien lee sin entender lee plano, con el mismo tono en cada palabra. Quien entendió sube y baja la voz, hace la pausa donde va y baja al final.\n\nSe enseña por imitación, no por explicación. El adulto lee la oración con entonación clara, el niño la repite, se turnan. Al cabo de unos días el niño empieza a producirla solo.\n\nEl punto final se enseña como una bajada de voz: aquí termina y la voz baja. La coma, más adelante, como una pausa corta. Nada de nombres gramaticales.\n\nUna prueba útil: pedirle que lea la oración enojado, contento, en secreto. Solo se puede cambiar el tono de algo que se entiende." },

{ id:"de-corrido-primera-vez", label:"La primera lectura sin pausas entre palabras", level:2, lon:20, tier:"town", ab:1,
  view:"El paso de «mi... mamá... me... ama» a «mi mamá me ama» es propio y hay que trabajarlo aparte de la lectura de cada palabra.\n\nLa técnica: el adulto lee la oración completa a velocidad normal, señalando con el dedo, y el niño la repite mirando el papel. Se hace cuatro o cinco veces. Después el niño lo intenta solo, y el adulto acompaña con el dedo para marcar el ritmo.\n\nSi se traba, no se corrige palabra por palabra: se vuelve a leer entera y se repite. La fluidez se aprende imitando fluidez, no acumulando correcciones." },

{ id:"espacios-entre-palabras", label:"Los espacios: dónde termina una palabra y empieza otra", level:2, lon:40, tier:"town", ab:2,
  view:"En el habla no hay espacios: nadie hace una pausa entre «mi» y «mamá». El espacio es una convención de la escritura y hay que enseñarla.\n\nSe hace visible físicamente: escriba la oración con espacios exagerados, del ancho de un dedo, y ponga el dedo del niño en cada hueco. Ahí termina una palabra.\n\nDespués, contar palabras: un aplauso por palabra, cuatro para «mi mamá me ama». Y conviene distinguirlo bien de contar sílabas, que son ocho. Confundir las dos cuentas es normal al principio y se aclara haciendo las dos seguidas y comparando." },

{ id:"cambiar-una-palabra", label:"Cambiar una palabra y ver qué cambia", level:2, lon:140, tier:"town", ab:2,
  view:"«Mi papá me ama.» «Mi mamá me mima.» «Mi mamá te ama.» Cada cambio mueve una pieza distinta del sentido, y el niño lo nota sin que nadie se lo explique.\n\nEste ejercicio es además la mejor prueba de que el niño está leyendo y no recordando. Un niño que memorizó la frase leerá «mi mamá me ama» aunque el papel diga otra cosa; uno que lee se detiene en la palabra cambiada.\n\nHágalo con tarjetas móviles para poder sustituir una sola pieza dejando el resto igual. Y déjelo a él cambiar palabras y leerle a usted el resultado, que suele terminar en disparates y en risa, los dos bienvenidos." },

{ id:"preguntas-de-tres", label:"Tres preguntas después de cada lectura", level:2, lon:160, tier:"town", ab:3,
  view:"¿De quién habla? ¿Qué hace? ¿A quién? Quince segundos, en tono de conversación, no de examen.\n\nAl principio el niño contestará repitiendo la frase, y eso ya cuenta. Con el tiempo aparecerá la paráfrasis —«que me quiere»— y ese es el momento en que la comprensión lectora empieza de verdad: el niño dice con sus palabras lo que el papel dice con las suyas.\n\nEvite las preguntas de opinión —¿te gustó?— en este tramo. No son malas, son de otro tipo; aquí lo que se entrena es la relación entre el texto y el mundo, y para eso las preguntas tienen que tener respuesta en el papel." },

{ id:"punto-final", label:"El punto final y la bajada de la voz", level:2, lon:260, tier:"town", ab:3,
  view:"El punto se enseña como sonido, no como regla: aquí termina la idea y la voz baja. El adulto lo demuestra exagerando, el niño imita.\n\nUn juego que funciona: leer la oración sin bajar la voz al final, dejándola en el aire, y preguntarle al niño si ya terminó. Se nota inmediatamente que falta algo. Después con el punto, y se compara.\n\nLos demás signos pueden esperar. Los de interrogación son los siguientes en utilidad —y en español tienen la ventaja de que el de apertura avisa desde el principio cómo hay que entonar—, pero no hacen falta todavía." },

{ id:"leerla-a-alguien", label:"Leerle la oración a alguien que la escuche", level:2, lon:280, tier:"town", ab:1,
  view:"Una lectura tiene destinatario o es un ejercicio. Cuando la oración ya sale, organice una lectura para alguien que no estuvo en las sesiones: la abuela por teléfono, el papá al llegar, un hermano.\n\nLas condiciones importan: sin dibujo, sin la tarjeta conocida, sin que nadie sople la primera sílaba. Si en esas condiciones sale, salió de verdad.\n\nLo que cambia no es la habilidad sino lo que el niño cree de sí mismo. Leer en privado es una tarea; leer para alguien es ser alguien que sabe leer. Ese cambio sostiene semanas de práctica posterior." },

{ id:"escribirla-el-mismo", label:"Que la escriba él, aunque salga chueca", level:1, lon:24, tier:"point", ab:2, edge:["down"],
  view:"Copiar la oración con crayón grueso en una hoja grande. Las letras saldrán disparejas, del tamaño equivocado y a veces fuera del renglón; nada de eso importa ahora.\n\nEscribir refuerza el reconocimiento de manera medible: la mano obliga a mirar cada letra en orden, cosa que el ojo puede saltarse. Y produce un objeto que el niño hizo, que se puede colgar y mostrar.\n\nNo corrija la forma. Corrija solo si se saltó una letra o cambió el orden, y con suavidad, señalando el modelo." },

{ id:"dibujar-la-escena", label:"Dibujar lo que la oración dice", level:1, lon:144, tier:"point", ab:3, edge:["down"],
  view:"Se lee la oración, se guarda el papel, se le da una hoja: dibuja lo que dice.\n\nUn dibujo no se puede hacer sin haber entendido, así que es la prueba de comprensión más limpia que existe a los cuatro años, mucho mejor que preguntar si entendió.\n\nDos personas, una grande y una chica, juntas: entendió. Un dinosaurio: no entendió o no estaba escuchando, y en ninguno de los dos casos se regaña; se vuelve a leer y se intenta otro día.\n\nEl dibujo con la oración escrita debajo se pega donde la casa lo vea." },

{ id:"grabar-su-voz", label:"Grabar su voz leyendo y ponérsela después", level:1, lon:264, tier:"point", ab:3, edge:["down"],
  view:"Con el teléfono: se graba al niño leyendo la oración, y después se escucha juntos.\n\nA los niños de esta edad oírse les fascina, y el efecto práctico es que quieren repetir la grabación varias veces para que salga mejor —lo cual son cinco lecturas más sin que nadie las haya pedido—.\n\nGuarde las grabaciones. Poner en marzo la de enero es la forma más contundente que hay de mostrarle a un niño que avanzó, y a los adultos de la casa también." }
];

/* ============ MUNDO FINAL: el niño que ya lee solo ============ */
WORLDS.lector = [

{ id:"lee-solo", label:"El niño que ya lee solo, y cómo se reconoce", level:3, lon:30, tier:"city", ab:2, edge:["up"],
  view:"Leer solo no es leer todo: es poder descifrar una palabra nueva, formada con letras conocidas, sin ayuda y sin adivinar.\n\nLas señales de que llegó: lee palabras que nunca vio; lee en papel nuevo, con otra letra, sin dibujo; lee sílabas inventadas, que no se pueden recordar porque no significan nada; y no se detiene a esperar que alguien confirme.\n\nLo que no es señal: recitar la serie en orden, reconocer la tarjeta de siempre, o leer un cuento que se sabe de memoria. Las tres cosas se ven igual desde afuera y no son lo mismo.\n\nCuando llegue, el trabajo cambia de naturaleza: deja de tratarse de enseñar el código y pasa a tratarse de dar volumen —muchas palabras, muchos textos fáciles, todos los días—." },

{ id:"nuevas-consonantes", label:"Las consonantes que siguen, y en qué orden", level:3, lon:150, tier:"city", ab:2, edge:["up"],
  view:"Después de la m, el orden razonable para el primer año: p, s, l, t, d, n, y después las demás. Los criterios son los mismos de siempre —continuas antes que oclusivas, correspondencia única antes que dependiente del contexto, y nunca dos parecidas seguidas—.\n\nSe posponen deliberadamente: la n, por su parecido con la m; la c y la g, porque suenan distinto según la vocal que sigue; la r, porque tiene dos sonidos según la posición; la h, porque es muda; la q, la y y la x, por raras o irregulares. Todas esas llegan en el segundo año o en la escuela.\n\nLa regla que gobierna el ritmo no cambia: ninguna consonante nueva antes de que la anterior salga sin pensar, en desorden y en papel nuevo." },

{ id:"el-gusto-de-leer", label:"El gusto de leer, que no lo enseña ningún silabario", level:3, lon:270, tier:"city", ab:3, edge:["up"],
  view:"El silabario enseña el código y no enseña a querer leer. Ninguna de sus páginas es un cuento, y eso es una limitación del género, no un defecto de este método en particular.\n\nEsa otra mitad se construye en paralelo y desde mucho antes: leerle al niño en voz alta todos los días, textos muy por encima de lo que él puede descifrar; dejarlo elegir; releer el mismo cuento cuarenta veces si lo pide; tener libros a su alcance; y que vea leer a los adultos de la casa.\n\nUn niño que descifra bien y no quiere leer nada es un resultado posible de una enseñanza técnicamente correcta. Es el peor de los resultados posibles, y se previene únicamente con lo anterior.\n\nQuince minutos de cuento al día, sin evaluación, sin preguntas, sin objetivo. Eso es todo." },

{ id:"senales-de-que-ya-lee", label:"Las señales de que el niño lee y no recuerda", level:2, lon:20, tier:"town", ab:2,
  view:"Cuatro pruebas, todas rápidas y todas hechas sin ceremonia.\n\nBarajar: si acierta en orden y falla en desorden, memorizó la secuencia. Cambiar el soporte: escrito a mano, otra letra, otro color, papel en blanco. Tapar el dibujo, que es la muleta más común. Y la más exigente, la sílaba o palabra inventada —«mume», «milo»—, que no se puede recordar y solo se puede descifrar.\n\nHaga una por semana. No es para calificar al niño: es para saber si lo que usted está haciendo funciona, y si falla, el que ajusta el método es el adulto." },

{ id:"cuando-soltar-el-silabario", label:"Cuándo dejar el silabario", level:2, lon:40, tier:"town", ab:2,
  view:"Cuando el niño puede descifrar palabras nuevas con las letras que conoce, el silabario deja de ser el material principal y pasa a ser una referencia.\n\nA partir de ahí lo que hace falta es volumen: textos fáciles, cortos, con las letras ya vistas, y muchos. Libros de primeras lecturas, frases escritas por el adulto sobre cosas de la casa, notitas, letreros. La transición conviene hacerla gradual, no de golpe: unos días con las dos cosas.\n\nLa señal de que se soltó demasiado pronto es que el niño empiece a adivinar otra vez. Si eso pasa, vuelva a material controlado unas semanas, sin dramatismo." },

{ id:"la-p-la-s-la-l", label:"Las que siguen: p, s, l, t, d", level:2, lon:140, tier:"town", ab:1,
  view:"La p es oclusiva pero muy visible y muy frecuente en palabras del niño: papá, mapa, pito. La s es continua, se puede alargar, y aparece en todos los plurales. La l es continua y visible en parte. La t y la d son oclusivas y se parecen entre sí, así que conviene separarlas.\n\nCada consonante nueva se enseña exactamente igual que la m: sonido primero, deslizamiento hacia las cinco vocales, tarjetas, palabras solo con lo ya visto, y una frase corta.\n\nY el inventario de palabras crece rápido, porque cada consonante nueva se combina con todas las anteriores. Con m, p, s y l ya se leen varias decenas de palabras reales." },

{ id:"silabas-trabadas", label:"Las sílabas trabadas: bra, pla, tren, y por qué vienen mucho después", level:2, lon:160, tier:"town", ab:2,
  view:"Una sílaba trabada tiene dos consonantes juntas antes de la vocal: bra, pla, cri, tren. Son genuinamente difíciles porque entre las dos consonantes no hay vocal que las separe, y percibir esa frontera es duro incluso para un adulto que nunca lo pensó.\n\nLlegan bien entrado el segundo año, después de que todas las consonantes simples estén dominadas, y se enseñan por familias: bl, br; pl, pr; cl, cr; y así.\n\nForzarlas antes de tiempo es una de las causas más frecuentes de estancamiento y de rechazo. Si un niño se traba sistemáticamente en ellas, casi siempre la respuesta correcta es volver atrás y consolidar las abiertas, no insistir." },

{ id:"primeros-libros", label:"Los primeros libros que puede leer solo", level:2, lon:260, tier:"town", ab:3, edge:["down"],
  view:"Un primer libro para leer solo tiene pocas palabras por página, letra grande, frases cortas, mucha repetición y palabras que el niño conoce oralmente. Los libros de imágenes bonitos y complejos son para que se los lean, no para que los lea.\n\nLo más eficaz al principio suele ser hecho en casa: hojas dobladas, una frase por página escrita por el adulto sobre cosas del niño —«mi mamá me ama», «mi mano», «mi mesa»—, con dibujos del propio niño. Se lee entero en dos minutos y él lo lee solo desde el primer día.\n\nEl criterio para elegir: si el niño falla más de una palabra de cada veinte, el texto es demasiado difícil para leer solo. Ese texto sirve para que se lo lean." },

{ id:"leerle-todos-los-dias", label:"Leerle en voz alta todos los días, muy por encima de su nivel", level:2, lon:280, tier:"town", ab:3, edge:["down"],
  view:"Mientras el niño aprende a descifrar, siga leyéndole textos que él no podría descifrar. Las dos cosas no compiten: alimentan cosas distintas.\n\nLo que la lectura en voz alta le da es vocabulario, estructuras de lengua escrita —que no son las del habla—, conocimiento del mundo y, sobre todo, la experiencia de que un libro es algo que da placer. Ese último punto es el que decide si el niño va a leer por su cuenta dentro de cinco años.\n\nQuince minutos al día, sin preguntas de comprensión, sin evaluación, sin convertirlo en tarea. Que elija él. Que repita el mismo cuarenta veces si quiere." },

{ id:"prueba-de-palabra-nueva", label:"La prueba de la palabra inventada", level:1, lon:24, tier:"point", ab:2, edge:["down"],
  view:"Escriba «mume» o «milo» en un papel y pídale que lo lea. No significan nada, así que no hay nada que recordar: solo se pueden descifrar.\n\nEs la prueba más exigente y la más informativa de todas, y toma diez segundos. Un niño que lee bien palabras conocidas y falla en las inventadas está reconociendo formas, no descifrando.\n\nPreséntelo como un juego de palabras chistosas, no como examen. A los cuatro años las palabras inventadas dan risa, y esa risa es lo que hace que la prueba se pueda repetir sin resistencia." },

{ id:"una-consonante-por-semana", label:"Como máximo, una consonante nueva cada dos o tres semanas", level:1, lon:144, tier:"point", ab:2, edge:["down"],
  view:"El ritmo realista para un niño de cuatro o cinco años es una consonante nueva cada dos o tres semanas, y en muchos casos más lento. Al año, siete u ocho consonantes bien puestas es un resultado bueno.\n\nLa tentación de acelerar aparece siempre, y en general viene del adulto y no del niño. El costo de acelerar no se ve en el momento: se ve tres meses después, cuando el niño reconoce diez sílabas de manera insegura en vez de cuatro con firmeza.\n\nLa señal para avanzar no es el calendario ni el reconocimiento: es que la sílaba salga sin pausa, en desorden, escrita a mano, en papel nuevo, en dos días distintos." }
];

{ id:"m-en-harina", label:"La m dibujada con el dedo en harina esparcida", level:1, lon:24, tier:"point", ab:2, edge:["down"],
  view:"Una charola, dos cucharadas de harina o de azúcar esparcidas en capa delgada, y el dedo del niño. Se traza la m: baja, sube-baja, sube-baja. Se borra pasando la mano y se vuelve a empezar.\n\nLa ventaja sobre el lápiz es doble. No hace falta fuerza ni precisión de pinza, que a los cuatro años todavía no están, así que el niño puede concentrarse en la forma y no en sostener el instrumento. Y el error desaparece sin dejar rastro, lo cual quita por completo el miedo a equivocarse.\n\nLa textura añade además un canal de memoria: la mano recuerda el recorrido aunque el ojo dude. Variantes con lo que haya: arena, espuma de afeitar, el vidrio empañado del baño, gotas de agua en la mesa.",
  kid:{ ore:"tierra", glyph:{t:"letra",ch:"m"}, say:"eme", ask:"Traza la eme. Toca los puntos en orden.", game:"trazar", xp:25 } },

{ id:"maaa-hasta-el-aire", label:"Alargar la maaa hasta que se acabe el aire", level:1, lon:81, tier:"point", ab:0, edge:["down"],
  view:"Se toma aire y se dice maaaaaaa hasta que no quede nada, compitiendo con el adulto a ver quién aguanta más. Se hace tres o cuatro veces y da risa.\n\nDebajo del juego hay dos cosas útiles. La vocal sostenida separa perceptivamente las dos partes de la sílaba sin cortarlas, que es justo la intuición que hay que instalar: hay algo al principio y algo que continúa. Y el tiempo largo permite que el ojo del niño recorra las dos letras de la tarjeta mientras la boca las está produciendo, lo que ata el signo al sonido sin explicación.\n\nSe va acortando en los días siguientes hasta que la sílaba salga a velocidad normal.",
  kid:{ ore:"esmeralda", glyph:{t:"silaba",s:"ma"}, say:"maaaaa", ask:"¿Cuánto aguantas diciendo maaaa?", game:"oir", xp:20 } },

{ id:"barajar-las-cinco", label:"Barajar las cinco tarjetas y leerlas en desorden", level:1, lon:114, tier:"point", ab:0, edge:["down"],
  view:"Las cinco tarjetas de la serie se revuelven boca abajo, se voltean de una en una y el niño dice cuál es. Dos minutos.\n\nEs la prueba que separa el dominio real de la memoria de secuencia. Un niño que recita ma-me-mi-mo-mu de corrido puede estar recordando una canción sin reconocer ninguna de las cinco por separado, y el orden fijo esconde ese hueco durante semanas. En desorden no hay dónde esconderse.\n\nSi falla más de una de cada cinco, la serie todavía no está y conviene no añadir nada nuevo. Si acierta las cinco dos días seguidos, en papel distinto, está lista.",

{ id:"un-renglon-al-dia", label:"Un solo renglón del silabario por sesión", level:1, lon:159, tier:"point", ab:2, edge:["down"],
  view:"La página del silabario tiene cuatro renglones y la tentación es hacerlos todos. Haga uno.\n\nUn renglón son cinco sílabas o cuatro palabras, y eso llena por completo una sesión de diez minutos si se repite lo suficiente. Avanzar la página entera produce un niño que pasó por veinte cosas y no domina ninguna, y ese es el patrón más común de estancamiento en el uso casero del silabario.\n\nLa señal para pasar al renglón siguiente no es el calendario: es que el anterior salga sin pausa, en desorden y en papel distinto. Marque con lápiz hasta dónde llegó; el silabario está hecho para durar meses, no semanas.",

{ id:"a-sola-en-tarjeta", label:"La tarjeta de la «a» sola, junto a la de «ma»", level:1, lon:204, tier:"point", ab:1, edge:["down"],
  view:"Dos tarjetas: una con «a» sola, otra con «ma». Se leen por separado y después se juntan en ese orden: a-ma.\n\nEs la manera de desarmar la primera palabra que no empieza con consonante. El niño ve que la primera pieza es una sola letra y no una sílaba de dos, y eso es información nueva sobre cómo funciona el sistema: no todas las piezas tienen el mismo tamaño.\n\nDespués conviene comparar «ama» con «mama», puestas una debajo de otra. Se parecen mucho, dicen cosas distintas, y la diferencia está solo al principio. Un niño que las distingue está mirando la palabra entera y no su silueta.",
  kid:{ ore:"oro", glyph:{t:"palabra",w:"ama"}, say:"a... ma... ama", ask:"Arma la palabra: toca «a» y luego «ma».", game:"formar",

{ id:"tapar-la-mitad", label:"Tapar la mitad de la oración con la mano", level:1, lon:248, tier:"point", ab:2, edge:["down"],

  kid:{ ore:"esmeralda", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi mamá... me ama", ask:"¿Qué parte falta? Tócala.", game:"elegir",

/* ============ ORAL — nuevas posiciones ============ */
WORLDS.oral.push(

{ id:"cancion-de-la-m", label:"La canción de la m, cantada antes de verla escrita", level:2, lon:30, tier:"town", ab:2,
  view:"Cualquier melodía conocida sirve; lo que cambia es la letra: ma-me-mi-mo-mu cantado sobre la tonada de una canción que el niño ya se sabe.\n\nCantar hace tres cosas que hablar no hace. Alarga las vocales sin que haya que pedirlo. Impone un ritmo regular que separa las sílabas solo. Y se pega, así que el niño la repite durante el día sin que nadie la pida, que es repaso gratis y espaciado.\n\nLa condición es cantarla antes de mostrar el papel, y seguir cantándola después. Cuando aparezcan las tarjetas, la serie ya estará en su boca.",
  kid:{ ore:"oro", glyph:{t:"renglon",s:["ma","me","mi","mo","mu"]}, say:"ma me mi mo mu", ask:"Canta conmigo. Toca cada una.", game:"ordenar",
