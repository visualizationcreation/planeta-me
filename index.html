<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15120e">
<title>El Mundo de la M</title>
<style>
:root{
  --bg:#15120e; --bg2:#211c15; --fg:#f6f3ec;
  --dirt:#7a5a3a; --stone:#8a8a86; --iron:#d8c0a0;
  --gold:#f2c14a; --emerald:#3fd07a; --diamond:#5fe4e4;
  --xp:#7fdb3a;  --lock:#4a443a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  touch-action:manipulation}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,2px)}
  50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;padding:8px 12px 4px}
.hudrow{display:flex;align-items:center;gap:8px}
#wname{font:700 14px/1.2 var(--sans)}
#wsub{font:400 9.5px/1.3 var(--mono);color:rgba(246,243,236,.42);margin-top:2px}
.lvl{width:44px;height:44px;display:grid;place-items:center;background:var(--xp);color:#123;
  border:3px solid #2c4a13;border-radius:2px;font:800 20px/1 var(--sans);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.22);transition:transform .3s}
.lvl.pop{transform:scale(1.35) rotate(-6deg)}
.pbtn{width:44px;height:44px;background:var(--bg2);border:3px solid #34302a;border-radius:2px;
  color:rgba(246,243,236,.62);font-size:19px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
#xpwrap{margin-top:7px;height:16px;background:#000;border:3px solid #34302a;border-radius:2px;
  overflow:hidden;position:relative}
#xpbar{height:100%;width:0;background:var(--xp);transition:width .5s cubic-bezier(.2,.9,.3,1)}
#xptext{position:absolute;inset:0;display:grid;place-items:center;font:700 9px/1 var(--mono);
  color:#fff;text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000}

/* ---------- ORBE ---------- */
#globewrap{flex:1 1 auto;position:relative;min-height:0;display:grid;place-items:center}
#orb{width:100%;height:100%;display:block;touch-action:none}
#layerbar{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:5px;z-index:3}
.lay{width:36px;height:32px;border:3px solid #34302a;border-radius:2px;display:grid;place-items:center;
  font:700 10px/1 var(--mono);color:#0c0a07;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.28)}
.lay.locked{background:var(--lock)!important;color:rgba(246,243,236,.3)}
.lay.on{border-color:#fff;transform:scale(1.12)}
#hint{position:absolute;left:0;right:0;bottom:2px;text-align:center;pointer-events:none;
  font:700 13px/1.4 var(--sans);color:rgba(246,243,236,.6);padding:0 84px}
#topo{position:absolute;left:6px;bottom:2px;width:74px;cursor:pointer;z-index:4}
#topo.happy{animation:hop .5s 2}
#topo.oops{animation:tilt .4s}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) scale(1.06)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}70%{transform:rotate(7deg)}}

/* ---------- HOTBAR ---------- */
#hotbar{flex:0 0 auto;padding:5px 8px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:5px;justify-content:center}
.slot{flex:1 1 0;max-width:76px;aspect-ratio:1;border:3px solid #34302a;background:var(--bg2);
  border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);position:relative;padding:2px}
.slot.on{border-color:#fff}
.slot.locked{opacity:.45}
.slot i{font-style:normal;font-size:21px;line-height:1}
.slot b{font:700 8px/1.1 var(--mono);color:rgba(246,243,236,.6)}
.slot .need{position:absolute;inset:0;display:grid;place-items:center;font:700 9px/1 var(--mono);
  color:var(--gold);background:rgba(0,0,0,.6)}

/* ---------- PANEL ---------- */
#panel{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.96);display:none;
  flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#panel.on{display:flex}
#pclose{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:48px;height:48px;
  background:var(--bg2);border:3px solid #34302a;border-radius:2px;color:#fff;font-size:21px;
  cursor:pointer;z-index:3}
#pore{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
#pglyph{flex:1 1 auto;min-height:110px;display:grid;place-items:center;margin:6px 0}
#pask{font:700 17px/1.3 var(--sans);text-align:center;text-wrap:pretty;margin:2px 0 8px;
  color:rgba(246,243,236,.78)}
#pgame{flex:0 0 auto}
#pfeed{text-align:center;font:800 19px/1.3 var(--sans);min-height:26px;margin-top:6px;color:var(--emerald)}
#pfeed.bad{color:#f0a48c}
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{min-width:82px;min-height:82px;padding:8px 14px;background:#3b342a;border:4px solid #241f18;
  border-radius:3px;color:#fff;font:700 32px/1 var(--sans);cursor:pointer;display:grid;place-items:center;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.07);
  transition:transform .1s}
.tile:active{transform:scale(.93)}
.tile.ok{background:var(--emerald);border-color:#1d6b3c;color:#052}
.tile.no{background:#b0402e;border-color:#5e1f14}
.tile.sm{font-size:21px;min-width:66px;min-height:60px}
.row{display:flex;gap:8px;margin-top:8px}
.act{flex:1;padding:16px 10px;background:var(--gold);border:4px solid #8a6410;border-radius:3px;
  color:#2a1e02;font:800 17px/1 var(--sans);cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.2)}
.act.ghost{background:var(--bg2);border-color:#34302a;color:rgba(246,243,236,.72)}
.act.go{background:var(--emerald);border-color:#1d6b3c;color:#052}
.act:disabled{opacity:.38}
/* contar */
#tally{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;margin-bottom:8px}
.tb{width:38px;height:38px;background:var(--gold);border:3px solid #8a6410;border-radius:2px;
  display:grid;place-items:center;font:800 16px/1 var(--sans);color:#2a1e02;animation:pin .18s}
@keyframes pin{from{transform:scale(.3);opacity:0}}
.bigpad{width:100%;height:112px;background:var(--dirt);border:5px solid #4a3524;border-radius:3px;
  color:#fff;font:800 24px/1.2 var(--sans);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.3)}
.bigpad:active{transform:scale(.97)}

/* ---------- ROMPER EL BLOQUE ---------- */
#smash{position:fixed;inset:0;z-index:24;background:rgba(8,6,4,.97);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#smash.on{display:flex}
#smash .lbl{font:800 20px/1.3 var(--sans);text-align:center;text-wrap:pretty}
#smashblk{width:min(58vw,210px);aspect-ratio:1;position:relative;cursor:pointer;
  background:#3b342a;border:6px solid #241f18;border-radius:3px;display:grid;place-items:center;
  box-shadow:inset -7px -7px 0 rgba(0,0,0,.32),inset 7px 7px 0 rgba(255,255,255,.07)}
#smashblk .txt{font:800 clamp(28px,11vw,58px)/1 var(--sans);color:#fff;text-align:center;padding:6px}
#smashblk.hit{animation:shk .16s}
#crack{position:absolute;inset:0;pointer-events:none;opacity:0}

/* ---------- COFRE ---------- */
#chest{position:fixed;inset:0;z-index:26;background:#14120e;display:none;flex-direction:column}
#chest.on{display:flex}
#chest .hd{padding:calc(12px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(246,243,236,.12)}
#chest .hd h2{flex:1;margin:0;font:800 16px/1.2 var(--sans)}
#chestgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;align-content:start}
.cell{aspect-ratio:1;border:4px solid #241f18;border-radius:3px;display:grid;place-items:center;
  font:700 19px/1 var(--sans);color:#fff;cursor:pointer;text-align:center;padding:4px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3)}
.cellempty{aspect-ratio:1;border:3px dashed rgba(246,243,236,.14);border-radius:3px}

/* ---------- TOAST / FIESTA ---------- */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-180%);
  z-index:40;background:#2b2419;border:4px solid #6b5a2e;border-radius:3px;padding:10px 16px;
  display:flex;align-items:center;gap:11px;transition:transform .45s cubic-bezier(.2,1.1,.3,1);
  box-shadow:0 8px 0 rgba(0,0,0,.35);max-width:92vw}
#toast.on{transform:translate(-50%,0)}
#toast .ic{width:36px;height:36px;background:var(--gold);border:3px solid #8a6410;border-radius:2px;
  display:grid;place-items:center;font-size:18px}
#toast .tx b{display:block;font:800 13px/1.2 var(--sans);color:var(--gold)}
#toast .tx span{display:block;font:600 11px/1.3 var(--sans);color:rgba(246,243,236,.72);margin-top:2px}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.pt{position:absolute;border-radius:1px}

/* ---------- PUERTA DEL ADULTO ---------- */
#parent{position:fixed;inset:0;z-index:30;background:#14120e;display:none;flex-direction:column}
#parent.on{display:flex}
#phead{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(246,243,236,.12);
  display:flex;align-items:center;gap:12px}
#phead h2{flex:1;margin:0;font:600 14px/1.3 var(--sans)}
#pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 40px}
#pbody h3{margin:0 0 4px;font:600 17px/1.32 var(--sans);text-wrap:pretty}
#pbody .meta{font:400 10px/1.5 var(--mono);color:rgba(246,243,236,.4);margin-bottom:12px}
#pbody p{margin:0 0 11px;font:400 14.5px/1.62 var(--sans);color:rgba(246,243,236,.84);text-wrap:pretty}
#pbody .strata{margin-top:22px;padding-top:14px;border-top:1px solid rgba(246,243,236,.1);
  font:400 11px/1.6 var(--mono);color:rgba(246,243,236,.42);text-wrap:pretty}
.gate{padding:24px;text-align:center}
.gate p{font:400 13px/1.6 var(--sans);color:rgba(246,243,236,.6);margin:0 0 16px}
.gnum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:0 auto}
.gnum button{padding:16px;background:var(--bg2);border:3px solid #34302a;border-radius:2px;color:#fff;
  font:700 20px/1 var(--mono);cursor:pointer}
#a11y{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;list-style:none}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hudrow">
      <div style="flex:1;min-width:0"><div id="wname"></div><div id="wsub"></div></div>
      <button class="pbtn" id="chestbtn" aria-label="Mi cofre">🧰</button>
      <div class="lvl" id="lvl">1</div>
      <button class="pbtn" id="adultbtn" aria-label="Para el adulto">i</button>
    </div>
    <div id="xpwrap"><div id="xpbar"></div><div id="xptext"></div></div>
  </div>
  <div id="globewrap">
    <svg id="orb" viewBox="0 0 400 400" role="application" aria-label="Mundo de bloques"></svg>
    <div id="layerbar"></div>
    <svg id="topo" viewBox="0 0 60 62" aria-label="Topo"></svg>
    <div id="hint"></div>
  </div>
  <div id="hotbar"></div>
  <ul id="a11y" aria-label="Bloques disponibles"></ul>
</div>

<div id="panel">
  <button id="pclose" aria-label="Cerrar">✕</button>
  <div id="pore"></div>
  <div id="pglyph"></div>
  <div id="pask"></div>
  <div id="pgame"></div>
  <div id="pfeed"></div>
  <div class="row">
    <button class="act ghost" id="psay">🔊 Otra vez</button>
    <button class="act" id="pdone">Listo</button>
  </div>
</div>

<div id="smash">
  <div class="lbl" id="smashlbl">¡Rómpelo!</div>
  <div id="smashblk"><div class="txt"></div><svg id="crack" viewBox="0 0 100 100"></svg></div>
  <div class="lbl" style="font-size:14px;opacity:.6">Aprieta o dale golpes</div>
  <button class="act ghost" id="smashskip" style="max-width:220px">Guardar sin romper</button>
</div>

<div id="chest">
  <div class="hd"><h2>Mi cofre</h2><button class="pbtn" id="chestx" style="width:40px;height:40px">✕</button></div>
  <div id="chestgrid"></div>
</div>

<div id="toast"><div class="ic">🏆</div><div class="tx"><b></b><span></span></div></div>
<div id="fx"></div>

<div id="parent">
  <div id="phead"><h2>Para el adulto</h2>
    <button class="pbtn" id="pxclose" style="width:40px;height:40px;font-size:16px">✕</button></div>
  <div id="pbody"></div>
</div>

<script>

/* ============================================================
   orbprint — datos
   Sujeto: La serie ma-me-mi-mo-mu como la primera puerta a la
   lectura en español. Orbe para el ADULTO QUE ENSEÑA.
   ============================================================ */

const BUILD = { density:"dense", positions:0, bands:6, worlds:5, authored:"2026-08-15" };

const SUBJECT = { id:"serie-mamemimomu", label:"La serie ma-me-mi-mo-mu como la primera puerta a la lectura en español" };

const THREAD = [
  { id:"oral", label:"Antes de la letra", gloss:"El habla que el niño ya tiene, y el oído que hay que despertar antes de mostrarle un solo signo.", entry:"conciencia-fonologica", cap:"origen" },
  { id:"silabario", label:"La serie ma-me-mi-mo-mu", gloss:"La primera puerta: cinco sílabas, una consonante, las cinco vocales, y la oración que abren.", entry:"serie-mamemimomu" },
  { id:"palabras", label:"De la sílaba a la palabra", gloss:"El momento en que dos sílabas dejan de sonar por separado y se vuelven una palabra reconocida.", entry:"palabra-completa" },
  { id:"oracion", label:"De la palabra a la oración", gloss:"«Mi mamá me ama» leída de corrido, con espacios, con punto, y entendida.", entry:"oracion-completa" },
  { id:"lector", label:"El niño que ya lee solo", gloss:"Cuándo soltar el silabario, qué consonante sigue, y qué hacer con lo que ya se ganó.", entry:"lee-solo", cap:"término" }
];

const WORLDS = {};

WORLDS.silabario = [

/* ---------- NIVEL 6 — los marcos más anchos ---------- */
{ id:"principio-alfabetico", edge:["up"], label:"El principio alfabético: que unas marcas quietas representan sonidos del habla", level:6, lon:0, tier:"city", ab:3,
  view:"Antes de cualquier método hay un descubrimiento, y no es visual sino conceptual: el niño tiene que entender que esas manchitas negras no son dibujos de cosas, sino dibujos de sonidos. Un dibujo de un gato representa un gato. La palabra «gato» no representa un gato: representa cuatro sonidos que, dichos en orden, nombran un gato. Ese rodeo es el principio alfabético, y es contraintuitivo para un niño de cuatro años que lleva toda su vida corta interpretando imágenes.\n\nLa evidencia de que todavía no ocurrió es fácil de ver. Un niño que aún no lo tiene «lee» la palabra HAMBURGUESA en el letrero como «hamburguesa» y también «comida» y también «tengo hambre», porque para él la marca representa la idea, no la cadena de sonidos. Cuando el principio se instala, ocurre lo contrario: empieza a leer letra por letra palabras que no conoce, incluso palabras inventadas, porque ya está operando sobre sonido y no sobre significado.\n\nTodo lo que sigue en este orbe —la m, las vocales, las tarjetas, la repetición— existe para provocar ese descubrimiento y luego darle material. La serie ma-me-mi-mo-mu es simplemente el material más limpio que el español ofrece para provocarlo.",
  seed:null },

{ id:"alfabetizacion-inicial", edge:["up"], label:"La alfabetización inicial como el campo que estudia cómo un niño entra a la lectura", level:6, lon:90, tier:"city", ab:3,
  view:"La alfabetización inicial es un campo con un siglo de investigación y una disputa que nunca se cerró del todo. Del lado del método global se sostiene que el niño debe encontrar el sentido primero y que descomponer palabras en trozos las mata. Del lado del método fónico y silábico se sostiene que sin la mecánica del descifrado el sentido no llega nunca, porque el niño se queda adivinando por contexto.\n\nLa investigación de las últimas tres décadas —el National Reading Panel en Estados Unidos, los informes de Castles, Rastle y Nation, y en español el trabajo de Emilia Ferreiro por un lado y las evaluaciones de Bravo Valdivieso por otro— dejó un consenso incómodo para las dos trincheras: la enseñanza explícita del código es necesaria y no es suficiente. El niño necesita que le enseñen a descifrar de forma directa y ordenada, y necesita al mismo tiempo que le lean, que le hablen, que las palabras signifiquen algo.\n\nPara quien enseña a un niño concreto, la consecuencia práctica es sencilla: haga las dos cosas. Diez minutos de código explícito al día, y todo el resto del día de lenguaje, cuentos y conversación. Este orbe cubre los diez minutos; no cubre el resto del día, y ese resto no es opcional." },

{ id:"lengua-y-afecto", edge:["up"], label:"El habla de la casa como el suelo sobre el que se levanta toda lectura", level:6, lon:180, tier:"city", ab:3,
  view:"Un niño de cuatro o cinco años que habla español ya domina, sin saberlo, casi todo lo que la lectura le va a pedir. Tiene un vocabulario de dos o tres mil palabras, conjuga verbos irregulares sin equivocarse, entiende bromas y sabe cuándo alguien está molesto por el tono. Nada de eso se lo enseñó nadie de forma explícita: lo tomó del habla de su casa.\n\nEso importa por una razón muy concreta. Leer, al principio, es convertir marcas en sonidos y sonidos en palabras que uno ya conoce. Si la palabra no está en la boca del niño, descifrarla no le devuelve nada: pronuncia «mula» correctamente y no pasa nada, porque no sabe qué es una mula. La lectura inicial se apoya enteramente sobre el vocabulario oral previo, y por eso los primeros materiales usan mamá, mano, mesa, mío —palabras que ningún niño hispanohablante necesita que le expliquen.\n\nDe ahí también la elección de «mi mamá me ama». No es una frase cualquiera reducida a sílabas fáciles: es una frase cuyo sentido el niño ya tiene completo antes de leerla. Lo único nuevo es el camino de los ojos a la boca." },

{ id:"ensenanza-temprana", edge:["up"], label:"La enseñanza temprana como oficio: un adulto, un niño, todos los días", level:6, lon:270, tier:"city", ab:3,
  view:"Enseñar a leer a un niño pequeño no se parece a dar una clase. Se parece más a enseñar a andar en bicicleta: sesiones cortas, mucha repetición, casi nada de explicación, y un adulto que sostiene sin empujar. La unidad real de trabajo no es la lección sino el día, y el resultado no se ve el martes sino en seis semanas.\n\nTres cosas distinguen al que enseña bien de al que enseña mal, y ninguna tiene que ver con el material. La primera es la constancia: diez minutos diarios superan por mucho a una hora el sábado, porque lo que se está construyendo es una asociación automática y las asociaciones se construyen por frecuencia. La segunda es la calma frente al error: un niño que se equivoca y recibe corrección tranquila sigue intentando; uno que se equivoca y percibe decepción empieza a adivinar para salvar el momento, y adivinar es exactamente el hábito que hay que evitar. La tercera es saber parar: el minuto en que el niño se distrae, se tapa la cara o se levanta es el minuto en que la sesión terminó, sin negociación.\n\nEl material de este orbe es el mismo que se usa en México desde hace dos siglos. Lo que cambia los resultados es el adulto." },

/* ---------- NIVEL 5 ---------- */
{ id:"fonema-grafema", label:"La correspondencia entre fonema y grafema en una ortografía casi perfecta", level:5, lon:0, tier:"city", ab:3,
  view:"El español es una de las ortografías más transparentes del mundo: casi cada letra se lee siempre igual. Comparado con el inglés —donde ough se lee de seis maneras distintas— el español es un sistema casi de uno a uno, y esa transparencia es la razón por la que un niño hispanohablante puede leer mecánicamente en meses lo que a un niño angloparlante le toma años.\n\n«Casi» hace trabajo aquí, y conviene saber dónde. Las excepciones reales son pocas y todas se pueden posponer: la c que suena /k/ ante a, o, u y /s/ ante e, i; la g con el mismo problema; la h muda; la q que siempre viene con u; la r que suena distinta al inicio de palabra; la x mexicana con sus cuatro valores. Ninguna de estas aparece en ma-me-mi-mo-mu, y ese es exactamente el punto de empezar por ahí.\n\nLa m es el caso perfecto de correspondencia: una letra, un sonido, sin contexto que lo altere, en cualquier posición, en cualquier palabra del idioma. No hay ninguna palabra española donde la m se lea de otra forma. Enseñarla primero es enseñar la regla en su forma más pura, antes de que el niño descubra que hay excepciones." },

{ id:"unidades-del-habla", label:"Las unidades del habla: la palabra, la sílaba y el sonido suelto", level:5, lon:40, tier:"city", ab:3,
  view:"El habla es continua. Cuando alguien dice «mi mamá me ama» no hace pausas entre las palabras: sale un chorro de sonido. Que ese chorro esté hecho de piezas es un descubrimiento, no una percepción, y las piezas no son todas igual de fáciles de percibir.\n\nLa palabra es la unidad más accesible: un niño de tres años ya puede contar cuántas palabras dijo alguien, con errores, pero puede. La sílaba viene después y viene sola, porque la sílaba corresponde a un golpe de voz y el cuerpo la marca: un niño puede palmear ma-má en dos palmadas sin que nadie se lo explique, porque son dos aperturas de boca. El fonema —el sonido suelto, la /m/ separada de la /a/— es la unidad más difícil de todas, porque en el habla real nunca aparece sola. La /m/ de «mamá» no existe como sonido independiente; existe como transición hacia la /a/.\n\nEsta jerarquía decide el método. Enseñar por sílabas empieza por la unidad que el niño ya puede oír; enseñar por fonemas empieza por la que no. Los dos caminos llegan, pero el silábico pide menos al principio, y en español —donde la sílaba es corta y regular— pide muy poco." },

{ id:"metodo-silabico", label:"El método silábico: enseñar sílabas completas antes que letras sueltas", level:5, lon:90, tier:"city", ab:1,
  view:"El método silábico enseña la sílaba como unidad indivisible: no se dice «eme con a, ma», se dice «ma», y se muestra escrito «ma». La letra suelta aparece después, como resultado de comparar sílabas, no como punto de partida.\n\nLa lógica es la que sigue. Un niño puede oír ma; no puede oír /m/. La /m/ pura es un zumbido con los labios cerrados que en el habla nunca ocurre aislado, y pedirle a un niño de cuatro años que la separe de la vocal es pedirle una abstracción que en general no puede hacer todavía. La sílaba, en cambio, es audible, pronunciable y repetible. Y en español la sílaba es además corta: la inmensa mayoría son consonante más vocal, así que con cinco tarjetas se cubre toda una consonante.\n\nEl método tiene un costo declarado y hay que conocerlo. Enseñar sílabas enteras genera muchas unidades: veinte consonantes por cinco vocales son cien tarjetas, contra veintisiete letras del método fónico. Y produce, si se hace mal, el niño que lee «ma-ri-po-sa» en cuatro golpes separados y nunca junta la palabra. Los dos problemas tienen remedio y aparecen más adelante en este orbe; ninguno de los dos justifica empezar por otro lado en español." },

{ id:"silabario-tradicion", label:"El silabario como género editorial y como tradición mexicana de dos siglos", level:5, lon:130, tier:"city", ab:2,
  view:"El silabario es un objeto físico con una historia larga: un cuadernillo barato, de pocas páginas, con las sílabas ordenadas en cuadrícula y una ilustración por lección. En México es probablemente el impreso más vendido de su historia. El Silabario de San Miguel, publicado por primera vez en el siglo XIX y reimpreso sin interrupción hasta hoy, enseñó a leer a varias generaciones enteras, y en muchas familias es el libro más antiguo que se conserva.\n\nEl género tiene una gramática interna reconocible. Primero las vocales solas. Después una consonante fácil combinada con las cinco vocales, en renglón. Después palabras formadas solo con lo ya visto. Después una oración corta. Después la siguiente consonante, y así. Esa arquitectura —del trozo al todo, sin saltarse pasos, sin usar nunca una letra que no se haya enseñado— es lo que hace que un silabario funcione incluso en manos de un adulto sin formación docente, que fue exactamente el escenario para el que se diseñó.\n\nHoy conviven silabarios tradicionales con métodos escolares oficiales que son mixtos. Un padre que usa el silabario en casa no está contradiciendo a la escuela: está dando la parte explícita del código que la escuela a veces da poco." },

{ id:"primeras-palabras", label:"Las primeras palabras que se enseñan, y por qué son siempre palabras de familia", level:5, lon:180, tier:"city", ab:2,
  view:"Abra cualquier silabario del mundo hispanohablante y la primera palabra será mamá. No es sentimentalismo editorial: es la intersección de tres restricciones.\n\nLa primera es fonética. Mamá está hecha de una sola consonante, la más fácil de todas, repetida, con la vocal más abierta. No hay en el idioma una palabra de dos sílabas más simple de pronunciar ni de descifrar. La segunda es de vocabulario: no existe niño hispanohablante de cuatro años que no sepa qué significa mamá, así que descifrarla devuelve sentido de inmediato, que es la recompensa que sostiene el esfuerzo. La tercera es afectiva, y es la que suele subestimarse: la primera palabra que un niño lee es un acontecimiento, y conviene que sea una palabra que le importe. Un niño que lee «mamá» y corre a mostrárselo a su mamá acaba de descubrir que leer sirve para algo.\n\nDe ahí también «mi mamá me ama». Es la primera oración de casi todos los silabarios porque usa solamente m y vocales, y porque dice algo verdadero sobre la vida del niño. La combinación —descifrable y significativa— es rara y hay que aprovecharla mientras dure; para la segunda consonante ya habrá que negociar." },

{ id:"comprender-vs-descifrar", label:"Descifrar y comprender como dos cosas distintas que deben llegar juntas", level:5, lon:220, tier:"city", ab:3,
  view:"Se puede descifrar sin comprender y se puede comprender sin descifrar, y los dos fracasos se ven todos los días.\n\nEl primero es el niño que lee en voz alta correctamente, con buena pronunciación, y al terminar no puede decir de qué se trataba. Descifró y no entendió: convirtió letras en sonidos sin que los sonidos activaran significado. En los primeros meses esto es normal y transitorio, porque el descifrado consume toda su atención y no queda nada para el sentido. Se resuelve con automatización, no con explicaciones.\n\nEl segundo es el niño que «lee» un cuento que ya se sabe de memoria, o que dice «perro» al ver la palabra GATO junto a un dibujo de perro. Comprendió la situación sin descifrar nada. Este fracaso es más peligroso porque se parece a un éxito, y un adulto contento lo refuerza sin darse cuenta durante meses.\n\nLa prueba que separa los dos casos es siempre la misma y aparece varias veces en este orbe: tapar el dibujo, o dar una palabra que el niño no espera. Si sin apoyo contextual la lectura se cae, lo que había no era lectura. Hágala cada semana, sin dramatismo, como quien toma la temperatura." },

{ id:"practica-diaria", label:"La práctica diaria del que enseña: repetición corta, sostenida y sin castigo", level:5, lon:270, tier:"city", ab:3,
  view:"Lo que decide el resultado no es el método sino la frecuencia. Una asociación automática entre una marca y un sonido se construye por exposición repetida y espaciada, y no hay atajo: el cerebro necesita ver «ma» y decir /ma/ muchas veces, en días distintos, hasta que la respuesta salga sin pensar.\n\nEso fija la forma de la práctica. Sesiones cortas —de cinco a doce minutos con un niño de cuatro años, hasta veinte con uno de seis— todos los días, mejor a la misma hora, mejor antes de que llegue el cansancio de la tarde. Una sesión larga el fin de semana no equivale a siete cortas; produce mucho menos aprendizaje y bastante más rechazo.\n\nDentro de la sesión, la proporción que funciona es aproximadamente: un tercio repasar lo que ya sabe (fácil, rápido, para arrancar con éxito), un tercio trabajar lo nuevo, un tercio jugar con lo que ya se puede leer. Terminar siempre con algo que el niño hace bien.\n\nY una regla sobre el error: se corrige el error, no al niño. «Esa es la n; mira, esta cierra los labios» funciona. «Ya te lo dije tres veces» enseña otra cosa, y esa otra cosa dura más que la lección." },

{ id:"dificultad-lectora", label:"La dificultad para aprender a leer y cómo se reconoce a los cinco años", level:5, lon:310, tier:"city", ab:3,
  view:"Entre el cinco y el diez por ciento de los niños tiene una dificultad específica para aprender a leer que no se explica por inteligencia, oportunidad ni esfuerzo. En español, donde la ortografía es transparente, la dislexia se manifiesta menos como errores de lectura y más como lentitud persistente: el niño llega a leer correctamente, pero le sigue costando mucho más tiempo que a los demás, año tras año.\n\nA los cuatro o cinco años no se diagnostica nada, y conviene decirlo con claridad porque la ansiedad de los padres empuja en la otra dirección. Lo que sí se puede observar son señales de riesgo: dificultad marcada para percibir rimas, imposibilidad de palmear sílabas después de varias semanas de práctica, problemas para recordar el nombre de letras ya vistas muchas veces, antecedentes familiares de dificultad lectora, o retraso previo en el desarrollo del habla.\n\nLa respuesta correcta ante esas señales no es esperar ni alarmarse: es más práctica, más corta, más explícita y más multisensorial —tocar, trazar, decir en voz alta— y una consulta con la maestra y, si persiste, con un especialista en lenguaje. La intervención temprana funciona bien y la tardía funciona mal, y esa diferencia es la única razón por la que vale la pena mirar tan pronto." }

{ id:"sonido-m", label:"El sonido /m/ como la consonante más fácil de todo el español", level:4, lon:0, tier:"town", ab:1,
  view:"La /m/ gana por goleada el concurso de la consonante más fácil, y por razones que se pueden enumerar.\n\nEs visible: se hace cerrando los labios, y el niño puede ver la boca del adulto y verse a sí mismo en un espejo. Casi ninguna otra consonante ofrece eso; la /k/ y la /g/ pasan enteras dentro de la boca. Es continua: se puede sostener —mmmmmm— todo lo que dure el aire, a diferencia de la /p/ o la /t/, que son explosiones instantáneas imposibles de alargar y por tanto imposibles de examinar despacio. Es sonora: vibra, y esa vibración se siente poniendo un dedo en la nariz o en la garganta, lo que da una prueba física de que algo está pasando. Y es temprana: /m/ está entre los primeros sonidos que produce cualquier bebé del mundo, mucho antes de hablar, lo que explica que «mamá» o su equivalente sea una palabra parecida en idiomas sin ningún parentesco.\n\nTambién es única en la escritura: la letra m se lee /m/ siempre, en toda palabra española, sin excepción y sin depender de qué venga después.\n\nEsa acumulación de ventajas es la razón de que prácticamente todos los silabarios en español empiecen por aquí. No es tradición: es que no hay mejor candidata." },

{ id:"letra-m", label:"La letra m como el signo que guarda ese sonido", level:4, lon:15, tier:"town", ab:1,
  view:"El sonido y la letra son cosas distintas y el niño tiene que unirlas. La letra m tiene tres propiedades útiles para eso.\n\nSu forma es distintiva. Tres picos, ancha, con un perfil que no se parece a casi nada más del alfabeto. La única confusión real es con la n, que tiene dos picos en vez de tres, y ese parecido es el origen de casi todos los errores de esta etapa —tanto que aparece dos veces más en este orbe.\n\nNo tiene ambigüedad de orientación. La b y la d son la misma forma volteada, y la p y la q también; un niño que confunde izquierda y derecha las intercambia durante meses. La m no tiene espejo: volteada sigue siendo m. Eso la vuelve segura como primera letra.\n\nY se traza de un solo golpe. Baja, sube, baja, sube, baja: tres montañas sin levantar el lápiz. La mano de un niño de cuatro años puede hacerlo, aunque los picos salgan disparejos, que salen.\n\nUna nota práctica: enseñe primero la minúscula. Los textos que el niño va a leer están en minúscula casi por completo, y la mayúscula puede esperar a que la minúscula sea automática." },

{ id:"cinco-vocales", label:"Las cinco vocales del español como un inventario completo y cerrado", level:4, lon:40, tier:"town", ab:2,
  view:"El español tiene cinco vocales y solo cinco, y esa es una de las mejores noticias que recibe un niño hispanohablante que aprende a leer. El inglés tiene entre doce y veinte según el dialecto, escritas con las mismas cinco letras en combinaciones impredecibles; el francés tiene nasales que no se escriben como se oyen. En español, a se lee /a/ siempre. e se lee /e/ siempre. Y así las cinco, en sílaba tónica o átona, al principio o al final, en cualquier palabra del idioma.\n\nEso significa que el inventario se aprende una vez y se cierra. Cinco signos, cinco sonidos, sin excepciones que memorizar, sin reglas contextuales. Una vez que el niño tiene las cinco vocales, cada consonante nueva que aprenda le entrega automáticamente cinco sílabas, y ese factor de cinco es la palanca de todo el método.\n\nHay dos detalles que conviene tener en la cabeza aunque no se enseñen todavía. Uno: los diptongos —ai, ue, io— son dos vocales que se dicen en un solo golpe, y complican el conteo de sílabas más adelante. Dos: la u es muda en que, qui, gue, gui. Ninguna de las dos cosas aparece en ma-me-mi-mo-mu, y por eso esta serie es un lugar limpio para empezar." },

{ id:"silaba-cv", label:"La sílaba consonante-vocal como la unidad que el niño oye antes de ver la letra", level:4, lon:60, tier:"town", ab:2,
  view:"La sílaba consonante más vocal —ma, pe, si, lo, tu— es la estructura silábica más común del español y, según los estudios tipológicos, la más común de las lenguas del mundo. Es la única que aparece en absolutamente todos los idiomas conocidos, y la primera que produce cualquier bebé al balbucear.\n\nEsa universalidad tiene una consecuencia práctica directa. Cuando un niño hispanohablante de cuatro años palmea una palabra, casi siempre acierta, porque las sílabas del español son cortas, con núcleo vocálico claro y sin las agrupaciones de consonantes que hacen difícil el conteo en inglés o alemán. Palmear ma-ri-po-sa da cuatro palmadas y ningún niño duda.\n\nLa sílaba abierta —la que termina en vocal— es además la más fácil de todas, porque la boca termina abierta y el sonido puede sostenerse. Compárela con «mar» o «pan», que cierran con consonante y obligan a un corte. Las cinco sílabas de la serie ma-me-mi-mo-mu son todas abiertas, todas de dos sonidos, todas con la misma consonante: no existe en el idioma un conjunto más simple, y por eso es el primero.\n\nLas sílabas trabadas —bra, pla, tren— vienen mucho después, y con razón." },

{ id:"serie-mamemimomu", label:"La serie ma-me-mi-mo-mu como la primera puerta a la lectura en español", level:4, lon:90, tier:"city", ab:0,
  upAlt:"silabario-tradicion",
  view:"Cinco sílabas: ma, me, mi, mo, mu. Una sola consonante recorriendo las cinco vocales, en el orden fijo que todo silabario respeta. Es el primer renglón del primer libro con el que México aprendió a leer, y sigue siendo, después de dos siglos, el mejor punto de entrada que ofrece el idioma.\n\nLo que hace a la serie extraordinaria es que combina cuatro facilidades a la vez, y ninguna otra combinación de letras del español las reúne todas. La consonante es la más fácil de producir, de ver y de sostener. Las vocales son el inventario completo, así que al terminar la serie el niño ya conoce todas las vocales del idioma. Todas las sílabas son abiertas, de dos sonidos, sin excepción ortográfica de ningún tipo. Y las palabras que resultan —mamá, mimo, memo, mula, mole, mano si se añade la n más tarde— incluyen la palabra que más le importa al niño en el mundo.\n\nLa serie también enseña, sin que haya que explicarlo, la idea central del sistema alfabético: que una parte se queda quieta y otra cambia. La m no se mueve; la vocal sí. Cuando un niño ve que ma y mo comparten algo y difieren en algo, acaba de descubrir por su cuenta que las sílabas están hechas de piezas —y ese descubrimiento, hecho por él y no dicho por usted, es el que sostiene todo lo que viene después.\n\nLa serie no se enseña de golpe. Se enseña ma hasta que sea automática, y solo entonces se añade la siguiente. El error más común de esta etapa es enseñar las cinco el mismo día." },

{ id:"unir-sonidos", label:"La unión de dos sonidos en uno solo como el salto que de verdad cuesta", level:4, lon:105, tier:"town", ab:1,
  view:"Aquí está el obstáculo real de toda la enseñanza inicial, y conviene nombrarlo antes de tropezar con él. El niño puede saber que esa letra es la m, puede saber que esa otra es la a, y aun así no poder leer «ma». Sabe las dos piezas y no produce la unión.\n\nLa razón es que la unión no es una suma. /m/ más /a/ no da /m/ /a/ dicho rápido: da un sonido nuevo y continuo donde la /m/ ya viene modelada hacia la /a/ desde antes de abrir los labios. Un niño que dice «eme... a... ¿ema?» está haciendo aritmética con nombres de letras, y por ese camino no llega. De ahí que el método silábico evite deletrear: nunca «eme con a», siempre «ma» directo.\n\nLa técnica que desatasca esto se llama deslizamiento y consiste en no soltar el aire. El adulto dice mmmmmaaaaa sin cortar, alargando la m y dejándola caer en la vocal, y el niño imita. Como la m es continua, se puede alargar; con la p esto sería imposible, y esa es otra razón para empezar por la m.\n\nAlgunos niños dan este salto en un día. Otros tardan tres semanas. La diferencia no predice nada sobre el futuro lector, y vale la pena saberlo de antemano para no comunicar prisa." },

{ id:"orden-consonantes", label:"El orden en que se enseñan las consonantes y por qué la m va primero", level:4, lon:130, tier:"town", ab:1,
  view:"El orden no es arbitrario ni tradicional: obedece a criterios que se pueden enunciar, y conocerlos permite decidir qué sigue.\n\nSe enseñan primero las consonantes continuas y sonoras —m, s, l, n, r suave— porque se pueden alargar y por tanto deslizar hacia la vocal. Después las oclusivas —p, t, d, b— que son explosiones y no se dejan sostener. Se enseñan primero las de correspondencia única, y se posponen las que dependen del contexto: la c, la g, la r, la y, la x. Se separan en el tiempo las que se parecen entre sí, en forma o en sonido: nunca m y n seguidas, nunca b y d seguidas, nunca p y q seguidas. Y se prefieren las que aparecen en palabras que el niño ya usa.\n\nLa m gana en todos los criterios a la vez, así que va primera casi siempre. Después suele venir la p —oclusiva, pero muy visible y muy frecuente— o la s, que es continua y aparece en todos los plurales. La n se pospone deliberadamente varias consonantes, porque su parecido con la m es la fuente principal de confusión de esta etapa.\n\nUna secuencia razonable para los primeros meses: m, p, s, l, t, d, n. Ninguna nueva antes de que la anterior salga sin pensar." },

{ id:"silabario-mexicano", label:"El Silabario de San Miguel y los libros que enseñaron a leer a México", level:4, lon:150, tier:"town", ab:2,
  view:"El Silabario de San Miguel es un cuadernillo delgado, de portada casi siempre azul o roja, que se vende hasta hoy en papelerías y mercados de todo México por unos pocos pesos. Su origen está en el siglo XIX y su estructura no ha cambiado sustancialmente: vocales, después la m con las cinco vocales, después palabras, después una oración, después la siguiente consonante.\n\nSu importancia cultural es difícil de exagerar. Durante generaciones fue el único libro que entró a muchas casas, y fue usado tanto por maestras rurales como por abuelas, hermanos mayores y vecinos sin ninguna formación docente. Que funcionara en esas manos no es casualidad: está diseñado para que el adulto no tenga que saber nada. La página dice qué hacer, en qué orden, y nunca usa una letra que no haya enseñado antes.\n\nJunto a él circularon otros —el Silabario Ideal, el Método Mexicano, el Nacho, que es más reciente y hoy probablemente el más vendido de todos—. El Nacho añade ilustraciones a color y más ejercicios, y sigue la misma arquitectura.\n\nHay algo que conviene decir con honestidad: el silabario enseña el código y no enseña a amar la lectura. Ninguna de sus páginas es un cuento. Esa parte tiene que venir de otro lado, y todos los días." },

{ id:"mi-mama-me-ama", label:"«Mi mamá me ama» como la primera oración completa del silabario", level:4, lon:180, tier:"town", ab:1,
  view:"Cuatro palabras, ocho sílabas, dos letras distintas de consonante si se cuenta bien —solo la m— y todas las vocales excepto la u. Es probablemente la oración más leída por primera vez en la historia del español, y su construcción es tan económica que parece un acertijo resuelto.\n\nDesármela. «Mi»: una sílaba de la serie, que además es una palabra completa. «Mamá»: dos sílabas idénticas de la serie. «Me»: otra sílaba de la serie que también es palabra. «Ama»: la única pieza que introduce algo nuevo, una palabra que empieza con vocal, sin consonante delante. Todo el material es m más vocales. Un niño que domina la serie puede leerla entera sin que se le enseñe una sola letra más.\n\nY además dice algo. No es «la mamá amasa la masa», que es descifrable y no significa nada para un niño; es una afirmación sobre su propia vida que él sabe que es verdadera antes de leerla. Cuando la descifra completa, lo que ocurre no es que resuelva un ejercicio: es que un papel le dice algo que le importa. Esa es la experiencia que convierte el descifrado en lectura.\n\nPor eso conviene no apurar la llegada a esta frase, y conviene celebrarla cuando llegue." },

{ id:"de-silaba-a-sentido", label:"El paso de sonar bonito a querer decir algo", level:4, lon:220, tier:"town", ab:2,
  view:"Hay un tramo, de unas semanas, en que el niño produce sonidos correctos que para él no son palabras. Lee «mu» perfectamente y no espera que signifique nada, porque no significa nada. Ese tramo es necesario y también es frágil: es donde se pierde el interés si se queda demasiado tiempo.\n\nLa salida es asegurarse de que el sentido llegue pronto y a menudo. En cuanto el niño tenga dos sílabas, forme una palabra real con ellas —mamá es alcanzable con solo ma— y muéstrele que acaba de leer algo. No espere a dominar la serie completa para pasar a palabras; el orden correcto es ma, mamá, después me, mi, mimo, y así, alternando mecánica y sentido en la misma sesión.\n\nHay una prueba sencilla para saber en qué lado está el niño: después de que lea una palabra, pregúntele qué es. Si lee «mula» y no puede decir qué es una mula, descifró sin comprender, y eso está bien mientras no sea siempre. Si lee «mamá» y sonríe, entendió.\n\nEl error que hay que evitar es convertir la sesión en una lista de sílabas sin destino. Cinco minutos de mecánica y dos de sentido funcionan; siete de mecánica no." },

{ id:"leer-con-sentido", label:"Leer con sentido: que el niño pueda decir qué acaba de leer", level:4, lon:240, tier:"town", ab:3,
  view:"La comprensión no es una etapa posterior que llega cuando el descifrado termina: es una costumbre que se instala desde la primera palabra o no se instala.\n\nLa manera de instalarla es rutinaria y toma quince segundos. Después de cada lectura, una pregunta: ¿qué dice ahí? ¿quién? ¿qué hace? Al principio la respuesta será repetir la frase, y eso ya es algo. Después vendrá una paráfrasis: «que me quiere». Ese momento —cuando el niño dice con sus palabras lo que el papel dice con las suyas— es la primera comprensión lectora real y merece más celebración que la pronunciación correcta.\n\nHay tres apoyos que funcionan bien a esta edad. Dibujar lo leído, porque un dibujo no se puede hacer sin haber entendido. Actuar la oración: que el niño señale a su mamá al leer «mi mamá». Y cambiar una palabra —«mi papá me ama»— para que note que cambiar el texto cambia el sentido, que es la prueba definitiva de que está leyendo el texto y no recordándolo.\n\nUn aviso: no convierta esto en interrogatorio. Una pregunta por lectura, con tono de conversación. Tres preguntas seguidas apagan a cualquier niño de cuatro años." },

{ id:"sesion-diaria", label:"La sesión de diez minutos como la forma real que tiene esta enseñanza", level:4, lon:270, tier:"town", ab:2,
  view:"La sesión es la unidad de trabajo, y tiene una forma bastante estable que vale la pena respetar.\n\nDura entre cinco y doce minutos con un niño de cuatro años. Empieza con algo que ya sabe, para arrancar acertando: dos minutos repasando las sílabas viejas, rápido, con ritmo de juego. Sigue con lo nuevo, tres o cuatro minutos, una sola cosa nueva por sesión —una sílaba, no cinco—. Después cinco minutos de aplicación: formar una palabra, leerla, dibujarla, pegarla en algún lado. Y termina con un éxito, siempre, aunque haya que fabricarlo: la última cosa que hace el niño en la sesión debe ser algo que le sale bien.\n\nMomento del día: temprano, cuando la atención está entera. Con el mismo adulto de preferencia, en el mismo lugar, porque la rutina baja la resistencia. Nunca como castigo, nunca en lugar de jugar, nunca cuando el niño está cansado o enojado.\n\nY una regla que cuesta seguir: si el niño se desconecta —mira a otro lado, se recuesta, se tapa la cara—, la sesión terminó. Insistir tres minutos más no agrega aprendizaje y sí agrega resistencia mañana. Cerrar temprano y contento es una decisión técnica, no una concesión." },

{ id:"errores-tipicos", label:"Los errores típicos y lo que cada uno revela", level:4, lon:310, tier:"town", ab:2,
  view:"Los errores de esta etapa son pocos y cada uno señala una causa distinta, así que conviene leerlos como diagnóstico y no como falta.\n\nDecir «na» por «ma»: confusión entre dos letras parecidas y dos sonidos parecidos, ambos nasales. Es el error más común de todos y se resuelve con contraste explícito y con el dedo en la nariz y en los labios.\n\nDecir «eme-a» y no llegar a «ma»: el niño está deletreando con nombres de letras en vez de deslizar sonidos. Se resuelve dejando de nombrar letras por completo durante unas semanas.\n\nPerder la vocal —decir «m» y quedarse—: la unión todavía no ocurrió. Se resuelve alargando: mmmaaa.\n\nLeer bien el lunes y no el miércoles: no hay error, hay falta de automatización. Más repeticiones, más espaciadas.\n\nAdivinar por el dibujo: el niño está usando contexto en lugar de código, y este es el único de la lista que hay que cortar en seco, tapando la imagen.\n\nInvertir el orden —decir «am» por «ma»—: dirección de lectura no consolidada. Se resuelve señalando con el dedo de izquierda a derecha mientras se lee, todas las veces.\n\nNinguno de estos, a los cuatro o cinco años, significa nada malo por sí solo." },

{ id:"evaluar-si-lee", label:"Cómo saber si el niño lee de verdad o solamente recuerda", level:4, lon:330, tier:"town", ab:2,
  view:"La memoria es una gran imitadora de la lectura y engaña a los adultos durante meses. Un niño que ve la misma tarjeta todos los días acaba reconociendo su forma, la mancha de café en la esquina o el orden en que están apiladas, y responde correctamente sin haber leído nada.\n\nCuatro pruebas separan una cosa de la otra, y las cuatro son rápidas.\n\nLa primera es barajar. Si el niño acierta con las tarjetas en orden y falla cuando se revuelven, memorizó la secuencia. La segunda es cambiar el soporte: escriba la sílaba a mano en un papel distinto, con otra letra, en otro color. Si eso lo desarma, lo que reconocía era el objeto, no el signo. La tercera es tapar el dibujo, si lo hay: la ilustración es la muleta más común. Y la cuarta, que es la más exigente y la más informativa, es la palabra inventada: pídale que lea «mu-me» o «mi-mo», que no significan nada. Solo se pueden leer descifrando, porque no hay nada que recordar.\n\nHaga una de estas cada semana, sin ceremonia. No para calificar al niño, sino para saber si lo que está haciendo funciona; si falla, el que corrige el método es usted." }

{ id:"articular-m", label:"Cerrar los labios y dejar salir el aire por la nariz: cómo se fabrica la /m/", level:3, lon:0, tier:"town", ab:2,
  view:"La descripción técnica es corta: consonante bilabial nasal sonora. Los labios se cierran por completo, el velo del paladar baja y deja abierto el paso hacia la nariz, y las cuerdas vocales vibran. El aire, que no puede salir por la boca, sale por la nariz. Eso es todo.\n\nLo interesante es que las tres partes de esa descripción son observables por un niño de cuatro años sin que se le explique ninguna. El cierre de labios se ve en un espejo. La salida nasal se comprueba tapándole la nariz suavemente mientras dice mmmmm: el sonido se corta de golpe, y el niño se ríe. La vibración se siente poniendo un dedo en la nariz o dos dedos en la garganta.\n\nNinguna otra consonante del español ofrece las tres pruebas a la vez. Por eso la /m/ no se enseña con palabras: se enseña con el cuerpo. Cierre usted los labios, zumbe, deje que el niño le toque la nariz, y después que lo haga él. El niño que ya sabe qué hace su cuerpo para producir ese sonido tiene un ancla física a la que volver cada vez que dude." },

{ id:"trazo-m", label:"El trazo de la m: tres montañas sin levantar el lápiz", level:3, lon:15, tier:"town", ab:2,
  view:"La m minúscula se traza en un solo movimiento continuo: se baja el palito, se sube y se baja formando el primer arco, se sube y se baja formando el segundo. Tres bajadas, dos arcos, sin despegar la punta del papel.\n\nA los cuatro años la mano todavía no controla bien el tamaño ni la regularidad, y eso es esperable: los arcos saldrán disparejos y a veces habrá cuatro. No corrija la estética. Lo único que importa en esta etapa es la dirección —de izquierda a derecha— y la continuidad del movimiento, porque el trazo continuo ayuda a memorizar la forma como un gesto y no como un dibujo.\n\nEl orden de dificultad que conviene seguir: primero en grande y en el aire, con el brazo entero. Después en una superficie con textura —harina en una charola, arena, el vidrio empañado—, donde el dedo deja huella sin necesidad de presión. Después con crayón grueso en hoja grande. Y solo al final con lápiz en renglón.\n\nEscribir la letra refuerza el reconocimiento visual de manera medible; la mano le enseña algo al ojo." },

{ id:"vocal-a", label:"La /a/ como la vocal más abierta y la primera de todas", level:3, lon:40, tier:"town", ab:2,
  view:"La /a/ se produce con la boca más abierta que ninguna otra vocal y con la lengua baja y quieta en el centro. No hay que hacer nada especial con los labios ni con la lengua: basta abrir y sonar. Por eso es la vocal más temprana en el balbuceo de cualquier bebé y la que aparece primero en todos los inventarios de enseñanza.\n\nPara el niño esto se traduce en dos cosas útiles. Es la más fácil de sostener y de imitar, porque no exige precisión articulatoria. Y es la más visible: el adulto abre grande la boca y el niño ve exactamente qué está pasando, sin tener que adivinar posiciones internas de la lengua como en la /i/ o la /u/.\n\nHay un detalle ortográfico que suele pasarse por alto y conviene aprovechar. La a es también una palabra del español —«voy a la casa»— y una de las poquísimas letras que puede aparecer sola. No se enseña todavía, pero cuando el niño pregunte por qué hay una letra sola en un texto, ya hay respuesta.\n\nEn la serie, «ma» es la primera precisamente porque junta lo más fácil con lo más fácil." },

{ id:"vocales-boca", label:"Las cinco posiciones de la boca: a, e, i, o, u", level:3, lon:60, tier:"town", ab:2,
  view:"Las cinco vocales del español se distinguen por dos cosas: cuánto se abre la boca y dónde está la lengua. Vistas de frente, forman una secuencia que el niño puede reconocer en su propia cara.\n\nLa a: boca muy abierta, lengua baja, labios relajados. La e: boca a media abertura, labios ligeramente estirados a los lados, lengua adelante. La i: boca casi cerrada, labios estirados como en una sonrisa, lengua muy adelante y arriba. La o: labios redondeados, boca a media abertura, lengua atrás. La u: labios redondeados y adelantados como para silbar, boca casi cerrada, lengua atrás y arriba.\n\nEl juego que hace visible todo esto lleva dos minutos: un espejo, y el niño dice las cinco despacio mirándose. Otra versión que funciona muy bien es tomarle cinco fotos, una por vocal, imprimirlas o verlas en el teléfono, y que él las ordene. La cara de cada vocal es su propia cara.\n\nEl orden a-e-i-o-u no es fonético sino alfabético, y se mantiene porque es el que el niño oirá el resto de su vida en la escuela." },

{ id:"silaba-abierta", label:"La sílaba abierta, que termina en vocal, como la más fácil del idioma", level:3, lon:72, tier:"town", ab:2,
  view:"Una sílaba abierta termina en vocal: ma, pe, lo. Una sílaba cerrada termina en consonante: mar, pan, sol. Una sílaba trabada tiene dos consonantes juntas al inicio: bra, pla, tren.\n\nEl orden de dificultad es exactamente ese, y hay dos razones. La primera es articulatoria: la sílaba abierta termina con la boca abierta y el sonido puede sostenerse, alargarse y examinarse; la cerrada obliga a un corte seco que es difícil de aislar. La segunda es de segmentación: en «ma» hay dos sonidos y la frontera entre ellos es un deslizamiento suave; en «tren» hay cuatro y dos de ellos están pegados sin vocal en medio, lo cual es genuinamente difícil de percibir incluso para un adulto que nunca lo ha pensado.\n\nAlrededor de la mitad de las sílabas del español son abiertas de tipo consonante-vocal, así que empezar por ahí no es empezar por un caso raro sino por el caso dominante. Un niño que domina las abiertas ya puede leer una porción enorme del idioma.\n\nLas trabadas suelen llegar bien entrado el segundo año de enseñanza, y forzarlas antes es la causa más frecuente de estancamiento." },

{ id:"ma-primera", label:"«ma»: el sonido más fácil pegado a la vocal más abierta", level:3, lon:90, tier:"town", ab:0,
  view:"«ma» es la primera sílaba que se enseña en español y probablemente la mejor diseñada por accidente. Junta la consonante más fácil de producir, ver y sostener con la vocal más abierta y más temprana. Dos sonidos, ambos sonoros, ambos continuos, unidos por un deslizamiento que no exige ningún corte.\n\nEnseñarla tiene una secuencia que conviene no alterar. Primero el sonido, sin papel: el adulto dice mmmmmaaaa alargando, el niño imita, se hace diez veces jugando. Después la asociación: se muestra la tarjeta con «ma» escrito mientras se dice, muchas veces, sin pedirle todavía que lea. Después el reconocimiento: se ponen dos tarjetas y se le pide que señale la que dice ma. Y solo al final la producción: se le muestra la tarjeta sola y se espera a que la diga él.\n\nCada uno de esos cuatro pasos puede llevar días. Saltarse el tercero —pasar de mostrar a exigir— es el atajo más frecuente y el que más frustración produce.\n\nLa señal de que «ma» está lista es que salga sin pausa, en cualquier orden, en cualquier papel. Recién entonces entra «me»." },

{ id:"me-mi-mo-mu", label:"me, mi, mo, mu: la misma consonante recorriendo las cinco vocales", level:3, lon:105, tier:"town", ab:0,
  view:"Después de «ma» el trabajo cambia de naturaleza, y esa es la buena noticia de la serie. La consonante ya está aprendida; lo único nuevo en cada paso es la vocal, y las vocales el niño ya las conoce por separado. Cada sílaba nueva es, en rigor, media sílaba nueva.\n\nEl orden es a-e-i-o-u por convención alfabética. Se introduce una por sesión o cada dos sesiones, nunca varias el mismo día, y siempre repasando las anteriores antes. Al llegar a «mu» el niño debería poder recorrer las cinco de corrido, hacia adelante y en desorden.\n\nEl ejercicio que consolida la serie completa es el contraste de vocal con la m quieta: se muestran dos tarjetas, ma y mo, y se pregunta cuál es cuál. Ahí el niño se ve obligado a atender a la segunda letra, que es justo lo que hay que instalar. Un niño que solo mira el principio de la palabra leerá «mamá» donde dice «mano» durante años si nadie lo obliga a mirar hasta el final.\n\nSeñal de dominio: leer la serie en desorden, escrita a mano, en papel nuevo, sin dudar. Eso, y no recitarla, es lo que cuenta." },

{ id:"por-que-la-m-primero", label:"Por qué casi todos los silabarios empiezan por la m", level:3, lon:130, tier:"town", ab:1,
  view:"Hay una lista de razones y todas apuntan al mismo lado, lo cual es raro y por eso la decisión es tan estable entre métodos que discuten de todo lo demás.\n\nArticulatorias: es bilabial, así que se ve; es continua, así que se alarga; es sonora, así que se siente. Ortográficas: correspondencia única, sin excepciones, sin depender de la vocal que siga. Visuales: forma distintiva de tres picos, sin espejo posible, sin confusión de orientación. De desarrollo: /m/ está entre los primeros sonidos del balbuceo humano. Léxicas: produce de inmediato mamá, que es la palabra que más le importa al niño.\n\nY una razón que no suele nombrarse pero pesa: la m permite formar una oración completa —«mi mamá me ama»— sin necesitar ninguna otra consonante. Eso no lo consigue ninguna otra letra del alfabeto español. Con la p no se llega a una oración; con la s tampoco. Solo la m entrega, ella sola, la experiencia completa de leer algo que dice algo.\n\nSi alguien pregunta por qué no la p, que también es bilabial y visible: porque es oclusiva y no se puede alargar, así que el deslizamiento hacia la vocal no se puede enseñar despacio." },

{ id:"silabario-san-miguel", label:"El Silabario de San Miguel y su lugar en las casas mexicanas", level:3, lon:150, tier:"town", ab:2,
  view:"El Silabario de San Miguel es un cuadernillo de pocas páginas, impreso en papel barato, que se ha vendido de manera continua en México desde el siglo XIX. Se consigue en papelerías de barrio, en mercados y en tiendas de abarrotes, por un precio que siempre fue simbólico, y esa disponibilidad es parte esencial de lo que fue: el libro que llegaba a donde no llegaba la escuela.\n\nSu diseño supone un adulto que no sabe enseñar. Cada página dice implícitamente qué hacer: aquí las vocales, aquí la m con cada vocal, aquí las palabras que ya puedes formar, aquí la oración. No hay instrucciones para el maestro porque la secuencia es la instrucción. Nunca aparece una letra que no se haya enseñado en una página anterior —esa regla, que hoy se llamaría control de vocabulario decodificable, el silabario la aplicaba mucho antes de que tuviera nombre.\n\nEn muchas familias mexicanas el silabario es un objeto con historia: el mismo ejemplar pasó de un hermano a otro, con anotaciones a lápiz de varias manos. Vale la pena saberlo si va a usarlo con un niño: probablemente alguien de su casa aprendió con este mismo libro, y decírselo convierte la sesión en otra cosa." },

{ id:"mama-palabra", label:"«mamá»: dos sílabas idénticas y una palabra que el niño ya dice", level:3, lon:180, tier:"town", ab:1,
  view:"«Mamá» es la primera palabra de casi todos los silabarios y es una pieza casi perfecta para el momento en que aparece. Está hecha de una sola sílaba repetida: ma más ma. El niño que domina «ma» no necesita aprender nada nuevo para leerla; necesita solamente hacer algo nuevo con lo que ya tiene, que es unir dos sílabas en una palabra.\n\nEsa operación —juntar dos sílabas y reconocer una palabra— es un salto propio y merece trabajarse aparte. La técnica que funciona es física: dos tarjetas separadas sobre la mesa, cada una con «ma», el niño lee una, lee la otra, y después el adulto las empuja hasta juntarlas mientras el niño las dice de corrido. El gesto de acercar las tarjetas y el gesto de juntar los sonidos son el mismo gesto, y esa correspondencia le ahorra al niño una explicación que no entendería.\n\nDespués viene la tilde, que es un asunto separado y que conviene no mezclar el mismo día.\n\nLo que suele ocurrir cuando un niño lee «mamá» por primera vez es que quiera ir a decírselo a su mamá. Déjelo ir. Ese viaje enseña más que el siguiente ejercicio." },

{ id:"ama-verbo", label:"«ama»: la primera palabra sin m al frente y el primer verbo", level:3, lon:195, tier:"town", ab:1,
  view:"«Ama» es la pieza más interesante de la oración porque rompe un patrón. Hasta aquí toda palabra empezaba con m: ma, me, mi, mamá. «Ama» empieza con vocal, y el niño que aprendió a leer buscando la m al principio se detiene.\n\nEsa detención es buena y hay que provocarla, no evitarla. Es la primera vez que el niño descubre que las palabras no tienen todas la misma forma y que hay que leer lo que está, no lo que se espera. Estructuralmente es a-ma: una vocal sola seguida de una sílaba conocida. Se enseña separando: se escribe la a en una tarjeta y ma en otra, se leen por separado, se juntan.\n\nY hay un segundo asunto: «ama» es un verbo, y es el primer verbo que el niño lee. Hasta aquí solo había nombrado cosas —mamá es alguien—. Un verbo dice que algo pasa, y eso es lo que convierte a la oración en oración. Sin «ama», «mi mamá me» no dice nada.\n\nA los cuatro años no se explica esto con gramática. Se explica con la pregunta: ¿qué hace tu mamá? Y la respuesta está en el papel." },

{ id:"mi-y-me", label:"«mi» y «me»: dos sílabas que también son palabras", level:3, lon:220, tier:"town", ab:1,
  view:"En la serie, «mi» y «me» son sílabas. En la oración son palabras completas, y esa doble condición es una de las cosas más útiles que ofrece el material.\n\nUna sílaba que es también una palabra le permite al niño entender, sin explicación, que las palabras se separan por espacios y que un trozo de sonido puede valer por sí solo. Cuando lee «mi mamá me ama» está leyendo cuatro palabras de las cuales dos son sílabas sueltas de la serie que ya domina.\n\n«Mi» dice de quién es algo, y es fácil de mostrar: mi mano, mi mamá, mi mesa, señalando. Es posesivo y el niño ya lo usa cien veces al día sin saber cómo se llama. «Me» es más abstracto —dice que la acción cae sobre mí— y no vale la pena explicarlo: basta con que lo lea correctamente y con que la oración completa tenga sentido.\n\nUna advertencia ortográfica para más adelante: «mi» sin tilde es posesivo y «mí» con tilde es pronombre. No lo mencione ahora. A los cuatro años esa distinción no aporta nada y solo introduce una duda donde no hacía falta." },

{ id:"de-que-habla-la-oracion", label:"De qué habla la oración: quién ama a quién", level:3, lon:240, tier:"town", ab:2,
  view:"Una oración no es una fila de palabras: dice quién hace qué. Que el niño lo note es el primer paso de la comprensión lectora, y con «mi mamá me ama» se puede hacer notar en un minuto.\n\nTres preguntas bastan, en este orden. ¿De quién habla? —de mi mamá—. ¿Qué hace? —ama—. ¿A quién? —a mí—. Con eso el niño acaba de desarmar una oración en sujeto, verbo y objeto sin oír ninguna de esas tres palabras, y sin necesitarlas.\n\nEl ejercicio que consolida esto es cambiar una pieza y ver qué se rompe. «Mi papá me ama» cambia quién. «Mi mamá me mima» cambia qué hace. «Mi mamá ama» —sin el me— deja incompleta la idea y el niño lo nota, aunque no sepa decir por qué. Manipular la oración es la forma de descubrir que tiene partes.\n\nHay una versión de esto que conviene evitar: preguntar «¿te gustó?» o «¿qué sentiste?». Son preguntas de otro tipo y de otra edad. Aquí lo que se está entrenando es la relación entre lo que dice el papel y lo que ocurre en el mundo." },

{ id:"dibujar-lo-leido", label:"Dibujar lo que la oración dice, como prueba de que se entendió", level:3, lon:252, tier:"town", ab:3,
  view:"Un dibujo no se puede hacer sin haber entendido. Por eso dibujar lo leído es, además de una actividad que a los niños de esta edad les gusta, la prueba de comprensión más limpia que hay a los cuatro años, mucho mejor que preguntar si entendió —a lo cual todo niño contesta que sí.\n\nEl procedimiento: se lee la oración, se guarda el papel, se le da una hoja y se le pide que dibuje lo que dice. Un niño que dibuja a dos personas, una grande y una chica, juntas o abrazadas, entendió. Un niño que dibuja un dinosaurio no entendió, o no estaba escuchando, y en ninguno de los dos casos se le regaña: se vuelve a leer y se vuelve a intentar mañana.\n\nEl dibujo tiene además una función que la evaluación no tiene: se puede pegar. La oración escrita junto al dibujo del niño, en el refrigerador o en la puerta de su cuarto, convierte la lectura en algo que se muestra a las visitas. Eso importa más de lo que parece a esta edad.\n\nUna variante útil: que el adulto dibuje mal a propósito —la mamá lejos, de espaldas— y el niño corrija. Corregir exige comprender mejor que producir." },

{ id:"tarjetas-silabas", label:"El juego de tarjetas: mover sílabas con las manos", level:3, lon:270, tier:"town", ab:2,
  view:"Las tarjetas son el material central de este método y son casi gratis: cartulina, papel grueso, o cartones de caja recortados en rectángulos de unos ocho por cinco centímetros. Se escribe una sílaba por tarjeta, grande, en minúscula, con marcador negro sobre fondo claro. Nada más: sin dibujos, sin colores distintos por sílaba, sin adornos, porque todo eso le da al niño algo que reconocer que no es la letra.\n\nLo que hacen las tarjetas y no hace la página del libro es permitir mover. El niño toma «ma», la pone junto a otra «ma» y aparece mamá; las separa y desaparece. Componer y descomponer con las manos enseña la estructura de la palabra de una manera que mirar no enseña, y a los cuatro años la mano es un canal de aprendizaje mucho más ancho que el ojo.\n\nCuatro juegos que funcionan: señalar la que oyes; ordenar la serie completa; formar una palabra dictada; encontrar la intrusa entre cuatro. Dos minutos cada uno, no más.\n\nHaga dos juegos de tarjetas iguales. Se pierden, y perder una tarjeta a media sesión termina la sesión." },

{ id:"cuanto-y-cada-cuando", label:"Cuánto rato y cada cuándo: la repetición que sí fija", level:3, lon:288, tier:"town", ab:3,
  view:"La cantidad importa menos que la distribución, y esto está bien establecido: la misma cantidad total de práctica produce mucho más aprendizaje repartida en días distintos que concentrada en una sesión. El fenómeno se llama efecto de espaciamiento y es de los resultados más sólidos de la psicología del aprendizaje.\n\nTraducido a esta enseñanza: entre cinco y doce minutos diarios con un niño de cuatro años, todos los días o casi. Dos sesiones cortas separadas por horas rinden más que una sola del doble de tiempo. Y el repaso de lo viejo no debe abandonarse cuando parece dominado: una sílaba que se aprendió hace tres semanas todavía necesita aparecer de vez en cuando, cada vez más espaciada, para no perderse.\n\nUn esquema práctico de repaso: lo de hoy, todos los días. Lo de la semana pasada, dos veces por semana. Lo del mes pasado, una vez por semana. Eso se administra solo si guarda las tarjetas en tres montones y va moviéndolas.\n\nY el límite superior: cuando el niño empieza a fallar en cosas que ya sabía, la sesión pasó de su punto óptimo hace un rato. Pare." },

{ id:"confundir-m-y-n", label:"Confundir la m con la n, y por qué pasa", level:3, lon:310, tier:"town", ab:2,
  view:"Es la confusión más común de toda la etapa y tiene dos causas superpuestas, lo que explica su persistencia.\n\nVisualmente, m y n son la misma forma con distinto número de picos: tres contra dos. Para un niño que todavía no atiende a los detalles finos de la forma, son casi la misma mancha. Auditivamente, /m/ y /n/ son las dos consonantes nasales del español, ambas sonoras, ambas continuas; se diferencian solo en dónde se cierra el paso del aire —labios para la m, lengua contra el paladar para la n—. Son vecinas en los dos canales a la vez.\n\nLa prevención es de calendario: no enseñe la n cerca de la m. Meta dos o tres consonantes entre ellas, la p, la s, la l. La mayoría de los silabarios respeta esta separación.\n\nY cuando la confusión ya apareció, el remedio es el contraste explícito y físico. Diga mmmmm y nnnnn seguidas, exageradas, mostrando la boca: en la m los labios están cerrados y se ven; en la n están abiertos y se ve la lengua arriba. Que el niño se toque los labios en una y no en la otra. El par «mamá / nana», dicho despacio uno tras otro, hace visible la diferencia en cuatro segundos." },

{ id:"adivinar-en-vez-de-leer", label:"Adivinar por el dibujo en vez de leer las letras", level:3, lon:330, tier:"town", ab:3,
  view:"Este es el único hábito de la lista que hay que cortar en seco, y conviene entender por qué es distinto de los demás errores.\n\nLos otros errores son fallas de una habilidad en construcción y se corrigen practicando. Adivinar no es una falla: es una estrategia alternativa que funciona. El niño que mira el dibujo, o la primera letra, o se acuerda de qué decía esta página, produce la respuesta correcta sin descifrar, recibe la aprobación del adulto y aprende que esa estrategia sirve. Cuanto más se refuerza, más se instala, y llega un punto —hacia segundo o tercer grado, cuando los textos ya no traen dibujos— en que deja de funcionar y el niño se estrella.\n\nLas señales: responde demasiado rápido, sin mirar la palabra completa; acierta con ilustración y falla sin ella; dice una palabra que encaja en el sentido pero no es la que está escrita —«perro» donde dice «gato» junto a un dibujo de perro—.\n\nEl remedio es quitar todas las muletas a la vez: tapar el dibujo con la mano, escribir la palabra a mano en un papel en blanco, y usar de vez en cuando sílabas inventadas que no se pueden adivinar porque no significan nada." }

);
