{ id:"palabras-largas-primero", label:"Palabras largas primero, que se parten solas", level:2, lon:55, tier:"town", ab:3,
  view:"Contra la intuición, las palabras largas son más fáciles de segmentar que las cortas. Ma-ri-po-sa se parte sola en cuatro golpes evidentes; «sol» no se parte, y pedirle a un niño que cuente sus sílabas produce confusión pura.\n\nEmpiece entonces por lo largo: mariposa, elefante, computadora, refrigerador. Los nombres largos de la familia. Los nombres de dinosaurios, que a esta edad suelen ser los más largos que el niño conoce y los que dice con más gusto.\n\nLas palabras de una sílaba se dejan para el final, cuando la idea de contar golpes de voz ya esté firme.",
  kid:{ ore:"hierro", glyph:{t:"palmas",n:4}, say:"ma-ri-po-sa", ask:"Da una palmada por cada pedacito.", game:"contar", answer:4, xp:25 } },

{ id:"mi-nombre-en-palmadas", label:"El nombre del niño, partido en palmadas", level:2, lon:175, tier:"town", ab:3,
  view:"El nombre propio es la palabra más cargada de significado que existe para un niño, y por eso es el mejor material de todos.\n\nSe palmea su nombre, después el de mamá, el de papá, el de los hermanos, el del perro. Se compara quién tiene el nombre más largo y quién el más corto. Se busca quién empieza con el mismo sonido que quién.\n\nEste juego convierte el análisis de sonidos en una conversación sobre la propia familia, y el niño se involucra porque el contenido le importa, no porque le pidieron un ejercicio. Más adelante el nombre propio será además la primera palabra que reconozca escrita.",
  kid:{ ore:"oro", glyph:{t:"palmas",n:3}, say:"Palmea tu nombre", ask:"¿Cuántos pedacitos tiene tu nombre?", game:"contar", answer:null, free:true, xp:30 } },

{ id:"ma-en-todos-los-idiomas", label:"Ma es la primera sílaba en casi todos los idiomas del mundo", level:2, lon:190, tier:"town", ab:1,
  view:"Mamá, mama, mãe, māma, maman, mama. En idiomas sin ningún parentesco entre sí, la palabra para madre se parece, y la explicación más aceptada es puramente física: la sílaba ma es la más fácil de producir para un aparato fonador en desarrollo, así que aparece primero en el balbuceo de cualquier bebé, y los adultos interpretan ese balbuceo como el nombre de quien está más cerca.\n\nDicho de otro modo: cuando el silabario pone ma en la primera página no está enseñando nada nuevo. Está poniendo por escrito algo que el niño hace desde los seis meses.\n\nDecírselo convierte la primera lección en una historia sobre él mismo.",
  kid:{ ore:"diamante", glyph:{t:"silaba",s:"ma"}, say:"ma", ask:"Tu primera palabra fue «ma». Tócala.", game:"oir", xp:20 } },

{ id:"soplar-la-vela", label:"Soplar una vela sin apagarla", level:2, lon:295, tier:"town", ab:3,
  view:"Una vela encendida a treinta centímetros, y el reto es hacer bailar la llama sin apagarla. Después apagarla de un solo soplo. Después soplar tan suave que no se mueva nada.\n\nLo que se entrena es el control voluntario del aire, que es la materia prima de todos los sonidos del habla. Un niño que puede graduar su soplo puede después sostener una mmm larga, cortarla de golpe, o soltarla despacio, que es exactamente lo que el deslizamiento hacia la vocal va a pedirle.\n\nSin vela funciona igual: burbujas, un papelito sobre la mesa, un molinillo de papel, una pluma en la palma de la mano.",
  kid:{ ore:"hierro", glyph:{t:"icono",k:"soplo"}, say:"Sopla despacio", ask:"Sopla la vela sin apagarla.", game:"oir", xp:20 } },

{ id:"dos-que-riman", label:"Decir dos palabras que suenen igual al final", level:1, lon:35, tier:"point", ab:3, edge:["down"],
  view:"Sol y col. Pato y gato. Mano y piano. El adulto dice una y el niño busca otra, o dice dos y el niño decide si riman o no.\n\nLa rima obliga al niño a atender al sonido de la palabra y no a su significado, y ese cambio de foco es genuinamente difícil y es el primero que la lectura va a exigir todo el tiempo. Un niño que rima con soltura a los cuatro años tiene una ventaja medible al empezar a leer.\n\nDos minutos, en el coche o antes de dormir. Los disparates cuentan: si rima, vale, aunque no exista.",
  kid:{ ore:"esmeralda", glyph:{t:"icono",k:"rima"}, say:"pato... gato", ask:"¿Cuál rima con «pato»?", game:"elegir",
        opts:["gato","mesa","sol"], answer:"gato", xp:35 } },

{ id:"mariposa-cuatro", label:"Mariposa son cuatro palmadas", level:1, lon:60, tier:"point", ab:3, edge:["down"],
  view:"Se dice ma-ri-po-sa despacio, con una palmada por sílaba, y se cuentan: cuatro.\n\nEs el ejercicio más directo y más útil de toda la preparación, porque la sílaba es exactamente la unidad sobre la que va a trabajar el método silábico. Un niño que palmea bien está listo para el silabario; uno que después de varias semanas todavía no puede, necesita quedarse aquí más tiempo, y ese tiempo no es tiempo perdido.\n\nEmpiece por palabras largas. La versión difícil, para cuando lo anterior salga solo: decir cuántas sílabas tiene sin palmear, contando en la cabeza.",
  kid:{ ore:"diamante", glyph:{t:"palmas",n:4}, say:"ma-ri-po-sa", ask:"¿Cuántas palmadas? Toca el bloque una vez por cada una.", game:"contar", answer:4, xp:40 } },

{ id:"un-paso-por-silaba", label:"Un paso por sílaba, caminando por el pasillo", level:1, lon:75, tier:"point", ab:3, edge:["down"],
  view:"La misma segmentación, pero con el cuerpo entero: se camina diciendo la palabra y se da un paso por sílaba. Ma-ri-po-sa son cuatro pasos.\n\nFunciona mejor que las palmadas con niños a los que les cuesta, porque el paso es un movimiento grande, lento y difícil de hacer a destiempo, mientras que las manos se pueden mover en automático sin coordinar con la voz. Y porque a los cuatro años el cuerpo entero es un canal de aprendizaje más ancho que las manos solas.\n\nVariantes: saltar, subir escalones, avanzar una casilla de un tablero dibujado con gis.",
  kid:{ ore:"hierro", glyph:{t:"palmas",n:2}, say:"ma-má", ask:"Dos pasos: ma... má. Toca dos veces.", game:"contar", answer:2, xp:25 } },

{ id:"contar-a-toda-la-familia", label:"Contar las sílabas de todos los de la casa", level:1, lon:155, tier:"point", ab:3, edge:["down"],
  view:"Una ronda: cada quien dice su nombre y todos lo palmean juntos. Se anota el número al lado de cada nombre en una hoja.\n\nQueda una lista de la familia con una cifra al lado, que el niño puede consultar, mostrar a las visitas y volver a hacer semanas después para comprobar que ahora acierta más rápido. Es de los pocos registros de avance que un niño de esta edad puede leer sin saber leer.\n\nEs además la manera más fácil de involucrar a hermanos mayores, que suelen disfrutar mucho el papel de examinadores.",
  kid:{ ore:"oro", glyph:{t:"palmas",n:2}, say:"ma-má, pa-pá", ask:"Palmea el nombre de mamá.", game:"contar", answer:2, xp:30 } },

{ id:"mi-nombre-mas-largo", label:"Quién tiene el nombre más largo de la casa", level:1, lon:180, tier:"point", ab:3, edge:["down"],
  view:"Se palmean todos los nombres y se ordenan del más corto al más largo. Gana el más largo, que en muchas familias es el de la abuela o el del dinosaurio favorito.\n\nComparar longitudes obliga a sostener dos conteos a la vez y a decidir cuál es mayor, que es un paso por encima de contar uno solo. Y convierte el ejercicio en competencia, que a los cuatro años multiplica el número de repeticiones sin que nadie las pida.\n\nSe puede dejar por escrito: una tira de papel por nombre, tan larga como sílabas tenga, pegadas una junto a otra en la pared.",
  kid:{ ore:"hierro", glyph:{t:"palmas",n:3}, say:"a-bue-la", ask:"«Abuela»: toca una vez por cada pedacito.", game:"contar", answer:3, xp:25 } },

{ id:"mama-en-otro-idioma", label:"Cómo se dice mamá en otros idiomas", level:1, lon:195, tier:"point", ab:1, edge:["down"],
  view:"Mama en inglés, maman en francés, māma en chino, mãe en portugués, mama en swahili. Se dicen en voz alta, una tras otra, y el niño nota que se parecen.\n\nNo hay objetivo lingüístico aquí: el objetivo es que el niño oiga la misma sílaba repetida en boca de todo el mundo y entienda que ma es algo especial. Eso carga de importancia la primera sílaba que va a aprender a leer, y a esta edad la importancia percibida es lo que sostiene la atención.\n\nSi hay alguien en la familia que habla otra lengua, pídasela a esa persona. Mejor todavía si es una lengua originaria de México.",
  kid:{ ore:"esmeralda", glyph:{t:"silaba",s:"ma"}, say:"mama, maman, mãe", ask:"Todas empiezan igual. ¿Con qué?", game:"elegir",
        opts:["ma","pa","sa"], answer:"ma", xp:35 } },

{ id:"veo-veo-mmm", label:"Veo veo una cosita que empieza con mmm", level:1, lon:275, tier:"point", ab:2, edge:["down"],
  view:"El juego clásico, con un cambio que importa: se dice el sonido, no el nombre de la letra. «Empieza con mmm», nunca «empieza con eme».\n\nEsa diferencia no es un capricho. El nombre de la letra contiene una vocal que estorba justo en el momento de unir sonidos: un niño que aprendió «eme» tiende a leer «eme-a» y a producir «ema», y sale de ese callejón con dificultad. Durante las primeras semanas conviene no nombrar ninguna letra.\n\nEl niño busca: mesa, mano, mochila, muñeco, mamá. Funciona en el coche, en la fila y en la sala de espera, y no necesita nada.",
  kid:{ ore:"diamante", glyph:{t:"icono",k:"lupa"}, say:"Veo veo una cosita que empieza con mmm", ask:"¿Cuál empieza con mmm?", game:"elegir",
        opts:["mesa","sol","pan"], answer:"mesa", xp:40 } },

{ id:"apagar-la-vela", label:"Apagarla de un solo soplo", level:1, lon:300, tier:"point", ab:3, edge:["down"],
  view:"Después de haber aprendido a hacerla bailar sin apagarla, el reto opuesto: apagarla de un golpe seco.\n\nSoplo largo y soplo corto son las dos formas del aire que el habla necesita, y el contraste entre ellas prepara una distinción que aparecerá pronto: las consonantes que se pueden alargar —m, s, l, n— y las que salen de golpe y no se dejan sostener —p, t, k—. La m es del primer grupo, y por eso es la primera.\n\nSin vela: apagar un cerillo, tumbar una torre de papelitos, mover un carrito de papel de un soplo.",
  kid:{ ore:"hierro", glyph:{t:"icono",k:"soplo"}, say:"¡Fuu! De un solo soplo", ask:"Sopla fuerte una vez.", game:"oir", xp:20 } },

{ id:"mano-en-la-garganta", label:"La mano en la garganta: cuáles vibran y cuáles no", level:1, lon:315, tier:"point", ab:2, edge:["down"],
  view:"El niño se pone la mano en la garganta y dice mmmmmm: vibra. Después ssssss: no vibra, solo sale aire. Se alterna varias veces.\n\nEs la prueba física más clara que existe de que los sonidos se distinguen por lo que hace el cuerpo y no solo por cómo suenan, y es la misma prueba que servirá después para separar la s de la z, la p de la b, o la f de la v.\n\nCon la m hay además una segunda prueba, la de la nariz: se tapa suavemente mientras el niño zumba y el sonido se corta de golpe. A esta edad las dos cosas parecen magia, y esa impresión es exactamente lo que hace que se recuerden.",
  kid:{ ore:"esmeralda", glyph:{t:"icono",k:"vibra"}, say:"mmmmm... ssssss", ask:"¿Cuál hace cosquillas en la garganta?", game:"elegir",
        opts:["mmm","sss"], answer:"mmm", xp:35 } }

);
/* ============ PALABRAS — nuevas posiciones ============ */
WORLDS.palabras.push(

{ id:"dos-tarjetas-una-palabra", label:"Dos tarjetas separadas que se empujan hasta juntarse", level:2, lon:55, tier:"town", ab:1,
  view:"Dos tarjetas con «ma», separadas veinte centímetros. El niño lee una, lee la otra, y el adulto las va acercando mientras él repite. Cuando se tocan, dice mamá.\n\nEl gesto de juntar las tarjetas y el gesto de juntar los sonidos son el mismo gesto, y el niño lo entiende sin explicación. Esa correspondencia entre lo que pasa en la mesa y lo que pasa en la boca es la razón de usar tarjetas móviles y no una página impresa.\n\nDespués al revés: se parte la palabra y se separan las tarjetas. Componer y descomponer, hasta que sea juego.",
  kid:{ ore:"diamante", glyph:{t:"palabra",w:"mamá"}, say:"ma... ma... ¡mamá!", ask:"Junta las dos para hacer «mamá».", game:"formar",
        parts:["ma","ma"], distract:["me","mo"], xp:45 } },

{ id:"silaba-escondida", label:"Quitar una sílaba a escondidas y adivinar cuál falta", level:2, lon:70, tier:"town", ab:1,
  view:"Se arma una palabra con tarjetas, el niño cierra los ojos, el adulto quita una sílaba y esconde el hueco. El niño abre los ojos y dice cuál falta.\n\nExige tener la palabra completa en la cabeza y compararla con lo que ve, que es una operación bastante más exigente que leer, y por eso conviene dejarla para cuando la palabra ya salga sola.\n\nCon «mamá» es fácil porque las dos piezas son iguales. Se pone interesante con tres sílabas, cuando haya material: pa-le-ta, mo-ne-da.",
  kid:{ ore:"esmeralda", glyph:{t:"palabra",w:"ma_á"}, say:"¿Cuál falta?", ask:"Falta un pedacito. ¿Cuál es?", game:"elegir",
        opts:["ma","mi","mu"], answer:"ma", xp:40 } },

{ id:"mesa-mano-mio", label:"Mesa, mano, mío: palabras que el niño usa todos los días", level:2, lon:175, tier:"town", ab:2,
  view:"La recompensa de descifrar es el significado, así que la palabra tiene que estar ya en la boca del niño. Mesa, mano, mío, mamá, moto, mula si sabe qué es una mula.\n\nMuchas listas de silabario vienen de otra época y contienen palabras que en 1890 eran cotidianas y hoy no lo son para un niño de la Ciudad de México. Sustitúyalas sin culpa por otras del mismo nivel de dificultad: la regla del método es solo usar letras ya enseñadas, no usar exactamente esas palabras.\n\nSi el niño descifra bien y no siente nada, revise la lista antes de revisar al niño.",
  kid:{ ore:"oro", glyph:{t:"palabra",w:"mesa"}, say:"mesa", ask:"Toca la palabra «mesa».", game:"elegir",
        opts:["mesa","mano","mamá"], answer:"mesa", xp:35 } },

{ id:"explicar-antes-de-leer", label:"Explicar la palabra antes de que la lea, nunca después", level:2, lon:190, tier:"town", ab:3,
  view:"Si aparece una palabra que el niño no conoce y vale la pena, dígale qué significa antes de pedirle que la descifre.\n\nEl orden importa. Descifrar una palabra que uno acaba de aprender oralmente funciona: el esfuerzo se paga con un reconocimiento. Descifrar una que sigue sin significar nada no se paga con nada, y el niño aprende, sin que nadie se lo diga, que descifrar es un trabajo estéril.\n\nA los cuatro años eso se nota rápido: el niño que descifra sin recompensa deja de intentar en unas semanas y empieza a adivinar.",
  kid:{ ore:"piedra", glyph:{t:"palabra",w:"mula"}, say:"Una mula es un animal, como un caballo pequeño", ask:"Escucha qué es, y luego tócala.", game:"oir", xp:20 } },

{ id:"medio-segundo", label:"Mostrar la palabra medio segundo y taparla", level:2, lon:295, tier:"town", ab:2,
  view:"Se enseña la tarjeta un instante y se tapa. Si el niño la dijo, la reconoció entera; si necesita mirarla un rato, todavía la está armando pieza por pieza.\n\nNo es una prueba que haya que pasar, es una manera de saber en qué punto está. Las primeras palabras que se reconocen de un vistazo suelen ser mamá y el propio nombre, y desde ahí se extiende.\n\nHágalo como juego de reflejos, rápido y riéndose, no como examen. Y no le pida velocidad al niño: la velocidad llega sola con la frecuencia, y pedirla produce lectura atropellada.",
  kid:{ ore:"diamante", glyph:{t:"flash",w:"mamá"}, say:"¡Rápido! ¿Qué decía?", ask:"Mira rápido y dime qué decía.", game:"elegir",
        opts:["mamá","mesa","mimo"], answer:"mamá", xp:45 } },

{ id:"misma-palabra-otro-papel", label:"La misma palabra escrita en otro papel y otro color", level:2, lon:310, tier:"town", ab:2,
  view:"Si el niño acierta con la tarjeta de siempre y falla con la misma palabra escrita a mano en una hoja distinta, lo que reconocía era el objeto y no el signo.\n\nEs el error más silencioso de esta etapa: la mancha de café en la esquina, el doblez, el orden del montón. Todo eso sirve de pista y ninguna de esas pistas es lectura.\n\nLa solución es variar el soporte y repetir el contenido: pocas palabras, muchas veces, en muchos papeles distintos. Lo contrario —muchas palabras, cada una dos veces— produce mucho menos.",
  kid:{ ore:"oro", glyph:{t:"palabra",w:"mamá"}, say:"mamá", ask:"Es la misma palabra, en otro color. Tócala.", game:"elegir",
        opts:["mamá","mano","mimo"], answer:"mamá", xp:35 } },

{ id:"papelito-en-el-espejo", label:"Un papelito con «mamá» pegado en el espejo del baño", level:1, lon:35, tier:"point", ab:1, edge:["down"],
  view:"Cinco papelitos con la palabra escrita a mano, grande y clara, pegados con cinta en cinco lugares que el niño usa todos los días: el espejo, el refrigerador, la puerta de su cuarto, la mesa, su mochila.\n\nDurante una semana se topa con la palabra sin que nadie se la ponga enfrente. Esa exposición incidental y repetida es la que convierte el descifrado en reconocimiento inmediato, y no cuesta nada ni ocupa tiempo de sesión.\n\nA la semana se cambian por otra palabra y los viejos se guardan en la carpeta.",
  kid:{ ore:"esmeralda", glyph:{t:"palabra",w:"mamá"}, say:"mamá", ask:"La ves todos los días. ¿Qué dice?", game:"elegir",
        opts:["mamá","papá","mesa"], answer:"mamá", xp:40 } },

{ id:"ma-mas-ma", label:"ma más ma: la suma que sí funciona", level:1, lon:60, tier:"point", ab:0, edge:["down"],
  view:"Dos piezas iguales que dan una palabra. Es la única suma que a esta altura sale limpia, porque no hay nada nuevo que aprender: solo hay que hacer algo nuevo con lo que ya se tiene.\n\nPor eso «mamá» es la primera palabra de casi todos los silabarios y no solo por razones afectivas. Un niño que domina «ma» puede leerla sin que se le enseñe una sola letra más, y el salto que practica —unir dos sílabas en una palabra— es el que va a repetir el resto del año.\n\nSe trabaja hasta que salga de un golpe y no en dos tiempos.",
  kid:{ ore:"diamante", glyph:{t:"palabra",w:"mamá"}, say:"ma más ma es mamá", ask:"Toca «ma» dos veces.", game:"formar",
        parts:["ma","ma"], distract:["mi"], xp:45 } },

{ id:"quitar-una-silaba", label:"Quitar «ma» a mamá y ver qué queda", level:1, lon:75, tier:"point", ab:1, edge:["down"],
  view:"Se arma mamá con dos tarjetas y se retira una. Queda ma. Se pregunta qué dice ahora.\n\nDescomponer es más difícil que componer y llega después, pero es la prueba de que el niño entiende que la palabra tiene partes y no es una mancha entera. Un niño que solo puede juntar memorizó un resultado; uno que puede separar entendió una estructura.\n\nCon palabras de tres sílabas el juego se pone interesante de verdad, pero eso pide una segunda y una tercera consonante.",
  kid:{ ore:"oro", glyph:{t:"palabra",w:"ma"}, say:"Le quitamos una. ¿Qué queda?", ask:"Quitamos un pedacito. ¿Qué dice ahora?", game:"elegir",
        opts:["ma","mamá","ama"], answer:"ma", xp:35 } },

{ id:"diez-en-la-pared", label:"Las diez palabras que ya lee, colgadas en la pared", level:1, lon:155, tier:"point", ab:1, edge:["down"],
  view:"Una hoja con las palabras que el niño ya lee, escritas en letra grande, colgada donde él la vea.\n\nSirve para tres cosas a la vez. Es material de repaso rápido, dos minutos leyéndola entera. Es un registro visible del avance, que es dificilísimo de percibir de otra manera a esta edad. Y es un objeto que puede mostrarle a quien llegue de visita.\n\nCada palabra nueva se agrega con ceremonia. La lista solo crece, nunca se borra nada de ella.",
  kid:{ ore:"esmeralda", glyph:{t:"renglon",s:["ma","me","mi","mo","mu"]}, say:"Toca todas las que ya sabes", ask:"Toca las cinco, una por una.", game:"ordenar",
        opts:["ma","me","mi","mo","mu"], xp:40 } },

{ id:"solo-lo-que-conoce", label:"Solo palabras que el niño ya sabe decir", level:1, lon:180, tier:"point", ab:2, edge:["down"],
  view:"Antes de poner una palabra en una tarjeta, pregúntese si el niño la usa. Si no la usa, descifrarla no le devuelve nada.\n\nLa lista buena para un niño de la Ciudad de México con solo la m: mamá, mimo, memo si alguien se llama así, mío, mía, ama, amo. Con la segunda consonante se abre de golpe: mesa, mano, mapa, mole, malo, luna.\n\nRevise las listas del silabario y sustituya sin culpa. La regla del método es no usar letras que no se hayan enseñado; no dice cuáles palabras.",
  kid:{ ore:"hierro", glyph:{t:"palabra",w:"mano"}, say:"mano", ask:"Toca la palabra que dice «mano».", game:"elegir",
        opts:["mano","mesa","mamá"], answer:"mano", xp:30 } },

{ id:"decirla-antes", label:"Decir la palabra en voz alta antes de mostrarla escrita", level:1, lon:195, tier:"point", ab:3, edge:["down"],
  view:"Se dice la palabra, se conversa un segundo sobre ella —qué es, dónde hay una, quién tiene una— y después se muestra escrita.\n\nEse orden garantiza que cuando el niño la descifre encuentre algo al otro lado. Es la diferencia entre resolver un ejercicio y leer.\n\nEl orden contrario —mostrar, descifrar, explicar— también enseña a descifrar, pero enseña además que descifrar y entender son dos actividades separadas, y esa separación cuesta años de deshacer.",
  kid:{ ore:"piedra", glyph:{t:"palabra",w:"moto"}, say:"Una moto hace ruido y tiene dos ruedas. Mira: moto.", ask:"Escucha primero, y luego tócala.", game:"oir", xp:20 } },

{ id:"dos-semanas-despues", label:"La misma lista, dos semanas después", level:1, lon:275, tier:"point", ab:2, edge:["down"],
  view:"Se lee la lista de diez palabras y el adulto anota mentalmente cuánto tardó. Dos semanas más tarde, la misma lista, y se compara.\n\nLa velocidad es mejor indicador que la exactitud a esta edad, porque en español la exactitud llega pronto y después parece estancarse mientras la fluidez sigue mejorando por debajo. Un niño que tarda la mitad en la misma lista avanzó, aunque no lea ninguna palabra nueva.\n\nSin cronómetro visible y sin decirle que se está midiendo. Pedir velocidad produce adivinación.",
  kid:{ ore:"oro", glyph:{t:"renglon",s:["ma","me","mi","mo","mu"]}, say:"¿Puedes decirlas todas?", ask:"Toca las cinco lo más rápido que puedas.", game:"ordenar",
        opts:["ma","me","mi","mo","mu"], xp:35 } },

{ id:"flash-de-medio-segundo", label:"El juego del parpadeo", level:1, lon:300, tier:"point", ab:2, edge:["down"],
  view:"Se enseña la tarjeta un instante, se tapa, y el niño dice qué decía. Rápido, riéndose, como juego de reflejos.\n\nEl objetivo no es medir sino empujar hacia el reconocimiento global. Si la palabra solo se puede armar pieza por pieza, medio segundo no alcanza y el niño lo nota; si ya se reconoce entera, alcanza de sobra.\n\nUse pocas palabras y repítalas mucho. Cinco palabras vistas veinte veces cada una producen mucho más que veinte vistas cinco veces.",
  kid:{ ore:"diamante", glyph:{t:"flash",w:"mimo"}, say:"¡Rápido!", ask:"Mira rápido. ¿Qué decía?", game:"elegir",
        opts:["mimo","mamá","mula"], answer:"mimo", xp:45 } },

{ id:"escrita-a-mano", label:"La misma palabra, escrita a mano por el adulto", level:1, lon:315, tier:"point", ab:2, edge:["down"],
  view:"Todo lo que el niño lea impreso conviene que también lo lea escrito a mano, en papel liso, con la letra del adulto.\n\nEs una prueba y a la vez una ampliación. Prueba, porque si la lectura se cae al cambiar el soporte, lo que había era reconocimiento de un objeto. Ampliación, porque el niño va a encontrar letra manuscrita todos los días —notas, recados, la lista del súper— y conviene que no le resulte ajena.\n\nEscriba en minúscula de imprenta, no en cursiva. La cursiva llega mucho después y no hace falta ahora.",
  kid:{ ore:"hierro", glyph:{t:"palabra",w:"mamá"}, say:"mamá", ask:"Escrita a mano, pero dice lo mismo. Tócala.", game:"elegir",
        opts:["mamá","mesa"], answer:"mamá", xp:30 } }

);

/* ============ ORACIÓN — nuevas posiciones ============ */
WORLDS.oracion.push(

{ id:"dedo-en-el-hueco", label:"Poner el dedo en el hueco entre dos palabras", level:2, lon:55, tier:"town", ab:2,
  view:"Se escribe la oración con espacios exagerados, del ancho de un dedo, y se pone literalmente el dedo del niño en cada hueco. Ahí termina una palabra y empieza otra.\n\nEl espacio es una convención de la escritura que no existe en el habla: nadie hace pausa entre «mi» y «mamá». Un niño que no lo ha entendido lee la línea como un chorro, o se detiene en lugares arbitrarios.\n\nDespués se señala cada palabra completa mientras el niño la lee, con una pausa marcada en el hueco.",
  kid:{ ore:"oro", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi... mamá... me... ama", ask:"Toca los huecos entre las palabras.", game:"contar", answer:3, xp:35 } },

{ id:"contar-las-palabras", label:"Un aplauso por palabra: cuatro para la oración entera", level:2, lon:70, tier:"town", ab:2,
  view:"«Mi mamá me ama» son cuatro palabras y ocho sílabas, y confundir las dos cuentas es completamente normal al principio.\n\nSe aclara haciendo las dos seguidas y comparando: primero un aplauso por palabra, cuatro; después un aplauso por sílaba, ocho. El niño ve que la misma frase se puede partir de dos maneras distintas, y eso es información real sobre cómo funciona el idioma.\n\nNo lo explique con nombres. Basta con hacer las dos cuentas y dejar que note la diferencia.",
  kid:{ ore:"esmeralda", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi · mamá · me · ama", ask:"Un toque por cada palabra.", game:"contar", answer:4, xp:40 } },

{ id:"de-quien-que-a-quien", label:"Tres preguntas: de quién, qué hace, a quién", level:2, lon:175, tier:"town", ab:2,
  view:"¿De quién habla? De mi mamá. ¿Qué hace? Ama. ¿A quién? A mí.\n\nCon eso el niño acaba de desarmar una oración en sujeto, verbo y objeto sin oír ninguna de las tres palabras y sin necesitarlas. Quince segundos, en tono de conversación.\n\nAl principio contestará repitiendo la frase, y eso ya cuenta. La paráfrasis —«que me quiere»— llega después, y ese es el momento en que empieza la comprensión lectora de verdad. Una pregunta por lectura; tres seguidas apagan a cualquier niño de cuatro años.",
  kid:{ ore:"diamante", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"¿Quién te ama?", ask:"¿De quién habla la frase?", game:"elegir",
        opts:["mi mamá","mi moto","mi mano"], answer:"mi mamá", xp:45 } },

{ id:"contarlo-con-sus-palabras", label:"Que lo cuente con sus propias palabras", level:2, lon:190, tier:"town", ab:3,
  view:"Después de leer, la pregunta abierta: ¿qué dice ahí?\n\nCuando el niño contesta «que me quiere» en vez de repetir la frase, acaba de hacer la operación central de la comprensión lectora: decir con sus palabras lo que el papel dice con las suyas. Ese momento merece más celebración que la pronunciación correcta, y en general recibe menos.\n\nSi solo repite, no insista. Repetir es el escalón anterior y llega solo a las pocas semanas.",
  kid:{ ore:"piedra", glyph:{t:"icono",k:"habla"}, say:"¿Qué dice ahí?", ask:"Cuéntame con tus palabras.", game:"oir", xp:20 } },

{ id:"leerla-por-telefono", label:"Leérsela a la abuela por teléfono", level:2, lon:295, tier:"town", ab:1,
  view:"Por teléfono no hay dibujo, no hay tarjeta conocida y no hay nadie soplando la primera sílaba. Solo la voz del niño y alguien del otro lado que se emociona.\n\nEs a la vez la prueba más limpia y la recompensa más grande. Y tiene una ventaja sobre la lectura presencial: el que escucha no puede ver el papel, así que la lectura tiene que ser completa para que se entienda.\n\nAvise antes a quien va a recibir la llamada. La reacción del otro lado es la mitad del ejercicio.",
  kid:{ ore:"oro", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi mamá me ama", ask:"Léesela a alguien. Toca cuando lo hayas hecho.", game:"oir", xp:50 } },

{ id:"sin-dibujo-sin-ayuda", label:"Papel liso, sin dibujo y sin que nadie sople", level:2, lon:310, tier:"town", ab:2,
  view:"Las condiciones importan más que la lectura misma. Papel en blanco, letra del adulto, sin ilustración, sin la tarjeta de siempre, y sin que nadie adelante la primera sílaba por impaciencia.\n\nSi en esas condiciones sale «mi mamá me ama», salió de verdad. Si se cae, lo que había era otra cosa, y descubrirlo ahora ahorra meses.\n\nSi se cae no se le dice al niño que se cayó. Se vuelve unos pasos atrás: más tarjetas sin dibujo, más deslizamiento, menos ilustración durante el descifrado.",
  kid:{ ore:"diamante", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi mamá me ama", ask:"Sin ayuda. ¿Qué dice?", game:"ordenar",
        opts:["mi","mamá","me","ama"], xp:55 } },

{ id:"copiarla-con-crayon", label:"Copiarla con crayón grueso en una hoja grande", level:1, lon:35, tier:"point", ab:2, edge:["down"],
  view:"Las letras saldrán disparejas, del tamaño equivocado y fuera del renglón. Nada de eso importa ahora.\n\nEscribir refuerza el reconocimiento de manera medible, porque la mano obliga a mirar cada letra en orden y el ojo puede saltárselas. Y produce un objeto que el niño hizo, que se cuelga y se muestra.\n\nCorrija solo si se saltó una letra o cambió el orden, señalando el modelo. La forma no se corrige a los cuatro años.",
  kid:{ ore:"esmeralda", glyph:{t:"letra",ch:"m"}, say:"Copia la eme", ask:"Traza la eme con el dedo.", game:"trazar", xp:40 } },

{ id:"un-dedo-de-espacio", label:"Un dedo de ancho entre palabra y palabra", level:1, lon:60, tier:"point", ab:2, edge:["down"],
  view:"Cuando el niño empiece a escribir la oración, el dedo sirve de regla: se apoya después de cada palabra y la siguiente empieza donde termina el dedo.\n\nEs la manera estándar de enseñar el espaciado y funciona porque convierte una convención invisible en una medida física que el niño puede aplicar solo.\n\nAl leer, el mismo dedo hace el trabajo inverso: se mete en el hueco para mostrar dónde termina cada palabra.",
  kid:{ ore:"hierro", glyph:{t:"oracion",t2:"mi mamá"}, say:"mi... mamá", ask:"¿Cuántos huecos hay?", game:"contar", answer:1, xp:25 } },

{ id:"cuatro-aplausos", label:"Cuatro aplausos para «mi mamá me ama»", level:1, lon:75, tier:"point", ab:2, edge:["down"],
  view:"Un aplauso por palabra, y son cuatro. Después un aplauso por sílaba, y son ocho.\n\nHacer las dos cuentas seguidas es la forma más rápida de aclarar una confusión que aparece siempre. El niño ve que la misma frase se parte de dos maneras y que las dos son correctas, cada una para una cosa distinta.\n\nSin explicación y sin nombres. Solo las dos cuentas, seguidas, varias veces.",
  kid:{ ore:"oro", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi · mamá · me · ama", ask:"Aplaude una vez por palabra.", game:"contar", answer:4, xp:35 } },

{ id:"dibujo-en-la-pared", label:"El dibujo y la oración, pegados donde la casa los vea", level:1, lon:155, tier:"point", ab:3, edge:["down"],
  view:"El dibujo que hizo el niño con la oración escrita debajo, en la puerta de su cuarto o en el refrigerador.\n\nDos efectos reales. Lo lee de pasada muchas veces al día sin que nadie se lo pida, y esa repetición incidental es la más barata que existe. Y lo ve colgado donde las visitas lo ven, lo cual cambia lo que la actividad significa para él: leer deja de ser una tarea y pasa a ser algo que uno sabe hacer.\n\nGuarde los anteriores en una carpeta. Enseñarle en marzo lo de enero es la única forma de que perciba que avanzó.",
  kid:{ ore:"esmeralda", glyph:{t:"icono",k:"dibujo"}, say:"Dibuja lo que dice la frase", ask:"¿Quién sale en tu dibujo?", game:"elegir",
        opts:["mi mamá y yo","un dinosaurio"], answer:"mi mamá y yo", xp:40 } },

{ id:"quien-te-ama", label:"«¿Y quién te ama a ti?»", level:1, lon:180, tier:"point", ab:2, edge:["down"],
  view:"La pregunta después de leer, en tono de conversación y no de examen. El niño contesta señalando o diciendo un nombre.\n\nEs la manera más corta de comprobar que la frase salió del papel y llegó al mundo. Un niño que lee correctamente y no puede contestar todavía está descifrando sin comprender, lo cual es normal las primeras semanas y se resuelve con automatización, no con explicaciones.\n\nDespués se puede escribir el nombre que contestó y armar la frase con él.",
  kid:{ ore:"diamante", glyph:{t:"icono",k:"corazon"}, say:"¿Y quién te ama a ti?", ask:"¿Quién te ama?", game:"elegir",
        opts:["mi mamá","mi moto"], answer:"mi mamá", xp:45 } },

{ id:"dilo-tu", label:"«Ahora dilo tú, con tus palabras»", level:1, lon:195, tier:"point", ab:3, edge:["down"],
  view:"Después de leer, se le pide que cuente lo que dice sin volver a mirar el papel.\n\nRepetir la frase textualmente es el primer escalón y ya cuenta. Decir «que me quiere» es el segundo, y es comprensión lectora de verdad. El paso entre uno y otro tarda semanas y llega solo si se pregunta a menudo.\n\nUna pregunta por lectura, no tres. Y si contesta con un disparate, se vuelve a leer y se intenta mañana.",
  kid:{ ore:"piedra", glyph:{t:"icono",k:"habla"}, say:"Ahora dilo tú", ask:"Dilo con tus palabras.", game:"oir", xp:20 } },

{ id:"oirse-en-la-grabacion", label:"Oírse a sí mismo leyendo", level:1, lon:275, tier:"point", ab:3, edge:["down"],
  view:"Se graba al niño leyendo la oración con el teléfono y se escucha juntos.\n\nA esta edad oírse fascina, y el efecto práctico es que quiere repetir la grabación varias veces para que salga mejor, lo cual son cinco lecturas más que nadie tuvo que pedir.\n\nGuarde las grabaciones. Poner en marzo la de enero es la demostración más contundente de avance que existe, y funciona igual de bien con los adultos de la casa.",
  kid:{ ore:"oro", glyph:{t:"icono",k:"voz"}, say:"Grábate leyendo", ask:"Escúchate. ¿Se entendió todo?", game:"oir", xp:30 } },

{ id:"llamar-a-la-abuela", label:"Llamar por teléfono solo para leerle", level:1, lon:300, tier:"point", ab:1, edge:["down"],
  view:"Una llamada cuyo único propósito es que el niño lea cuatro palabras. Avise antes a quien contesta.\n\nSin dibujo, sin tarjeta, sin apoyo visual del otro lado: la lectura tiene que ser completa para que se entienda, y eso la vuelve una prueba real. Pero lo importante no es la prueba: es que alguien a quien el niño quiere se emocione al otro lado del teléfono.\n\nA los cuatro años leer es una habilidad privada hasta que alguien la ve. Cuando alguien la ve, se convierte en identidad.",
  kid:{ ore:"diamante", glyph:{t:"icono",k:"telefono"}, say:"mi mamá me ama", ask:"Léesela por teléfono a alguien.", game:"oir", xp:55 } },

{ id:"papel-liso", label:"Papel liso, sin nada más en la hoja", level:1, lon:315, tier:"point", ab:2, edge:["down"],
  view:"Una hoja en blanco con la oración escrita a mano y nada más. Sin dibujo, sin margen de color, sin la ilustración del silabario.\n\nEs la condición mínima de una lectura honesta a esta edad, porque todo lo demás que haya en la hoja funciona como pista. La ilustración es la muleta más común y la más difícil de ver, precisamente porque parece ayuda.\n\nLa ilustración se mira antes de leer o después de leer, nunca durante.",
  kid:{ ore:"hierro", glyph:{t:"oracion",t2:"mi mamá me ama"}, say:"mi mamá me ama", ask:"Sin dibujos. ¿Qué dice?", game:"ordenar",
        opts:["mi","mamá","me","ama"], xp:45 } }

);

/* ============ LECTOR — nuevas posiciones ============ */
WORLDS.lector.push(

{ id:"barajar-y-cambiar-papel", label:"Barajar las tarjetas y cambiar el papel", level:2, lon:55, tier:"town", ab:2,
  view:"Dos pruebas que toman treinta segundos cada una. Barajar: si acierta en orden y falla en desorden, memorizó una secuencia. Cambiar el papel: si acierta con la tarjeta de siempre y falla con la misma sílaba escrita a mano en otra hoja, reconocía un objeto.\n\nHaga una por semana, sin anunciarla y sin solemnidad. No sirven para calificar al niño sino para saber si el método está funcionando, y si falla, el que ajusta es el adulto.\n\nLa versión más exigente de todas es la sílaba inventada, que no se puede recordar.",
  kid:{ ore:"diamante", glyph:{t:"silaba",s:"?"}, say:"En desorden ahora", ask:"Toca la que escuchas.", game:"elegir",
        opts:["mu","ma","mi","me","mo"], rounds:5, xp:50 } },

{ id:"del-silabario-al-libro", label:"El día que el silabario deja de ser lo principal", level:2, lon:70, tier:"town", ab:2,
  view:"Cuando el niño puede descifrar palabras nuevas con las letras que conoce, el silabario pasa de material principal a material de referencia.\n\nLo que hace falta entonces es volumen: textos fáciles, cortos, con las letras ya vistas, y muchos. La transición conviene hacerla gradual —unos días con las dos cosas— y no de golpe.\n\nLa señal de que se soltó demasiado pronto es que el niño empiece a adivinar otra vez. Si eso pasa, vuelva a material controlado unas semanas, sin dramatismo y sin comentarlo.",
  kid:{ ore:"oro", glyph:{t:"icono",k:"libro"}, say:"Ahora vamos a leer un librito", ask:"¿Ya puedes leer solo? Toca el libro.", game:"oir", xp:30 } },

{ id:"una-familia-por-vez", label:"Las trabadas se enseñan por familias, no sueltas", level:2, lon:175, tier:"town", ab:3,
  view:"bl y br juntas. Después pl y pr. Después cl y cr. Y así, porque comparten la estructura y aprender una facilita la otra.\n\nLlegan bien entrado el segundo año, cuando todas las consonantes simples estén dominadas. Antes de eso son la causa más frecuente de estancamiento, porque entre las dos consonantes no hay vocal que las separe y percibir esa frontera es duro incluso para un adulto que nunca lo pensó.\n\nSi un niño se traba sistemáticamente en ellas, casi siempre la respuesta correcta es volver atrás.",
  kid:{ ore:"piedra", glyph:{t:"silaba",s:"bra"}, say:"bra", ask:"Esta es difícil. Escúchala.", game:"oir", xp:20 } },

{ id:"volver-atras-sin-drama", label:"Volver atrás cuando algo se traba", level:2, lon:190, tier:"town", ab:3,
  view:"Si el niño se estanca, la respuesta casi siempre es retroceder, no insistir.\n\nRetroceder significa material más fácil durante unas semanas: sílabas que ya domina, palabras que ya lee, textos por debajo de su límite. Suena a perder tiempo y es lo contrario: un niño que practica en terreno seguro automatiza, y la automatización es lo que faltaba.\n\nY hágalo sin comentarlo. Un niño que percibe que retrocedió porque falló aprende algo distinto de lo que se quería enseñar.",
  kid:{ ore:"hierro", glyph:{t:"silaba",s:"ma"}, say:"Volvemos a lo fácil", ask:"Esta ya te la sabes. Tócala.", game:"oir", xp:20 } },

{ id:"hecho-en-casa", label:"El librito hecho en casa, con sus propios dibujos", level:2, lon:270, tier:"town", ab:3,
  view:"Hojas dobladas y grapadas, una frase por página escrita por el adulto sobre cosas del niño, y los dibujos hechos por él.\n\nSuele funcionar mejor que cualquier libro comprado en esta etapa, por tres razones: usa solo las letras que él conoce, habla de él, y lo hizo él. Se lee entero en dos minutos y lo puede leer solo desde el primer día.\n\nLos libros de imágenes bonitos y complejos siguen siendo importantes, pero son para que se los lean, no para que los lea.",
  kid:{ ore:"esmeralda", glyph:{t:"icono",k:"libro"}, say:"Tu propio librito", ask:"Toca tu librito.", game:"oir", xp:35 } },

{ id:"una-de-cada-veinte", label:"Si falla más de una palabra de cada veinte, el texto es difícil", level:2, lon:295, tier:"town", ab:3,
  view:"Es el criterio estándar para decidir qué puede leer solo y qué necesita que le lean. Por encima de un fallo cada veinte palabras, el texto sirve para lectura acompañada; por debajo, para lectura autónoma.\n\nEs fácil de aplicar sobre la marcha y evita el error más común, que es dar al niño textos demasiado difíciles porque «así se esfuerza». El esfuerzo excesivo no produce fluidez: produce adivinación y rechazo.\n\nLos dos tipos de texto hacen falta, y hacen cosas distintas.",
  kid:{ ore:"piedra", glyph:{t:"icono",k:"libro"}, say:"Este es para ti solo", ask:"Escucha y toca.", game:"oir", xp:20 } },

{ id:"quince-minutos-de-cuento", label:"Quince minutos de cuento al día, sin preguntas", level:2, lon:310, tier:"town", ab:3,
  view:"Mientras el niño aprende a descifrar, siga leyéndole textos que él no podría descifrar. Las dos cosas no compiten: alimentan cosas distintas.\n\nLa lectura en voz alta le da vocabulario, estructuras de lengua escrita que no son las del habla, conocimiento del mundo y —sobre todo— la experiencia de que un libro da placer. Ese último punto es el que decide si va a leer por su cuenta dentro de cinco años.\n\nSin preguntas de comprensión, sin evaluación, sin convertirlo en tarea. Que elija él, y que repita el mismo cuarenta veces si quiere.",
  kid:{ ore:"diamante", glyph:{t:"icono",k:"cuento"}, say:"Hora del cuento", ask:"¿Ya te leyeron hoy? Toca el cuento.", game:"oir", xp:40 } },

{ id:"mume-y-milo", label:"«mume» y «milo»: palabras que no existen", level:1, lon:35, tier:"point", ab:2, edge:["down"],
  view:"Se escriben en un papel y se le pide que las lea. No significan nada, así que no hay nada que recordar: solo se pueden descifrar.\n\nEs la prueba más exigente y la más informativa de todas, y toma diez segundos. Un niño que lee bien las palabras conocidas y falla en estas está reconociendo formas, no leyendo.\n\nPreséntelo como juego de palabras chistosas, no como examen. A los cuatro años las palabras inventadas dan risa, y esa risa es lo que permite repetir la prueba sin resistencia.",
  kid:{ ore:"diamante", glyph:{t:"palabra",w:"mume"}, say:"mume", ask:"Esta no existe. ¿Cómo suena?", game:"elegir",
        opts:["mume","mamá","mesa"], answer:"mume", xp:55 } },

{ id:"otro-color-otra-letra", label:"Otro color, otro tamaño, otra hoja", level:1, lon:60, tier:"point", ab:2, edge:["down"],
  view:"La misma sílaba escrita en verde, en grande, en una hoja arrugada, con la letra de otra persona.\n\nSi eso desarma al niño, lo que reconocía era el objeto: la tarjeta, su mancha, su doblez. Variar el soporte y repetir el contenido es la fórmula que separa el reconocimiento del signo del reconocimiento del papel.\n\nEs además la manera de involucrar a otras personas de la casa, cada una con su letra.",
  kid:{ ore:"oro", glyph:{t:"silaba",s:"mi"}, say:"mi", ask:"Otro color, misma sílaba. Tócala.", game:"elegir",
        opts:["mi","mo","ma"], answer:"mi", xp:35 } },

{ id:"su-primer-librito", label:"El primer libro que lee solo, de principio a fin", level:1, lon:75, tier:"point", ab:2, edge:["down"],
  view:"Pocas palabras por página, letra grande, mucha repetición, y ninguna letra que no conozca. Puede tener seis páginas y durar dos minutos.\n\nLo que importa no es el contenido sino el hecho: llegó al final sin ayuda. Ese día conviene guardar el libro, ponerle la fecha y decírselo a alguien.\n\nDespués vienen muchos más y cada vez más largos, pero el primero solo ocurre una vez.",
  kid:{ ore:"esmeralda", glyph:{t:"icono",k:"libro"}, say:"¡Lo leíste solo!", ask:"¿Llegaste al final? Toca el libro.", game:"oir", xp:60 } },

{ id:"una-letra-cada-dos-semanas", label:"Una consonante nueva cada dos o tres semanas", level:1, lon:155, tier:"point", ab:2, edge:["down"],
  view:"El ritmo realista para un niño de cuatro o cinco años. Al año, siete u ocho consonantes bien puestas es un buen resultado.\n\nLa tentación de acelerar viene siempre del adulto. El costo no se ve en el momento: se ve tres meses después, cuando el niño reconoce diez sílabas de manera insegura en vez de cuatro con firmeza, y esa inseguridad se arrastra.\n\nLa señal para avanzar no es el calendario: es que la anterior salga sin pausa, en desorden, escrita a mano, en dos días distintos.",
  kid:{ ore:"hierro", glyph:{t:"letra",ch:"p"}, say:"pe", ask:"La que sigue. Trázala.", game:"trazar", xp:30 } },

{ id:"bra-pla-mucho-despues", label:"bra, pla, tren: para el año que viene", level:1, lon:180, tier:"point", ab:3, edge:["down"],
  view:"Dos consonantes juntas sin vocal en medio. Son genuinamente difíciles y llegan bien entrado el segundo año.\n\nForzarlas antes de tiempo es una de las causas más frecuentes de estancamiento y de rechazo, y es un error fácil de cometer porque las palabras con trabadas son muy comunes y el adulto las echa de menos.\n\nSi un niño se traba sistemáticamente, la respuesta correcta casi siempre es consolidar las sílabas abiertas y esperar.",
  kid:{ ore:"piedra", glyph:{t:"silaba",s:"pla"}, say:"pla", ask:"Escucha esta. Es para más adelante.", game:"oir", xp:15 } },

{ id:"si-se-traba-regresa", label:"Si se traba, regresar sin decírselo", level:1, lon:195, tier:"point", ab:3, edge:["down"],
  view:"Material más fácil durante unas semanas, presentado como si fuera lo que tocaba.\n\nUn niño que percibe que retrocedió porque falló aprende algo sobre sí mismo que no se quería enseñar. Uno que simplemente practica en terreno seguro automatiza, y la automatización era lo que faltaba.\n\nEs la intervención más eficaz y la que más cuesta hacer, porque para el adulto se siente como perder tiempo.",
  kid:{ ore:"hierro", glyph:{t:"silaba",s:"ma"}, say:"ma", ask:"Esta ya te la sabes. Tócala.", game:"oir", xp:20 } },

{ id:"hojas-dobladas", label:"Cuatro hojas dobladas y una grapa", level:1, lon:275, tier:"point", ab:3, edge:["down"],
  view:"El libro se hace en cinco minutos: cuatro hojas dobladas a la mitad, una grapa en el lomo, una frase por página escrita en letra grande, y los dibujos los pone el niño.\n\nUse solo letras que él conozca y hable de él: «mi mamá me ama», «mi mano», «mi mesa», «mi moto». Ocho páginas dan para un libro entero con la m sola.\n\nPóngale título, póngale su nombre como autor, y guárdelo.",
  kid:{ ore:"oro", glyph:{t:"icono",k:"libro"}, say:"Tu libro, escrito por ti", ask:"Haz tu librito. Toca cuando esté listo.", game:"oir", xp:40 } },

{ id:"contar-los-fallos", label:"Contar cuántas falla de veinte", level:1, lon:300, tier:"point", ab:3, edge:["down"],

let AC=null;
function ac(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
       if(AC.state==="suspended") AC.resume(); }catch(e){ AC=null; }
  return AC;
}
function beep(freq,dur,type,vol,delay,slide){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,vol,delay,lp){
  const c=ac(); if(!c) return;
  const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp||1400;
  const g=c.createGain(); g.gain.value=vol||0.2;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(c.currentTime+(delay||0));
}

function burst(x,y,color,n,spread){
  const fx=document.getElementById("fx");
  for(let i=0;i<(n||14);i++){
    const d=document.createElement("div"); d.className="pt";
    const s=4+Math.random()*9;
    d.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${color};`;
    fx.appendChild(d);
    let vx=(Math.random()-0.5)*(spread||9), vy=-(2+Math.random()*7), px=0, py=0, life=0;
    (function step(){
      life++; vy+=0.42; px+=vx; py+=vy;
      d.style.transform=`translate(${px}px,${py}px) rotate(${life*11}deg)`;
      d.style.opacity=String(Math.max(0,1-life/46));
      if(life<46) requestAnimationFrame(step); else d.remove();
    })();
  }
}
function xpOrbs(x,y,n){
  const fx=document.getElementById("fx"), bar=document.getElementById("xpwrap").getBoundingClientRect();
  const tx=bar.left+bar.width/2, ty=bar.top+bar.height/2;
  for(let i=0;i<(n||8);i++){
    const d=document.createElement("div"); d.className="pt";
    d.style.cssText=`left:${x}px;top:${y}px;width:9px;height:9px;background:var(--xp);
      box-shadow:0 0 6px var(--xp);`;
    document.getElementById("fx").appendChild(d);
    const delay=i*45, sx=(Math.random()-0.5)*90, sy=(Math.random()-0.5)*70;
    let t=0;
    setTimeout(()=>{ (function step(){
      t+=0.045; const e=t<1?t*t*(3-2*t):1;
      d.style.transform=`translate(${(tx-x)*e+sx*(1-e)}px,${(ty-y)*e+sy*(1-e)}px)`;
      d.style.opacity=String(t<1?1:0);
      if(t<1.05) requestAnimationFrame(step); else { d.remove(); SFX.xp(); }
    })(); },delay);
  }
}

/* ===================== GEOMETRÍA ===================== */
const RAD=Math.PI/180, CX=200, CY=200, R=142, TILT=13;
let viewLon=0;
const levelsOf=w=>[...new Set(WORLDS[w].map(p=>p.level))].sort((a,b)=>b-a);
function latFor(level,w){ const L=levelsOf(w||S.world), i=L.indexOf(level);
  return L.length===1?0:58-(116*i/(L.length-1)); }
function project(lon,lat){
  const la=lat*RAD, lo=lon*RAD;
  const v=[Math.cos(la)*Math.sin(lo),Math.sin(la),Math.cos(la)*Math.cos(lo)];
  const a=viewLon*RAD, ca=Math.cos(a), sa=Math.sin(a);
  const x=v[0]*ca-v[2]*sa, z=v[0]*sa+v[2]*ca, y=v[1];
  const t=TILT*RAD, ct=Math.cos(t), st=Math.sin(t);
  const y2=y*ct-z*st, z2=y*st+z*ct;
  return {x:CX+R*x, y:CY-R*y2, z:z2, front:z2>-0.02};
}

const playableLayers=w=>[...new Set(WORLDS[w].filter(p=>p.kid).map(p=>p.level))].sort((a,b)=>a-b);
function layerUnlocked(w,L){
  const ls=playableLayers(w), i=ls.indexOf(L);
  if(i<=0) return true;
  const prev=WORLDS[w].filter(p=>p.kid&&p.level===ls[i-1]), m=minedSet();
  return prev.filter(p=>m.has(w+"/"+p.id)).length >= Math.ceil(prev.length*0.5);
}
function stats(){

  return {mined:S.mined.length,done:m,ores,worlds,trazos,aciertos,honda,fullWorld};
}

const NS="http://www.w3.org/2000/svg";
const E=(n,a)=>{ const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const c=i=>Math.min(255,Math.max(0,Math.round(((n>>i)&255)*f)));
  return "#"+((1<<24)+(c(16)<<16)+(c(8)<<8)+c(0)).toString(16).slice(1);
}
function cube(svg,x,y,s,color,o){
  o=o||{}; const g=E("g",{}), h=s/2;
  g.appendChild(E("rect",{x:x-h,y:y-h,width:s,height:s,fill:color,
    stroke:shade(color,.45),"stroke-width":Math.max(1,s*.1)}));
  g.appendChild(E("rect",{x:x-h,y:y-h,width:s,height:s*.3,fill:shade(color,1.28),opacity:.85}));
  g.appendChild(E("rect",{x:x-h,y:y+h-s*.26,width:s,height:s*.26,fill:shade(color,.62),opacity:.9}));
  if(o.broken) g.appendChild(E("path",{d:`M${x-h+2},${y-h+2} L${x+h-3},${y+h-3} M${x+h-2},${y-h+3} L${x-h+3},${y+h-2}`,
    stroke:"rgba(0,0,0,.55)","stroke-width":Math.max(1,s*.11),fill:"none"}));
  if(o.glow){
    const p=1.6+Math.sin(Date.now()/240)*1.6;
    g.insertBefore(E("rect",{x:x-h-3-p/2,y:y-h-3-p/2,width:s+6+p,height:s+6+p,fill:"none",
      stroke:"#fff",opacity:.62,"stroke-width":2,rx:1}),g.firstChild);
  }
  svg.appendChild(g);
}
let spin=true, dragging=false, dragVel=0, lastX=0, movedPx=0, spinHold=0;
const HIT=[];
const holdSpin=ms=>{ spinHold=Date.now()+(ms||3500); };
function drawOrb(){
  const svg=document.getElementById("orb");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const w=S.world, m=minedSet();
  svg.appendChild(E("circle",{cx:CX,cy:CY,r:R,fill:"rgba(246,243,236,.035)",
    stroke:"rgba(246,243,236,.11)","stroke-width":1}));
  levelsOf(w).forEach(L=>{
    const lat=latFor(L,w); let run=[];
    for(let a=0;a<=360;a+=6){ const q=project(a,lat);
      if(q.front) run.push(q.x.toFixed(1)+","+q.y.toFixed(1));
      else if(run.length>1){ svg.appendChild(E("polyline",{points:run.join(" "),fill:"none",
        stroke:"rgba(246,243,236,.10)","stroke-width":.9})); run=[]; } else run=[]; }
    if(run.length>1) svg.appendChild(E("polyline",{points:run.join(" "),fill:"none",
      stroke:"rgba(246,243,236,.10)","stroke-width":.9}));
  });
  HIT.length=0;
  WORLDS[w].map(p=>({p,q:project(p.lon,latFor(p.level,w))})).sort((a,b)=>a.q.z-b.q.z)
   .forEach(({p,q})=>{
    const key=w+"/"+p.id, isMined=m.has(key), strata=!p.kid;
    const layOk=strata||layerUnlocked(w,p.level);
    const active=!strata&&layOk&&!isMined;
    const base=strata?"#5a544a":(ORE_COLOR[p.kid.ore]||"#8a8a86");
    let col=base; const sz=strata?7:(6+ORE_RANK[p.kid.ore]*1.5);
    if(!q.front) col=shade(base,.42);
    if(!layOk&&!strata) col=shade("#4a443a",q.front?1:.5);
    if(isMined) col=shade(base,q.front?.42:.28);
    cube(svg,q.x,q.y,sz*(q.front?1:.72),col,{broken:isMined,glow:active&&q.front});
    /* El SVG se reconstruye cada cuadro: un escuchador aquí moriría entre el
       pointerdown y el pointerup. El toque se resuelve por cercanía. */
    if(active&&q.front) HIT.push({x:q.x,y:q.y,r:Math.max(30,sz+14),w,id:p.id});
  });
}

  if(!dragging&&Math.abs(dragVel)>0.02){ viewLon=(viewLon+dragVel+360)%360; dragVel*=0.94; }
  else if(spin&&!dragging&&Date.now()>spinHold&&!anyOverlay()) viewLon=(viewLon+0.13+360)%360;
  drawOrb(); requestAnimationFrame(tick);
}

  document.getElementById("pask").textContent=k.ask;
  const f=document.getElementById("pfeed"); f.textContent=""; f.className="";
  const done=document.getElementById("pdone");
  done.disabled = k.game!=="oir"; done.textContent = k.game==="oir"?"¡Listo!":"…";
  done.className = k.game==="oir"?"act go":"act";
  buildGame(k);
  document.getElementById("panel").classList.add("on");
  SFX.tap();
  setTimeout(()=>say(k.ask),240);
}
function closePanel(){ document.getElementById("panel").classList.remove("on"); CUR=null; holdSpin(2500); }
function nope(){
  const f=document.getElementById("pfeed"); f.className="bad"; f.textContent=pick(ANIMO);
  SFX.no(); shake(document.getElementById("pglyph"));
  say(f.textContent,0.9);
}
function win(){
  if(solved) return; solved=true;
  const f=document.getElementById("pfeed"); f.className=""; f.textContent=pick(BRAVO);
  SFX.ok(); say(f.textContent,0.95);
  const b=document.getElementById("pdone");
  b.disabled=false; b.className="act go"; b.textContent="⛏️ ¡Rómpelo!";
  /* solo salta si el panel sigue abierto y no se ha cerrado a mano */
  setTimeout(()=>{ if(CUR && document.getElementById("panel").classList.contains("on")) openSmash(); },1100);
}

/* ---- la recompensa: romper el bloque manteniendo el dedo ---- */
let smashTimer=null, smashStage=0;
function openSmash(){
  if(!CUR) return;
  const k=CUR.p.kid, blk=document.getElementById("smashblk");
  const label = k.glyph.s||k.glyph.w||k.glyph.ch||k.glyph.t2||
                (k.glyph.t==="renglon"?k.glyph.s.join(" "):"")||ICON[k.glyph.k]||"⛏️";
  blk.querySelector(".txt").textContent=label;
  blk.style.background=ORE_COLOR[k.ore]; blk.style.borderColor=shade(ORE_COLOR[k.ore],.45);
  blk.querySelector(".txt").style.color = ORE_RANK[k.ore]>=5?"#0a2a1a":"#fff";
  document.getElementById("crack").innerHTML=""; document.getElementById("crack").style.opacity=0;
  smashStage=0;
  document.getElementById("panel").classList.remove("on");
  document.getElementById("smash").classList.add("on");
}
function crackStage(n){
  const c=document.getElementById("crack");
  c.style.opacity=1;
  const seeds=[[50,50,20,12],[24,30,40,70],[70,22,30,80],[18,74,80,26]];
  let d="";
  for(let i=0;i<n && i<seeds.length;i++){ const s=seeds[i];
    d+=`M${s[0]},${s[1]} L${s[2]},${s[3]} `; }
  c.innerHTML=`<path d="${d}" stroke="rgba(0,0,0,.75)" stroke-width="${3+n}" fill="none"
    stroke-linecap="round"/>`;
}
(function bindSmash(){
  const blk=document.getElementById("smashblk");
  const stop=()=>{ if(smashTimer){ clearInterval(smashTimer); smashTimer=null; } };
  const hit=()=>{
    smashStage++; crackStage(smashStage); SFX.crack();
    blk.classList.remove("hit"); void blk.offsetWidth; blk.classList.add("hit");
    if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
    if(smashStage>=4){ stop(); doBreak(); }
  };
  /* Mantener apretado O dar cuatro golpes: las dos cosas rompen el bloque, y
     el progreso nunca se pierde al soltar. Un dedo de cuatro años no sostiene. */
  blk.addEventListener("pointerdown",e=>{
    e.preventDefault(); ac(); if(smashTimer) return;
    hit(); if(smashStage>=4) return;
    smashTimer=setInterval(hit,210);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>blk.addEventListener(ev,stop));
})();
function doBreak(){
  const blk=document.getElementById("smashblk"), r=blk.getBoundingClientRect();
  const k=CUR.p.kid, key=CUR.w+"/"+CUR.id;
  SFX.brk();
  burst(r.left+r.width/2, r.top+r.height/2, ORE_COLOR[k.ore], 30, 15);
  if(navigator.vibrate){ try{ navigator.vibrate(45); }catch(e){} }
  document.getElementById("smash").classList.remove("on");
  if(!minedSet().has(key)){
    S.mined.push(key);
    addXP(k.xp, r.left+r.width/2, r.top+r.height/2);
  }
  persist(); checkLogros();
  paintHUD(); paintLayers(); paintHotbar(); paintHint(); paintA11y();
  topoSay("happy", pick(BRAVO));
  say(k.say,0.8);
  CUR=null; holdSpin(2200);
}

function buildGame(k){
  const box=document.getElementById("pgame"); box.innerHTML="";
  const mk=(t,cls)=>{ const b=document.createElement("button");
    b.className="tile"+(cls?" "+cls:""); b.textContent=t; return b; };
  if(k.game==="oir") return;

  if(k.game==="elegir"){
    const rounds=k.rounds||1; let r=0, target=null;
    const wrap=document.createElement("div"); wrap.className="tiles"; box.appendChild(wrap);
    const prog=document.createElement("div");
    prog.style.cssText="text-align:center;font:700 12px var(--mono);color:rgba(246,243,236,.45);margin-top:8px";
    box.appendChild(prog);
    (function round(){
      wrap.innerHTML="";
      target = k.free?null:(k.rounds?shuffle(k.opts.slice())[0]:(k.answer!=null?k.answer:k.opts[0]));
      prog.textContent = rounds>1 ? "⛏️ "+(r+1)+" / "+rounds : "";
      if(target) setTimeout(()=>say(target,0.78),480);
      shuffle(k.opts.slice()).forEach(o=>{
        const b=mk(o,o.length>4?"sm":"");
        b.onclick=()=>{
          if(k.free){ b.classList.add("ok"); SFX.tap(); win(); return; }
          if(o===target){ b.classList.add("ok"); const q=b.getBoundingClientRect();
            burst(q.left+q.width/2,q.top+q.height/2,"var(--emerald)",12,8);
            r++; if(r>=rounds) win(); else setTimeout(round,760); }
          else { b.classList.add("no"); nope(); setTimeout(()=>b.classList.remove("no"),620); }
        };
        wrap.appendChild(b);
      });
    })();
    return;
  }

  if(k.game==="ordenar"||k.game==="formar"){
    const seq = k.game==="ordenar"?k.opts:k.parts;
    const pool = k.game==="ordenar"?k.opts.slice():k.parts.concat(k.distract||[]);
    let i=0;
    const out=document.createElement("div");
    out.style.cssText="text-align:center;font:800 34px var(--sans);min-height:46px;letter-spacing:.04em;color:var(--gold)";
    box.appendChild(out);
    const wrap=document.createElement("div"); wrap.className="tiles"; wrap.style.marginTop="6px";
    box.appendChild(wrap);
    shuffle(pool).forEach(o=>{
      const b=mk(o,"sm");
      b.onclick=()=>{
        if(o===seq[i]){
          b.classList.add("ok"); b.disabled=true; say(o,0.75); SFX.tap();
          const q=b.getBoundingClientRect();
          burst(q.left+q.width/2,q.top+q.height/2,"var(--emerald)",9,7);
          out.textContent += (k.game==="formar"?o:(out.textContent?" ":"")+o);
          i++;
          if(i>=seq.length) setTimeout(()=>{ say(seq.join(k.game==="formar"?"":" "),0.8); win(); },480);
        } else { b.classList.add("no"); nope(); setTimeout(()=>b.classList.remove("no"),620); }
      };
      wrap.appendChild(b);
    });
    return;
  }

  if(k.game==="contar"){
    /* Se puede pasar de largo, así que siempre hay marcha atrás:
       fichas visibles, un botón de borrar, y tope duro. */
    let n=0;
    const tally=document.createElement("div"); tally.id="tally"; box.appendChild(tally);
    const pad=document.createElement("button"); pad.className="bigpad";
    pad.innerHTML="👆<br><span style='font-size:15px'>toca aquí</span>"; box.appendChild(pad);
    const row=document.createElement("div"); row.className="row"; box.appendChild(row);
    const clr=document.createElement("button"); clr.className="act ghost"; clr.textContent="↺ Borrar";
    const done=document.createElement("button"); done.className="act"; done.textContent="Ya conté";
    row.appendChild(clr); row.appendChild(done);
    const cap=(k.answer||8)+4;
    const paint=()=>{
      tally.innerHTML="";
      for(let i=1;i<=n;i++){ const d=document.createElement("div"); d.className="tb"; d.textContent=i;
        tally.appendChild(d); }
      pad.style.opacity = n>=cap ? .45 : 1;
    };
    clr.onclick=()=>{ n=0; paint(); SFX.tap();
      const f=document.getElementById("pfeed"); f.textContent=""; f.className=""; };
    pad.onclick=()=>{
      if(solved||n>=cap) return;
      n++; paint(); SFX.tap(); say(String(n),1.15);
      if(!k.free && n===k.answer) setTimeout(()=>{ if(!solved) win(); },520);
    };
    done.onclick=()=>{ if(k.free||n===k.answer) win();
      else { nope(); setTimeout(()=>{ n=0; paint(); },700); } };
    paint(); return;
  }

  if(k.game==="trazar"){
    const ch=(k.glyph&&k.glyph.ch)||"m", pts=TRACE[ch]||TRACE.m;
    let i=0;
    const svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 100 112");
    svg.style.cssText="width:min(66vw,250px);height:auto;display:block;margin:0 auto";
    const line=E("polyline",{points:"",fill:"none",stroke:"var(--gold)","stroke-width":"8",
      "stroke-linecap":"round","stroke-linejoin":"round"});
    svg.appendChild(line);
    pts.forEach((p,idx)=>{
      const c=E("circle",{cx:p[0],cy:p[1],r:9,fill:idx===0?"var(--emerald)":"#3b342a",
        stroke:"#241f18","stroke-width":3});
      const t=E("text",{x:p[0],y:p[1]+4,"text-anchor":"middle",fill:"#fff",
        style:"font:700 10px var(--mono);pointer-events:none"}); t.textContent=idx+1;
      const hit=E("circle",{cx:p[0],cy:p[1],r:17,fill:"transparent"});
      hit.style.cursor="pointer";
      hit.addEventListener("click",()=>{
        if(idx!==i){ nope(); return; }
        c.setAttribute("fill","var(--gold)"); SFX.tap();
        line.setAttribute("points",(line.getAttribute("points")+" "+p[0]+","+p[1]).trim());
        i++;
        if(i>=pts.length){ say(k.say,0.8); win(); }
      });
      svg.appendChild(c); svg.appendChild(t); svg.appendChild(hit);
    });
    box.appendChild(svg); return;
  }
}
const TRACE={
  m:[[18,86],[18,30],[34,22],[50,38],[50,86],[66,22],[82,38],[82,86]],
  p:[[22,100],[22,30],[44,24],[60,40],[44,58],[22,58]],
  a:[[62,34],[42,26],[30,44],[42,62],[62,58],[62,30],[62,86]],
  n:[[22,86],[22,30],[42,22],[58,40],[58,86]]
};

/* ===================== HUD / CAPAS / HOTBAR / COFRE ===================== */
const WICON={oral:"👂",silabario:"🔤",palabras:"🧩",oracion:"📝",lector:"📖"};
function paintHUD(){
  document.getElementById("wname").textContent=THREAD.find(x=>x.id===S.world).label;
  const ps=WORLDS[S.world].filter(p=>p.kid), m=minedSet();
  document.getElementById("wsub").textContent=
    ps.filter(p=>m.has(S.world+"/"+p.id)).length+" de "+ps.length+" bloques";
  document.getElementById("lvl").textContent=level();
  document.getElementById("xpbar").style.width=(intoLevel()/LVLSTEP*100)+"%";
  document.getElementById("xptext").textContent=S.xp+" XP";
}
function paintLayers(){
  const bar=document.getElementById("layerbar"); bar.innerHTML="";
  const ls=playableLayers(S.world), m=minedSet();
  if(S.layer===null||!ls.includes(S.layer)) S.layer=ls[0];
  ls.forEach(L=>{
    const ok=layerUnlocked(S.world,L);
    const ps=WORLDS[S.world].filter(p=>p.kid&&p.level===L);
    const done=ps.filter(p=>m.has(S.world+"/"+p.id)).length;
    const d=document.createElement("div");
    d.className="lay"+(ok?"":" locked")+(L===S.layer?" on":"");
    if(ok) d.style.background=ORE_COLOR[ps[0].kid.ore];
    d.textContent=ok?(done+"/"+ps.length):"🔒";
    if(ok) d.onclick=()=>{ S.layer=L; persist(); SFX.tap(); paintLayers(); paintHint(); paintA11y(); };
    bar.appendChild(d);
  });
}
function paintHotbar(){
  const hb=document.getElementById("hotbar"); hb.innerHTML="";
  THREAD.forEach(t=>{
    const ok=worldUnlocked(t.id), m=minedSet();
    const ps=WORLDS[t.id].filter(p=>p.kid);
    const done=ps.filter(p=>m.has(t.id+"/"+p.id)).length;
    const s=document.createElement("button");
    s.className="slot"+(t.id===S.world?" on":"")+(ok?"":" locked");
    s.innerHTML=`<i>${WICON[t.id]}</i><b>${done}/${ps.length}</b>`+
      (ok?"":`<span class="need">🔒 ${UNLOCK[t.id]}</span>`);
    if(ok) s.onclick=()=>{ S.world=t.id; S.layer=null; persist(); SFX.tap();
      paintHUD(); paintLayers(); paintHotbar(); paintHint(); paintA11y(); holdSpin(2000); };
    hb.appendChild(s);
  });
}
function paintHint(){
  const m=minedSet(), ps=WORLDS[S.world].filter(p=>p.kid&&p.level===S.layer);
  const left=ps.filter(p=>!m.has(S.world+"/"+p.id)).length;
  document.getElementById("hint").textContent = left ? "⛏️ Toca un bloque que brille"
    : "¡Capa lista! Baja a la siguiente ▼";
}
function paintA11y(){
  const ul=document.getElementById("a11y"); ul.innerHTML=""; const m=minedSet();
  WORLDS[S.world].filter(p=>p.kid&&!m.has(S.world+"/"+p.id)&&layerUnlocked(S.world,p.level))
    .forEach(p=>{ const li=document.createElement("li"), b=document.createElement("button");
      b.textContent=p.label+" — "+p.kid.ask; b.onclick=()=>openBlock(S.world,p.id);
      li.appendChild(b); ul.appendChild(li); });
}
function paintChest(){
  const g=document.getElementById("chestgrid"); g.innerHTML="";
  const m=minedSet(); let n=0;
  Object.keys(WORLDS).forEach(w=>WORLDS[w].filter(p=>p.kid&&m.has(w+"/"+p.id)).forEach(p=>{
    n++; const k=p.kid;
    const label=k.glyph.s||k.glyph.w||k.glyph.ch||k.glyph.t2||
      (k.glyph.t==="renglon"?k.glyph.s.join(" "):"")||ICON[k.glyph.k]||"⛏️";
    const c=document.createElement("button"); c.className="cell";
    c.style.background=ORE_COLOR[k.ore];
    c.style.color=ORE_RANK[k.ore]>=5?"#0a2a1a":"#fff";
    c.style.fontSize=String(label).length>6?"12px":"19px";
    c.textContent=label;
    c.onclick=()=>{ SFX.tap(); say(k.say,0.8); };
    g.appendChild(c);
  }));
  for(let i=n;i<Math.max(12,Math.ceil(n/6)*6+6);i++){
    const e=document.createElement("div"); e.className="cellempty"; g.appendChild(e); }
  document.querySelector("#chest .hd h2").textContent="Mi cofre — "+n+" bloques";
}

/* ===================== PUERTA DEL ADULTO ===================== */
let gateOK=false, lastBlock=null;
function openParent(){
  const b=document.getElementById("pbody");
  if(!gateOK){
    b.innerHTML=`<div class="gate"><p>Esta parte es para el adulto que enseña.<br>
      Toca en orden: <b>7 · 3 · 9</b></p>
      <div class="gnum">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div></div>`;
    let seq=[];
    b.querySelectorAll("[data-n]").forEach(btn=>btn.onclick=()=>{
      seq.push(+btn.dataset.n);
      if(seq.length===3){ if(seq.join()==="7,3,9"){ gateOK=true; openParent(); } else seq=[]; }
    });
  } else {
    const p = (CUR&&CUR.p) || lastBlock ||
      WORLDS[S.world].find(x=>x.level===Math.max(...WORLDS[S.world].map(y=>y.level)));
    const t=THREAD.find(x=>x.id===S.world);
    b.innerHTML=`<h3>${p.label}</h3><div class="meta">${t.label} · altitud ${p.level} · `+
      (p.kid?"bloque jugable ("+p.kid.ore+")":"estrato — no se mina")+`</div>`+
      p.view.split("\n\n").map(x=>"<p>"+x.replace(/</g,"&lt;")+"</p>").join("")+
      `<div class="strata">Este texto nunca aparece en la pantalla del niño. Los bloques de altitud 5 y 6
      son lecho de roca: se ven, no se minan, y guardan las lecturas de fondo. La capa del niño lleva
      sonido, voz y una recompensa física; la del adulto lleva el porqué.</div>`;
  }
  document.getElementById("parent").classList.add("on");
}

/* ===================== ENTRADA TÁCTIL ===================== */
const svgEl=document.getElementById("orb");
function svgPoint(e){
  try{ const m=svgEl.getScreenCTM(); if(!m) return null;
    const pt=svgEl.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    return pt.matrixTransform(m.inverse()); }catch(err){ return null; }
}
function tapAt(q){
  if(!q) return false;
  let best=null,bd=Infinity;
  for(const h of HIT){ const d=Math.hypot(h.x-q.x,h.y-q.y); if(d<=h.r&&d<bd){ bd=d; best=h; } }
  if(best){ holdSpin(60000); lastBlock=WORLDS[best.w].find(p=>p.id===best.id);
            openBlock(best.w,best.id); return true; }
  return false;
}
svgEl.addEventListener("pointerdown",e=>{ dragging=true; lastX=e.clientX; dragVel=0; movedPx=0;
  holdSpin(); ac(); try{ svgEl.setPointerCapture(e.pointerId); }catch(err){} });
svgEl.addEventListener("pointermove",e=>{ if(!dragging) return;
  const raw=e.clientX-lastX; movedPx+=Math.abs(raw);
  viewLon=(viewLon+raw*0.4+360)%360; dragVel=raw*0.4; lastX=e.clientX; });
svgEl.addEventListener("pointerup",e=>{ const drag=movedPx>12; dragging=false; holdSpin();
  if(drag) return; dragVel=0; tapAt(svgPoint(e)); });
["pointercancel","pointerleave"].forEach(ev=>svgEl.addEventListener(ev,()=>{ dragging=false; holdSpin(); }));
svgEl.addEventListener("click",e=>{ if(movedPx<=12&&!CUR) tapAt(svgPoint(e)); });
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

document.getElementById("pclose").onclick=closePanel;
document.getElementById("psay").onclick=()=>{ if(CUR){ SFX.tap(); say(CUR.p.kid.say,0.72); } };
document.getElementById("pdone").onclick=()=>{
  if(!CUR) return closePanel();
  if(solved){ openSmash(); return; }
  if(CUR.p.kid.game==="oir"){ win(); return; }
  closePanel();
};
document.getElementById("adultbtn").onclick=openParent;
document.getElementById("pxclose").onclick=()=>document.getElementById("parent").classList.remove("on");
document.getElementById("chestbtn").onclick=()=>{ SFX.tap(); paintChest();
  document.getElementById("chest").classList.add("on"); };
document.getElementById("chestx").onclick=()=>document.getElementById("chest").classList.remove("on");
document.getElementById("smashskip").onclick=()=>{ smashStage=4; doBreak(); };
document.getElementById("topo").onclick=()=>{ topoSay("happy","¡Vamos a picar bloques!"); SFX.tap(); };

/* ===================== ARRANQUE ===================== */
function fitViewBox(){
  const wrap=document.getElementById("globewrap");
  const w=wrap.clientWidth,h=wrap.clientHeight,s=Math.min(w,h);
  svgEl.setAttribute("viewBox",`${(400-400*w/s)/2} ${(400-400*h/s)/2} ${400*w/s} ${400*h/s}`);
}
addEventListener("resize",fitViewBox);
if(!worldUnlocked(S.world)) S.world="oral";
drawTopo("idle");
fitViewBox(); paintHUD(); paintLayers(); paintHotbar(); paintHint(); paintA11y();
checkLogros();
requestAnimationFrame(tick);
</script>
